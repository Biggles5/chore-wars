<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Algebra 2 Beast Academy</title>
<style>
:root{
  --bg:#0b1020; --bg2:#111832; --card:#161f3d; --card2:#1c2750; --line:#28345f;
  --txt:#e8ecff; --dim:#8b96c9; --gold:#ffb830; --orange:#ff7a2f; --red:#ff4d6a;
  --green:#3ddc84; --blue:#4d9fff; --purple:#a78bfa; --cyan:#2fd4d4; --pink:#ff6bcb;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100%}
body{padding-bottom:76px}
button{font-family:inherit;cursor:pointer;border:none}
input,select{font-family:inherit}
.wrap{max-width:860px;margin:0 auto;padding:12px}
/* top bar */
.top{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#0b1020 70%,rgba(11,16,32,.92));backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.topin{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 12px}
.logo{font-weight:900;font-size:16px;letter-spacing:.5px;background:linear-gradient(90deg,var(--gold),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.pill{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill .ic{font-size:13px}
.spacer{flex:1}
/* xp bar */
.xpbar{height:5px;background:var(--card);border-radius:99px;overflow:hidden;margin:0 12px 0}
.xpin{max-width:860px;margin:0 auto}
.xpbar>div{height:100%;background:linear-gradient(90deg,var(--gold),var(--orange));border-radius:99px;transition:width .5s}
/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:#0d1328;border-top:1px solid var(--line)}
.navin{max-width:860px;margin:0 auto;display:flex}
.nbtn{flex:1;background:none;color:var(--dim);padding:9px 2px 10px;font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
.nbtn .nic{font-size:20px;line-height:1}
.nbtn.on{color:var(--gold)}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;animation:fadeIn .3s}
.card.click{cursor:pointer;transition:transform .12s,border-color .12s}
.card.click:hover{transform:translateY(-2px);border-color:var(--gold)}
.card.click:active{transform:scale(.98)}
h2{font-size:17px;margin-bottom:8px}
h3{font-size:14px;margin-bottom:6px}
.sub{color:var(--dim);font-size:12.5px;line-height:1.5}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
/* buttons */
.btn{background:linear-gradient(90deg,var(--gold),var(--orange));color:#1a1200;font-weight:900;border-radius:12px;padding:12px 18px;font-size:14px;transition:transform .1s;box-shadow:0 4px 14px rgba(255,150,40,.25)}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn.grn{background:linear-gradient(90deg,#2bc76f,#3ddc84);color:#04250f}
.btn.red{background:linear-gradient(90deg,#e33f5c,#ff4d6a);color:#fff}
.btn.blu{background:linear-gradient(90deg,#3a7fe0,#4d9fff);color:#eaf3ff}
.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* progress bars */
.bar{height:9px;background:#0e1530;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar>div{height:100%;border-radius:99px;transition:width .6s}
.m0{background:#454f7c}.m1{background:var(--red)}.m2{background:var(--orange)}.m3{background:var(--gold)}.m4{background:var(--green)}.m5{background:linear-gradient(90deg,var(--cyan),var(--purple))}
.mtag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;white-space:nowrap}
.t0{background:#2a335e;color:#9aa5d6}.t1{background:#4a1626;color:#ff8ba0}.t2{background:#4a2c12;color:#ffb27a}.t3{background:#4a3a0e;color:#ffd97a}.t4{background:#0e3a22;color:#7dedae}.t5{background:#241b4a;color:#c9b8ff}
/* skill tree */
.unit{border-left:4px solid var(--gold)}
.chev{color:var(--dim);font-size:13px;transition:transform .2s}
.chev.open{transform:rotate(90deg)}
.skrow{display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid var(--line);cursor:pointer;border-radius:8px}
.skrow:hover{background:rgba(255,255,255,.03)}
.lock{opacity:.45}
/* training */
.qcard{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px;font-size:17px;line-height:1.65}
.qmeta{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ansin{width:100%;background:#0e1530;border:2px solid var(--line);color:var(--txt);border-radius:12px;padding:13px 14px;font-size:17px;outline:none}
.ansin:focus{border-color:var(--gold)}
.ansin.ok{border-color:var(--green)}
.ansin.bad{border-color:var(--red)}
.mcbtn{display:block;width:100%;text-align:left;background:#0e1530;border:2px solid var(--line);color:var(--txt);border-radius:12px;padding:13px 14px;font-size:15.5px;margin-bottom:8px;transition:border-color .12s}
.mcbtn:hover{border-color:var(--gold)}
.mcbtn.pick{border-color:var(--blue);background:#12204a}
.mcbtn.ok{border-color:var(--green);background:#0e2c1c}
.mcbtn.bad{border-color:var(--red);background:#33121c}
.fb{border-radius:14px;padding:14px;margin-bottom:12px;font-size:14px;line-height:1.6;animation:fadeIn .25s}
.fb.ok{background:#0e2c1c;border:1px solid #1f5c3a}
.fb.bad{background:#33121c;border:1px solid #6b2438}
.fb.hint{background:#12204a;border:1px solid #27408f}
.big{font-size:22px;font-weight:900}
.center{text-align:center}
sup{font-size:.68em}
.math{font-family:"Cambria Math",Georgia,serif}
.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 3px;line-height:1.15}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px}
.frac>span:last-child{padding:0 4px}
/* misc */
.chip{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:11.5px;font-weight:700;margin:2px 3px 2px 0;color:var(--dim)}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.badge .bic{font-size:26px;filter:grayscale(1);opacity:.35}
.badge.got .bic{filter:none;opacity:1}
.badge .bn{font-size:10.5px;font-weight:800}
.badge .bd{font-size:9.5px;color:var(--dim)}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat .sv{font-size:20px;font-weight:900}
.stat .sl{font-size:10.5px;color:var(--dim);font-weight:700;margin-top:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#1c2750;border:1px solid var(--gold);color:var(--txt);padding:11px 18px;border-radius:14px;font-weight:800;font-size:13.5px;z-index:99;animation:pop .3s;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center}
.timer{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.flame{animation:float 2s ease-in-out infinite;display:inline-block}
table.rt{width:100%;border-collapse:collapse;font-size:12.5px}
table.rt td,table.rt th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
table.rt th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.hero{background:linear-gradient(135deg,#1a1030,#131f45 60%,#0e2c3a);border:1px solid #34406f;border-radius:18px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;top:-40px;right:-40px;width:160px;height:160px;background:radial-gradient(circle,rgba(255,184,48,.18),transparent 70%)}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.8)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes glow{0%,100%{box-shadow:0 0 10px rgba(255,122,47,.35)}50%{box-shadow:0 0 26px rgba(255,122,47,.7)}}
.beastcard{border:1px solid #6b3a12;background:linear-gradient(135deg,#2a1408,#3a1c0a);animation:glow 2.4s infinite}
/* lesson steps */
.wex{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px}
.wexp{font-family:"Cambria Math",Georgia,serif;font-size:19px;font-weight:700;padding:10px 12px;background:#0e1530;border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.steps{margin-left:13px;border-left:2px solid var(--line)}
.step{position:relative;padding:7px 0 7px 22px;animation:fadeIn .35s}
.stepn{position:absolute;left:-13px;top:10px;width:24px;height:24px;border-radius:50%;background:var(--card);border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:var(--gold)}
.stepm{font-family:"Cambria Math",Georgia,serif;font-size:17px;line-height:1.5}
.stepw{color:var(--dim);font-size:12.5px;line-height:1.5;margin-top:2px}
.step.final .stepn{background:var(--gold);color:#1a1200}
.coach{background:linear-gradient(90deg,#12204a,#1a1a3e);border:1px solid #3d55b0;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:13.5px;line-height:1.5;animation:fadeIn .3s}
/* show-your-work */
.workarea{background:#0e1530;border:1px dashed #3a4a85;border-radius:14px;padding:10px;margin-top:12px}
.workarea canvas{width:100%;height:240px;background:#0a0f24;border-radius:10px;touch-action:none;cursor:crosshair;display:block}
.workarea textarea{width:100%;min-height:70px;background:#0a0f24;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font-size:14px;margin-top:8px;font-family:inherit;resize:vertical}
.workimg{max-width:100%;border-radius:10px;border:1px solid var(--line);background:#0a0f24}
.workpre{white-space:pre-wrap;font-size:13.5px;background:#0a0f24;border-radius:10px;padding:10px;border:1px solid var(--line)}
/* top-bar icon buttons */
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--txt);font-size:15px;padding:5px 9px;line-height:1}
.iconbtn.on{border-color:var(--gold);background:#2a2410}
/* combo */
.combo{background:linear-gradient(90deg,#4a1626,#4a2c12);border:1px solid var(--orange);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:900;color:var(--gold);animation:glow 1.6s infinite}
/* search */
.searchin{width:100%;background:#0e1530;border:2px solid var(--line);color:var(--txt);border-radius:14px;padding:13px 16px;font-size:16px;outline:none}
.searchin:focus{border-color:var(--gold)}
.sres{display:flex;align-items:center;gap:10px;padding:11px 10px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:10px}
.sres:hover{background:rgba(255,255,255,.04)}
/* labs */
.labstage{border-left:3px solid var(--line);padding:8px 0 8px 14px;margin-left:6px}
.labstage.done{border-color:var(--green);opacity:.75}
.labstage.now{border-color:var(--gold)}
.stars{color:var(--gold);letter-spacing:2px}
/* chat */
.chatwrap{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;border-radius:16px;padding:11px 14px;font-size:14px;line-height:1.6;animation:fadeIn .25s;white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,#2a3a7e,#1d2b63);border:1px solid #3d55b0}
.msg.bot{align-self:flex-start;background:var(--card2);border:1px solid var(--line)}
.msg.bot b{color:var(--gold)}
.msg .who{font-size:10px;font-weight:800;color:var(--dim);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.chatbar{display:flex;gap:8px;margin-top:10px}
.chatbar input{flex:1;background:#0e1530;border:2px solid var(--line);color:var(--txt);border-radius:12px;padding:12px 14px;font-size:15px;outline:none}
.chatbar input:focus{border-color:var(--gold)}
.qchip{display:inline-block;background:#12204a;border:1px solid #27408f;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;margin:3px 4px 3px 0;cursor:pointer;color:#a9c2ff}
.qchip:hover{border-color:var(--gold)}
.typing{display:inline-block}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--dim);margin:0 2px;animation:float 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
.hidden{display:none!important}
a{color:var(--blue)}
@media(max-width:480px){.logo{font-size:12.5px}.pill{padding:3px 8px;font-size:10.5px;gap:3px}.topin{gap:5px;padding:8px 8px}}
</style>
</head>
<body>

<div class="top">
  <div class="topin">
    <div class="logo">⚡ A2 BEAST ACADEMY</div>
    <div class="spacer"></div>
    <button class="iconbtn" id="musicBtn" title="Study beats" onclick="MUSIC.cycle()">🔇</button>
    <button class="iconbtn" title="Search" onclick="go('search')">🔍</button>
    <div class="pill" id="pillStreak"><span class="ic flame">🔥</span><span>0</span></div>
    <div class="pill" id="pillLvl"><span class="ic">🏅</span><span>Lv 1</span></div>
    <div class="pill" id="pillXp"><span class="ic">⭐</span><span>0 XP</span></div>
  </div>
  <div class="xpin"><div class="xpbar"><div id="xpFill" style="width:0%"></div></div></div>
</div>

<div class="wrap" id="main"></div>

<div class="nav"><div class="navin">
  <button class="nbtn" data-v="home"><span class="nic">🏠</span>Home</button>
  <button class="nbtn" data-v="tree"><span class="nic">🌳</span>Skills</button>
  <button class="nbtn" data-v="battle"><span class="nic">⚔️</span>Battle</button>
  <button class="nbtn" data-v="chat"><span class="nic">🤖</span>Tutor</button>
  <button class="nbtn" data-v="stats"><span class="nic">📊</span>Stats</button>
  <button class="nbtn" data-v="ref"><span class="nic">📚</span>Study</button>
</div></div>

<script>
/* ============================================================
   ALGEBRA 2 BEAST ACADEMY — single-file, no dependencies.
   Vanilla ES5 (var / function / .then per repo conventions).
   Progress persists in localStorage. Aligned to Missouri
   Learning Standards Algebra II (Branson Public Schools
   follows MLS; Algebra II EOC is the state assessment).
   ============================================================ */

/* ---------- utils ---------- */
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(a){var i,j,t;a=a.slice();for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function nz(n){return n===0?0:n;} // normalize -0
function sgn(n){return n<0?"−":"+";}
function abs(n){return Math.abs(n);}
function sup(s){return "<sup>"+s+"</sup>";}
function xN(p){return p===1?"x":(p===0?"":"x"+sup(p));}
// format a term like "+ 3x^2" with proper signs; first=true drops leading +
function term(c,pow,first){
  if(c===0)return "";
  var s=(c<0?"−":(first?"":"+"))+" ";
  if(first&&c>=0)s="";
  var a=Math.abs(c);
  var v=xN(pow);
  var body=(pow>0&&a===1)?v:(a+v);
  return (first?"":" ")+s.replace(/ $/,(first?"":" "))+body;
}
// build polynomial string from coeff array [c_n,...,c_0]
function polyStr(coefs){
  var deg=coefs.length-1,out="",first=true,i;
  for(i=0;i<coefs.length;i++){
    var c=coefs[i],p=deg-i;
    if(c===0)continue;
    var a=Math.abs(c),v=xN(p),body=(p>0&&a===1)?v:(a+v);
    if(first){out+=(c<0?"−":"")+body;first=false;}
    else{out+=" "+(c<0?"−":"+")+" "+body;}
  }
  return out===""?"0":out;
}
function frac(n,d){ // reduced fraction string
  var g=gcd(n,d);n/=g;d/=g;
  if(d<0){d=-d;n=-n;}
  if(d===1)return ""+n;
  return n+"/"+d;
}
function fracHtml(n,d){
  var s=frac(n,d);
  if(s.indexOf("/")<0)return s;
  var p=s.split("/");
  return '<span class="frac"><span>'+p[0]+'</span><span>'+p[1]+'</span></span>';
}
function plural(n,s){return n+" "+s+(n===1?"":"s");}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function todayKey(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function daysBetween(a,b){return Math.floor(Math.abs(b-a)/86400000);}

/* ---------- tiny sound engine ---------- */
var SFX=(function(){
  var ctx=null,on=true;
  function c(){if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){on=false;}}return ctx;}
  function tone(f,t,dur,type,vol){
    if(!on||!c())return;
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type||"sine";o.frequency.value=f;
    g.gain.setValueAtTime(vol||.12,ctx.currentTime+t);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+dur);
    o.connect(g);g.connect(ctx.destination);
    o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+dur+.02);
  }
  return {
    ok:function(){tone(523,0,.12);tone(659,.09,.12);tone(784,.18,.2);},
    bad:function(){tone(196,0,.2,"sawtooth",.07);tone(155,.14,.25,"sawtooth",.07);},
    level:function(){tone(523,0,.1);tone(659,.08,.1);tone(784,.16,.1);tone(1047,.24,.3);},
    badge:function(){tone(659,0,.1);tone(880,.09,.1);tone(1175,.18,.3);},
    click:function(){tone(880,0,.05,"square",.04);},
    tick:function(){tone(1200,0,.04,"square",.03);}
  };
})();

/* ---------- study beats: procedural music engine (no audio files) ---------- */
var MUSIC=(function(){
  var ctx=null,master=null,noiseBuf=null,timer=null,nextBar=0,barNo=0,station=0;
  // stations: 0 off, 1 lo-fi chill, 2 synthwave grind
  var LOFI={bar:2.4,chords:[[53,57,60,64],[45,48,52,55],[50,53,57,60],[43,47,50,53]]};      // Fmaj7 Am7 Dm7 G7 (midi)
  var SYNTH={bar:1.6,chords:[[45,48,52],[41,45,48],[43,47,50],[40,43,47]]};                  // Am F G Em
  function hz(m){return 440*Math.pow(2,(m-69)/12);}
  function c(){
    if(!ctx){
      try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}
      master=ctx.createGain();master.gain.value=.5;master.connect(ctx.destination);
      var len=ctx.sampleRate*2,b=ctx.createBuffer(1,len,ctx.sampleRate),d=b.getChannelData(0),i;
      for(i=0;i<len;i++)d[i]=Math.random()*2-1;
      noiseBuf=b;
    }
    return ctx;
  }
  function env(g,t,a,peak,dur){
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(peak,t+a);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  }
  function osc(type,f,t,dur,peak,att,filt){
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.value=f;
    env(g,t,att,peak,dur);
    if(filt){var lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=filt;o.connect(lp);lp.connect(g);}
    else o.connect(g);
    g.connect(master);o.start(t);o.stop(t+dur+.05);
  }
  function noise(t,dur,peak,hp){
    var s=ctx.createBufferSource(),g=ctx.createGain(),f=ctx.createBiquadFilter();
    s.buffer=noiseBuf;s.loop=true;
    f.type=hp?"highpass":"lowpass";f.frequency.value=hp||1200;
    env(g,t,.005,peak,dur);
    s.connect(f);f.connect(g);g.connect(master);
    s.start(t);s.stop(t+dur+.05);
  }
  function kick(t){var o=ctx.createOscillator(),g=ctx.createGain();
    o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);
    env(g,t,.004,.5,.22);o.connect(g);g.connect(master);o.start(t);o.stop(t+.3);}
  function bar(t){
    var st=station===1?LOFI:SYNTH,ch=st.chords[barNo%st.chords.length],dur=st.bar,i;
    if(station===1){ // lo-fi: warm pad, soft bass, dusty hats, vinyl crackle
      for(i=0;i<ch.length;i++)osc("triangle",hz(ch[i]),t+.02,dur*.95,.05,.5,900);
      osc("sine",hz(ch[0]-24),t,dur*.9,.14,.02,300);
      kick(t);kick(t+dur/2);
      for(i=0;i<4;i++)noise(t+i*dur/4+dur/8,.05,.025,6000);
      noise(t,dur,.006,0); // crackle bed (lowpass)
    }else{ // synthwave: arp + driving bass + hats
      var seq=[0,1,2,1,0,2,1,2];
      for(i=0;i<8;i++)osc("sawtooth",hz(ch[seq[i]]+12),t+i*dur/8,dur/8*.9,.035,.01,2500);
      osc("square",hz(ch[0]-12),t,dur*.45,.06,.01,500);
      osc("square",hz(ch[0]-12),t+dur/2,dur*.45,.06,.01,500);
      kick(t);kick(t+dur/2);
      for(i=0;i<8;i++)noise(t+i*dur/8,.03,.02,8000);
    }
    barNo++;
  }
  function tick(){
    if(!ctx||station===0)return;
    var st=station===1?LOFI:SYNTH;
    while(nextBar<ctx.currentTime+.8){
      if(nextBar<ctx.currentTime)nextBar=ctx.currentTime+.05;
      bar(nextBar);nextBar+=st.bar;
    }
  }
  function start(){
    if(!c())return;
    if(ctx.state==="suspended")ctx.resume();
    nextBar=0;barNo=0;
    if(timer)clearInterval(timer);
    timer=setInterval(tick,300);tick();
  }
  function stop(){if(timer)clearInterval(timer);timer=null;}
  return {
    cycle:function(){
      station=(station+1)%3;
      var b=document.getElementById("musicBtn");
      if(station===0){stop();if(b){b.textContent="🔇";b.className="iconbtn";}toast("🔇 Beats off");}
      else{start();if(b){b.textContent=station===1?"🎧":"🎹";b.className="iconbtn on";}
        toast(station===1?"🎧 Lo-fi chill — study beats on":"🎹 Synthwave grind — lock in");}
    },
    playing:function(){return station!==0;}
  };
})();

/* ---------- confetti ---------- */
function confetti(){
  var cv=document.createElement("canvas");
  cv.style.cssText="position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:200";
  cv.width=window.innerWidth;cv.height=window.innerHeight;
  document.body.appendChild(cv);
  var g=cv.getContext("2d"),parts=[],cols=["#ffb830","#ff7a2f","#3ddc84","#4d9fff","#a78bfa","#ff6bcb"],i;
  for(i=0;i<90;i++)parts.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.3,
    vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:4+Math.random()*5,r:Math.random()*6.28,
    vr:(Math.random()-.5)*.3,c:cols[i%cols.length]});
  var t0=Date.now();
  (function frame(){
    g.clearRect(0,0,cv.width,cv.height);
    var j;
    for(j=0;j<parts.length;j++){
      var p=parts[j];p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;
      g.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);g.restore();
    }
    if(Date.now()-t0<1800)requestAnimationFrame(frame);
    else if(cv.parentNode)cv.parentNode.removeChild(cv);
  })();
}

function load(){

  }catch(e){S=blankState();}

  for(k in b){if(S[k]===undefined)S[k]=b[k];}

  if(!S.skills[id])S.skills[id]={m:0,att:0,cor:0,hist:[],last:0,wrongRow:0};
  return S.skills[id];

/* mastery slowly decays if a skill is neglected — retrieval practice matters */
function applyDecay(){
  var now=Date.now(),id;
  for(id in S.skills){
    var s=S.skills[id];
    if(s.last&&s.m>40){
      var d=daysBetween(s.last,now);
      if(d>7){
        var drop=Math.min(Math.floor((d-7)/3),Math.floor(s.m*.25));
        if(drop>0)s.m=Math.max(40,s.m-drop);
      }
    }
  }
}
function rollDaily(){
  var t=todayKey();
  if(S.daily.date!==t){
    S.daily={date:t,xp:0,goal:S.daily.goal||100,quests:{}};
    save();
  }
}
function touchStreak(earned){
  var t=todayKey();
  if(earned){
    if(S.streak.last===t)return;
    var y=new Date();y.setDate(y.getDate()-1);
    var yk=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
    S.streak.count=(S.streak.last===yk)?S.streak.count+1:1;
    S.streak.last=t;
    save();
  }else{
    if(S.streak.last&&S.streak.last!==t){
      var y2=new Date();y2.setDate(y2.getDate()-1);
      var yk2=y2.getFullYear()+"-"+(y2.getMonth()+1)+"-"+y2.getDate();
      if(S.streak.last!==yk2){S.streak.count=0;save();}
    }
  }
}

/* ---------- mastery engine ---------- */
function mTier(m){ if(m>=97)return 5; if(m>=90)return 4; if(m>=75)return 3; if(m>=60)return 2; if(m>=40)return 1; return 0; }
var TIER_NAMES=["Weak","Developing","Functional","Strong","Mastered","Elite"];
function tierTag(m,att){
  if(!att)return '<span class="mtag t0">NEW</span>';
  var t=mTier(m);
  return '<span class="mtag t'+t+'">'+TIER_NAMES[t].toUpperCase()+" "+Math.round(m)+"%</span>";
}
function recordAnswer(skillId,level,ok){
  var s=sk(skillId);
  s.att++;S.totalsAtt++;
  if(ok){
    s.cor++;S.totalsCor++;s.wrongRow=0;
    S.sessionCorrectRow++;
    var gain=(3+2.6*level)*(1-s.m/115);
    s.m=Math.min(100,s.m+gain);
    // consistency gate: real mastery needs a body of work
    if(s.att<6)s.m=Math.min(s.m,88);
    else if(s.att<10)s.m=Math.min(s.m,96);
  }else{
    s.wrongRow++;S.sessionCorrectRow=0;
    s.m=Math.max(0,s.m-(13-1.5*level));
  }
  s.hist.push({l:level,ok:ok?1:0,t:Date.now()});
  if(s.hist.length>25)s.hist.shift();
  s.last=Date.now();
  touchStreak(true);
  save();
}
function pickLevel(skillId){
  var s=sk(skillId),m=s.m;
  var L= m<40?1 : m<60?2 : m<75?3 : m<90?4 : 5;
  if(s.wrongRow>=2)L=Math.max(1,L-1);         // struggling → step down
  else if(S.sessionCorrectRow>=4&&L<5)L++;    // hot streak → push harder
  return L;
}
function unitMastery(uid){
  var u=unitById(uid),sum=0,n=0,i;
  for(i=0;i<u.skills.length;i++){var s=sk(u.skills[i].id);sum+=s.m;n++;}
  return n?sum/n:0;
}
function overallMastery(){
  var sum=0,i;
  for(i=0;i<UNITS.length;i++)sum+=unitMastery(UNITS[i].id);
  return sum/UNITS.length;
}
/* spaced review: interval grows with mastery tier */
function reviewDue(){
  var due=[],now=Date.now(),i,j;
  var iv=[1,2,4,7,14,21]; // days by tier
  for(i=0;i<UNITS.length;i++)for(j=0;j<UNITS[i].skills.length;j++){
    var d=UNITS[i].skills[j],s=S.skills[d.id];
    if(s&&s.att>0&&s.last&&daysBetween(s.last,now)>=iv[mTier(s.m)]){
      due.push(d);
    }
  }
  return due;
}
function weakSkills(n){
  var all=[],i,j;
  for(i=0;i<UNITS.length;i++)for(j=0;j<UNITS[i].skills.length;j++){
    var d=UNITS[i].skills[j],s=S.skills[d.id];
    if(s&&s.att>0)all.push({d:d,m:s.m});
  }
  all.sort(function(a,b){return a.m-b.m;});
  return all.slice(0,n||3);
}

/* ============================================================
   QUESTION GENERATORS — every skill has a generator taking a
   difficulty level L (1–5) and returning a fresh, checked
   question. Answers are constructed backwards from chosen
   solutions so they are always exact.
   ============================================================ */
var GEN={};
function mc(correct,distractors){
  var opts=[correct],i;
  for(i=0;i<distractors.length&&opts.length<4;i++){
    if(opts.indexOf(distractors[i])<0)opts.push(distractors[i]);
  }
  return {choices:shuffle(opts),ans:correct};
}
function nzr(a,b){var n=0;while(n===0)n=ri(a,b);return n;} // nonzero random
function q(html,type,ans,extra){
  var o={html:html,type:type,ans:String(ans)};
  var k;for(k in (extra||{}))o[k]=extra[k];
  return o;
}
function cpx(a,b){ // complex "a+bi" canonical + accepted variants
  var s,alt=[];
  if(b===0)return {s:String(a),alt:[]};
  var bi=(b===1?"i":(b===-1?"-i":b+"i"));
  if(a===0){s=bi;}
  else{s=a+(b>0?"+":"")+bi;alt.push(bi+(a>0?"+":"")+a);}
  return {s:s,alt:alt};
}

/* ----- UNIT: Linear & Absolute Value ----- */
GEN.lin1=function(L){
  var x,a,b,c,d,m;
  if(L<=1){x=ri(-9,9);a=nzr(2,7);b=ri(-10,10);c=a*x+b;
    return q("Solve for x:<br><span class='math big'>"+polyStr([a,b])+" = "+c+"</span>","num",x,
      {hint:"Undo the +"+b+" first, then divide by "+a+".",
       expl:"Subtract "+b+" from both sides: "+a+"x = "+(c-b)+". Divide by "+a+": x = "+x+"."});
  }
  if(L===2){x=ri(-8,8);a=nzr(2,8);c=nzr(-6,6);while(c===a)c=nzr(-6,6);b=ri(-9,9);d=a*x+b-c*x;
    return q("Solve for x:<br><span class='math big'>"+polyStr([a,b])+" = "+polyStr([c,d])+"</span>","num",x,
      {hint:"Move all x-terms to one side, constants to the other.",
       expl:"Subtract "+c+"x from both sides: "+(a-c)+"x "+(b<0?"− "+(-b):"+ "+b)+" = "+d+", so "+(a-c)+"x = "+(d-b)+", giving x = "+x+"."});
  }
  if(L===3){x=ri(-7,7);a=nzr(2,5);b=ri(-6,6);c=ri(-9,9);d=a*(x+b)+c;
    return q("Solve for x:<br><span class='math big'>"+a+"(x "+(b<0?"− "+(-b):"+ "+b)+") "+(c<0?"− "+(-c):"+ "+c)+" = "+d+"</span>","num",x,
      {hint:"Distribute the "+a+" first.",
       expl:"Distribute: "+a+"x + "+(a*b)+" + "+c+" = "+d+" → "+a+"x = "+(d-a*b-c)+" → x = "+x+"."});
  }
  if(L===4){x=ri(-6,6);a=nzr(2,5);c=ri(2,6);d=ri(-5,5);b=c*d-a*x;
    return q("Solve for x:<br><span class='math big'><span class='frac'><span>"+polyStr([a,b])+"</span><span>"+c+"</span></span> = "+d+"</span>","num",x,
      {hint:"Multiply both sides by "+c+" first.",
       expl:"Multiply both sides by "+c+": "+a+"x "+(b<0?"− "+(-b):"+ "+b)+" = "+(c*d)+" → "+a+"x = "+(c*d-b)+" → x = "+x+"."});
  }
  a=ri(2,4);c=a+ri(1,3);m=nzr(-4,4);b=ri(-8,8);d=b+m*(c-a);x=a*c*m;
  return q("Solve for x:<br><span class='math big'><span class='frac'><span>x</span><span>"+a+"</span></span> "+(b<0?"− "+(-b):"+ "+b)+" = <span class='frac'><span>x</span><span>"+c+"</span></span> "+(d<0?"− "+(-d):"+ "+d)+"</span>","num",x,
    {hint:"Multiply everything by "+(a*c)+" (the LCD) to clear fractions.",
     expl:"Multiply by "+(a*c)+": "+c+"x + "+(a*c*b)+" = "+a+"x + "+(a*c*d)+" → "+(c-a)+"x = "+(a*c*(d-b))+" → x = "+x+"."});
};
GEN.lin2=function(L){

    {p:"d = vt. Solve for t.",c:"t = d/v",w:["t = v/d","t = dv","t = d − v"]},
    {p:"A = ½bh. Solve for h.",c:"h = 2A/b",w:["h = A/(2b)","h = 2b/A","h = A − 2b"]},
    {p:"P = 2ℓ + 2w. Solve for w.",c:"w = (P − 2ℓ)/2",w:["w = P − 2ℓ","w = P/2 + ℓ","w = 2(P − ℓ)"]},
    {p:"y = mx + b. Solve for x.",c:"x = (y − b)/m",w:["x = y − b − m","x = (b − y)/m","x = y/m − b"]}
  ]):pick([

    {p:"V = πr²h. Solve for h.",c:"h = V/(πr²)",w:["h = πr²/V","h = V − πr²","h = Vπr²"]},
    {p:"S = a/(1 − r). Solve for r.",c:"r = 1 − a/S",w:["r = a/S − 1","r = S/a − 1","r = 1 − S/a"]},
    {p:"ax + by = c. Solve for y.",c:"y = (c − ax)/b",w:["y = c − ax − b","y = (ax − c)/b","y = c/b − ax"]}

GEN.lin3=function(L){

GEN.data1=function(L){
  var n,k;
  function fact(x){var f=1,i;for(i=2;i<=x;i++)f*=i;return f;}
  function nCr(n,k){return fact(n)/(fact(k)*fact(n-k));}
  function nPr(n,k){return fact(n)/fact(n-k);}
  if(L<=2){n=ri(4,7);
    return q("How many ways can "+n+" trophies be arranged in a row on a shelf?","num",fact(n),
      {hint:"That's "+n+"! (factorial).",expl:n+"! = "+fact(n)+" arrangements."});
  }
  if(L===3){n=ri(5,8);k=ri(2,3);
    return q("A club with "+n+" members elects a president and a vice-president (different people). How many ways?","num",nPr(n,2),
      {hint:"Order MATTERS here → permutation: "+n+" choices, then "+(n-1)+".",
       expl:"P("+n+",2) = "+n+" × "+(n-1)+" = "+nPr(n,2)+"."});
  }
  if(L===4){n=ri(5,9);k=ri(2,3);
    return q("From "+n+" students, choose a committee of "+k+" (order doesn't matter). How many ways?","num",nCr(n,k),
      {hint:"Order doesn't matter → combination: C("+n+","+k+").",
       expl:"C("+n+","+k+") = "+n+"!/("+k+"!·"+(n-k)+"!) = "+nCr(n,k)+"."});
  }
  n=ri(6,9);k=3;
  var perm=nPr(n,k),comb=nCr(n,k);
  var m1=mc("Medals: "+perm+";  Committee: "+comb,["Medals: "+comb+";  Committee: "+perm,"Both: "+perm,"Both: "+comb]);
  return q("From "+n+" runners: (a) how many ways to award gold/silver/bronze, and (b) how many ways to pick 3 for a relay team?","mc",m1.ans,
    {choices:m1.choices,hint:"Medals are ordered (permutation); the team is unordered (combination).",
     expl:"Medals: P("+n+",3) = "+perm+". Team: C("+n+",3) = "+comb+". Order matters ⟺ permutation."});
};

    return q("For a NORMAL distribution, about what percent of data falls "+t.q+"?","mc",m1.ans,

var LESSONS={
 lin1:"Undo operations in reverse order: clear parentheses (distribute), collect like terms, move variable terms to one side and constants to the other, then divide. <b>Example:</b> 3(x−2)+4 = 13 → 3x−6+4 = 13 → 3x = 15 → x = 5. Always check by substituting back.",
 lin2:"A literal equation has several letters — solve for one by treating the rest as numbers. <b>Example:</b> solve A = P + Prt for t: subtract P (A−P = Prt), divide by Pr → t = (A−P)/(Pr). The moves are identical to normal equations.",
 lin3:"|expression| = c (c &gt; 0) splits into TWO equations: expression = c and expression = −c. Isolate the absolute value FIRST. If c &lt; 0 there is no solution — absolute value can't be negative. <b>Example:</b> |x−3| = 7 → x = 10 or x = −4.",
 lin4:"|x| &lt; c is a SANDWICH: −c &lt; x &lt; c (AND). |x| &gt; c SPLITS: x &lt; −c or x &gt; c (OR). Memory hook: <i>less-thAND, great-OR</i>. <b>Example:</b> |x−2| ≤ 5 → −3 ≤ x ≤ 7.",
 lin5:"A compound inequality like 1 &lt; 2x+3 ≤ 9 gets the same operation applied to ALL THREE parts: subtract 3 (−2 &lt; 2x ≤ 6), divide by 2 (−1 &lt; x ≤ 3). Dividing by a negative flips every symbol.",
 fun1:"f(x) is the OUTPUT when the input is x — it is not multiplication. To evaluate f(−2) for f(x) = x²−3x, substitute with parentheses: (−2)²−3(−2) = 4+6 = 10. Parentheses prevent 90% of sign errors.",
 fun2:"Domain = allowed inputs; range = possible outputs. Two classic restrictions: denominators can't be 0, and even-root insides must be ≥ 0. For ranges, think about the graph: a parabola opening up from vertex (h,k) has range y ≥ k.",
 fun3:"(f∘g)(x) = f(g(x)): apply g FIRST, feed its output into f. Order matters — f(g(x)) ≠ g(f(x)) in general. <b>Example:</b> f(x)=2x+1, g(x)=x²: f(g(3)) = f(9) = 19, but g(f(3)) = g(7) = 49.",
 fun4:"An inverse UNDOES a function: f⁻¹(f(x)) = x. To find it, swap x and y, then solve for y. f⁻¹ is NOT 1/f! Graphically the inverse reflects over y = x. <b>Example:</b> f(x)=3x−6 → x=3y−6 → f⁻¹(x)=(x+6)/3.",
 fun5:"y = a·f(x−h)+k: h shifts horizontally (toward the sign of h!), k shifts vertically, |a|&gt;1 stretches vertically, a&lt;0 reflects over the x-axis. Inside changes act horizontally and 'backwards'; outside changes act vertically and intuitively.",
 fun6:"A piecewise function uses different rules on different x-intervals. To evaluate: FIRST find which interval the input belongs to, THEN apply only that rule. Boundary inputs go to the piece whose inequality includes equality.",
 sys1:"Two equations, two unknowns. Elimination: scale equations so one variable's coefficients are opposites, then add. Substitution: solve one equation for a variable, substitute into the other. The solution is where the lines intersect.",
 sys2:"For 3 variables: eliminate the SAME variable from two different pairs of equations → a 2×2 system → solve → back-substitute. Stay organized; label your equations ①②③.",
 sys3:"Line meets parabola/circle: substitute one equation into the other, solve the resulting quadratic. 2, 1, or 0 solutions = 2, 1, or 0 intersection points — the discriminant tells you which without solving.",
 sys4:"Translate words to equations: define variables with units, write one equation per fact. Classics: ticket totals (count + revenue), mixtures (amount + concentration), rates (d = rt, with/against current).",
 quad1:"Always pull the GCF first. Then check special patterns: a²−b² = (a+b)(a−b) (difference of squares) and a²±2ab+b² = (a±b)² (perfect square trinomial). 'Factor completely' means keep going until nothing factors.",
 quad2:"x²+bx+c: find two numbers multiplying to c, adding to b. For ax²+bx+c use the AC method: find two numbers multiplying to a·c adding to b, split the middle term, factor by grouping. Always FOIL back to verify.",
 quad3:"Zero Product Property: if A·B = 0, then A = 0 or B = 0. Get everything on one side (= 0!), factor, set each factor to zero. Quadratics have up to 2 real roots.",
 quad4:"To complete the square on x²+bx: add (b/2)². So x²+bx+c = (x+b/2)² + c − b²/4. It converts to vertex form, proves the quadratic formula, and solves any quadratic: isolate the square, then square-root both sides (±!).",
 quad5:"Vertex form y = a(x−h)²+k has vertex (h,k) and axis x = h. From standard form, h = −b/(2a) and k = f(h). If a &gt; 0 the vertex is a minimum; if a &lt; 0, a maximum.",
 quad6:"x = [−b ± √(b²−4ac)]/(2a) solves ANY quadratic in the form ax²+bx+c = 0. Write out a, b, c first, watch signs, and simplify the radical. Two roots share the '±'.",
 quad7:"The discriminant D = b²−4ac lives under the radical: D &gt; 0 → two real roots; D = 0 → one repeated root; D &lt; 0 → two complex conjugate roots. It answers 'how many solutions' without solving.",
 quad8:"Projectiles: h(t) = −16t² + v₀t + h₀ (feet). Hits ground → set h = 0. Max height → vertex, t = v₀/32. Revenue/area problems: build the quadratic, maximize at the vertex. The vertex sits midway between the zeros.",
 cplx1:"i = √(−1), so i² = −1. Powers cycle every 4: i, −1, −i, 1. For iⁿ, use n mod 4. <b>Example:</b> i²³: 23 mod 4 = 3 → i³ = −i.",
 cplx2:"Treat i like a variable when adding: combine real parts, combine imaginary parts. (3+2i) − (5−4i) = −2 + 6i. Nothing fancier than combining like terms.",
 cplx3:"FOIL, then replace i² with −1. (2+3i)(4−i) = 8 −2i +12i −3i² = 8 +10i +3 = 11+10i.",
 cplx4:"To divide, multiply top and bottom by the CONJUGATE of the denominator (flip the sign of the imaginary part). The denominator becomes real: (c+di)(c−di) = c²+d². Then write as a+bi.",
 cplx5:"When D &lt; 0, the quadratic formula gives √(negative) = i√(positive). Roots come in conjugate pairs a±bi. The Fundamental Theorem of Algebra: degree n → exactly n roots, counting complex and repeats.",
 poly1:"Add/subtract: combine like terms (watch the minus distributing over EVERY term). Multiply: every term times every term, then merge. Stay organized by degree.",
 poly2:"Synthetic division divides by (x−k) fast: write k, bring down the lead coefficient, multiply-add across. The last number is the remainder; the others are the quotient's coefficients (one degree lower). Missing terms need 0 placeholders.",
 poly3:"Remainder Theorem: f(x) ÷ (x−k) leaves remainder f(k) — evaluate instead of divide! Factor Theorem: f(k) = 0 ⟺ (x−k) is a factor. These two ideas unlock polynomial factoring.",
 poly4:"To find zeros: factor out GCF, try grouping/special patterns, use a known root with synthetic division to drop the degree, finish with the quadratic formula. n-th degree → n zeros (counting multiplicity, complex included).",
 poly5:"End behavior = what the leading term does. Even degree: ends match (up-up if a&gt;0, down-down if a&lt;0). Odd degree: ends oppose (down-up if a&gt;0, up-down if a&lt;0). Everything else is temporary wiggle.",
 poly6:"A zero of multiplicity m contributes factor (x−r)ᵐ. Odd multiplicity → graph CROSSES at r; even → it TOUCHES and turns. Degree = sum of multiplicities. To build a polynomial from zeros, multiply the factors.",
 rat1:"Factor top and bottom completely, then cancel common FACTORS (never terms!). Note excluded values — anything making the original denominator zero stays excluded even after canceling.",

 exp3:"log_b(x) = y means b^y = x — a logarithm IS an exponent. log_b(1) = 0, log_b(b) = 1. 'log' = base 10, 'ln' = base e.",
 exp4:"To evaluate log_b(n), ask: b to what power gives n? Fractions between 0 and 1 give negative logs; roots give fractional logs: log₉3 = 1/2.",
 exp5:"log(xy) = log x + log y; log(x/y) = log x − log y; log(xᵏ) = k·log x. Expanding pulls things apart; condensing packs them into one log. These mirror the exponent rules exactly.",

 seq1:"Arithmetic = add a constant d each step: aₙ = a₁ + (n−1)d. Given two terms, the difference over the number of steps gives d. Graphs as points on a line.",

var WORKED={
 lin1:{p:"Solve:  3(x − 2) + 4 = 13",steps:[
  ["3(x − 2) + 4 = 13","The goal: get x completely alone. Order of attack: parentheses → combine → move constants → divide."],
  ["3x − 6 + 4 = 13","Distribute the 3 to BOTH terms inside the parentheses (3·x and 3·(−2))."],
  ["3x − 2 = 13","Combine like terms on the left: −6 + 4 = −2."],
  ["3x = 15","Add 2 to both sides. Whatever you do to one side, do to the other."],
  ["x = 5","Divide both sides by 3."],
  ["Check: 3(5 − 2) + 4 = 9 + 4 = 13 ✓","Substitute back in. A 10-second check catches almost every mistake."]]},
 lin2:{p:"Solve  A = P + Prt  for t",steps:[
  ["A = P + Prt","t is buried on the right. Treat every other letter (A, P, r) exactly like a number."],
  ["A − P = Prt","Subtract P from both sides — peel away everything that isn't attached to t."],
  ["(A − P)/(Pr) = t","t is MULTIPLIED by Pr, so divide both sides by Pr in one move."],
  ["t = (A − P)/(Pr)","Done. Same moves as a normal equation — subtraction first, then division."]]},
 lin3:{p:"Solve:  |2x − 1| = 7",steps:[
  ["|2x − 1| = 7","The inside is some number whose distance from 0 is 7 — so the inside is 7 or −7. Two cases."],
  ["Case 1:  2x − 1 = 7  →  2x = 8  →  x = 4","First case: the inside equals +7."],
  ["Case 2:  2x − 1 = −7  →  2x = −6  →  x = −3","Second case: the inside equals −7. Never skip this one."],
  ["Check: |2(4) − 1| = |7| = 7 ✓  and  |2(−3) − 1| = |−7| = 7 ✓","Both survive the check → x = 4 or x = −3."]]},
 lin4:{p:"Solve:  |x + 3| ≤ 5",steps:[
  ["|x + 3| ≤ 5","'Distance from 0 is at most 5' → the inside is trapped between −5 and 5. LESS-thAND."],
  ["−5 ≤ x + 3 ≤ 5","Write it as a sandwich (an AND statement)."],
  ["−8 ≤ x ≤ 2","Subtract 3 from ALL THREE parts at once."],
  ["Number line: a solid segment from −8 to 2","If it had been |x + 3| ≥ 5, it would SPLIT: x + 3 ≤ −5 or x + 3 ≥ 5 (great-OR)."]]},
 lin5:{p:"Solve:  −7 < 2x + 1 ≤ 9",steps:[
  ["−7 < 2x + 1 ≤ 9","Three-part inequality: whatever you do, do to all three parts."],
  ["−8 < 2x ≤ 8","Subtract 1 everywhere."],
  ["−4 < x ≤ 4","Divide everywhere by 2. (Dividing by a NEGATIVE would flip both symbols.)"],
  ["Answer: −4 < x ≤ 4","Open circle at −4, closed circle at 4. The ≤ vs < distinction matters."]]},
 fun1:{p:"f(x) = x² − 3x + 1.  Find f(−2).",steps:[
  ["f(−2) = (−2)² − 3(−2) + 1","Replace EVERY x with (−2) — always in parentheses. This one habit kills most sign errors."],
  ["= 4 + 6 + 1","(−2)² = +4 (a square is never negative), and −3(−2) = +6."],
  ["f(−2) = 11","f(−2) = 11 means: input −2, output 11 — the point (−2, 11) is on the graph."]]},
 fun2:{p:"Find the domain of  f(x) = √(2x − 6) / (x − 5)",steps:[
  ["Two danger zones: the √ and the fraction","Domain = every input that doesn't break the function. Square roots need inside ≥ 0; denominators can't be 0."],
  ["2x − 6 ≥ 0  →  x ≥ 3","The square root's inside must be zero or positive."],
  ["x − 5 ≠ 0  →  x ≠ 5","The denominator can never be zero."],
  ["Domain: x ≥ 3 and x ≠ 5","Combine BOTH conditions. In interval notation: [3, 5) ∪ (5, ∞)."]]},
 fun3:{p:"f(x) = 2x + 1,  g(x) = x².  Find (f ∘ g)(3).",steps:[
  ["(f ∘ g)(3) means f(g(3))","Read right-to-left: g acts FIRST, then f eats g's output."],
  ["g(3) = 3² = 9","Inner function first."],
  ["f(9) = 2(9) + 1 = 19","Feed 9 into f. So (f ∘ g)(3) = 19."],
  ["Compare: (g ∘ f)(3) = g(7) = 49","Order matters! f(g(x)) = 2x² + 1 but g(f(x)) = (2x + 1)². Totally different functions."]]},
 fun4:{p:"Find the inverse of  f(x) = 3x − 6",steps:[
  ["y = 3x − 6","Write f(x) as y. The inverse swaps the roles of input and output."],
  ["x = 3y − 6","SWAP x and y — that's the whole idea of an inverse."],
  ["x + 6 = 3y  →  y = (x + 6)/3","Now solve for y: add 6, divide by 3."],
  ["f⁻¹(x) = (x + 6)/3","Note f⁻¹ is NOT 1/f. Verify: f(2) = 0 and f⁻¹(0) = 2 ✓ — the inverse undoes f."]]},
 fun5:{p:"Describe  y = −2(x + 1)² + 3  compared to y = x²",steps:[
  ["Template: y = a(x − h)² + k","Read a, h, k. Here a = −2, and (x + 1) = (x − (−1)) so h = −1, k = 3."],
  ["a = −2: flip + stretch","Negative → reflected over the x-axis (opens down). |−2| = 2 → vertically stretched ×2 (narrower)."],
  ["(x + 1): shift LEFT 1","Inside changes act horizontally and 'backwards': +1 inside moves left."],
  ["+3: shift UP 3","Outside changes act vertically and intuitively."],
  ["Vertex: (−1, 3), opening down","One glance at vertex form tells you the whole graph."]]},
 fun6:{p:"f(x) = x + 5 if x < 2;  f(x) = x² if x ≥ 2.  Find f(2) and f(0).",steps:[
  ["Which rule owns the input?","A piecewise function is a machine with a gatekeeper: check the condition BEFORE computing."],
  ["f(2): is 2 < 2? No. Is 2 ≥ 2? Yes → use x²","Boundary values go to the piece whose inequality includes equals."],
  ["f(2) = 2² = 4","Apply only that rule."],
  ["f(0): 0 < 2 → use x + 5 → f(0) = 5","Different input, different piece. That's the whole game."]]},
 sys1:{p:"Solve:  x + 2y = 8  and  3x − 2y = 8",steps:[
  ["x + 2y = 8\n3x − 2y = 8","Spot the +2y and −2y — they're opposites. Elimination will be instant."],
  ["Add the equations:  4x = 16","The y-terms cancel: 2y + (−2y) = 0. That's the whole point of elimination."],
  ["x = 4","Divide by 4."],
  ["4 + 2y = 8  →  2y = 4  →  y = 2","Back-substitute x = 4 into either original equation."],
  ["Check in the OTHER equation: 3(4) − 2(2) = 12 − 4 = 8 ✓","Solution (4, 2) — the point where the two lines cross."]]},
 sys2:{p:"Solve:  x+y+z = 6,   x−y+z = 2,   x+y−z = 0",steps:[
  ["Label them ① ② ③","Strategy: eliminate one variable from two different PAIRS → a 2-variable system."],
  ["① + ②:  2x + 2z = 8  →  x + z = 4","Adding ① and ② kills y."],
  ["① + ③:  2x + 2y = 6  →  x + y = 3","Adding ① and ③ kills z. Now two small equations."],
  ["① − ②:  2y = 4  →  y = 2","Subtracting ② from ① isolates y directly."],
  ["x = 3 − y = 1,  z = 4 − x = 3","Back-substitute up the chain."],
  ["Check ②: 1 − 2 + 3 = 2 ✓","(x, y, z) = (1, 2, 3). Organization beats cleverness in 3-variable systems."]]},
 sys3:{p:"Where do  y = x² − 1  and  y = 2x + 2  intersect?",steps:[
  ["x² − 1 = 2x + 2","Both equal y, so set them equal to each other (substitution)."],
  ["x² − 2x − 3 = 0","Move everything to one side — always solve quadratics against 0."],
  ["(x − 3)(x + 1) = 0  →  x = 3 or x = −1","Factor: product −3, sum −2 → −3 and +1."],
  ["y = 2(3)+2 = 8;  y = 2(−1)+2 = 0","Plug each x into the LINE (easier) to get y."],
  ["Intersections: (3, 8) and (−1, 0)","Two solutions = the line cuts the parabola twice. The discriminant predicted that."]]},
 sys4:{p:"Adult tickets $9, child tickets $5. 120 tickets sold for $880. How many adult?",steps:[
  ["Let a = adult, c = child","Define variables with words FIRST. Every word problem starts here."],
  ["a + c = 120","Fact #1: total count."],
  ["9a + 5c = 880","Fact #2: total money. Two facts → two equations."],
  ["c = 120 − a  →  9a + 5(120 − a) = 880","Substitute so only one variable remains."],
  ["9a + 600 − 5a = 880  →  4a = 280  →  a = 70","Distribute, combine, solve."],
  ["Check: 70 adults ($630) + 50 kids ($250) = $880 ✓","Answer the actual question: 70 adult tickets."]]},
 quad1:{p:"Factor completely:  3x² − 48",steps:[
  ["3x² − 48","Step 1 of ALL factoring: pull the GCF. Both terms divide by 3."],
  ["3(x² − 16)","Factor out 3. Now look again at what's left."],
  ["x² − 16 = x² − 4²","Difference of squares pattern: a² − b² = (a + b)(a − b)."],
  ["3(x + 4)(x − 4)","'Completely' means keep factoring until nothing factors."],
  ["Check: (x+4)(x−4) = x² − 16, times 3 ✓","Multiply back out — factoring is just multiplication in reverse."]]},
 quad2:{p:"Factor:  x² − 5x − 24",steps:[
  ["Need two numbers: multiply to −24, add to −5","For x² + bx + c, hunt a pair with product c and sum b."],
  ["Pairs of −24: (−1,24)(−2,12)(−3,8)(−4,6)(−6,4)(−8,3)…","Product is negative → the pair has OPPOSITE signs. List systematically."],
  ["−8 and 3:  (−8)(3) = −24,  −8 + 3 = −5 ✓","Found it. The bigger absolute value takes the sign of b."],
  ["x² − 5x − 24 = (x − 8)(x + 3)","Drop the pair straight into the factors."],
  ["FOIL check: x² + 3x − 8x − 24 = x² − 5x − 24 ✓","For ax² + bx + c (a ≠ 1): same idea with product a·c, then split the middle and group."]]},
 quad3:{p:"Solve:  x² + 3x − 10 = 0",steps:[
  ["x² + 3x − 10 = 0","One side must be ZERO before factoring — the Zero Product Property needs it."],
  ["(x + 5)(x − 2) = 0","Product −10, sum +3 → +5 and −2."],
  ["x + 5 = 0  or  x − 2 = 0","If a product is zero, one of the factors MUST be zero."],
  ["x = −5  or  x = 2","Two roots — where the parabola crosses the x-axis."],
  ["Check x = 2: 4 + 6 − 10 = 0 ✓","Always test at least one."]]},
 quad4:{p:"Solve by completing the square:  x² + 6x − 7 = 0",steps:[
  ["x² + 6x = 7","Move the constant out of the way."],
  ["Half of 6 is 3; 3² = 9","The magic number: (b/2)². This is what makes a perfect square."],
  ["x² + 6x + 9 = 7 + 9","Add 9 to BOTH sides."],
  ["(x + 3)² = 16","The left side is now a perfect square — that was the whole point."],
  ["x + 3 = ±4","Square-root both sides. NEVER forget the ±."],
  ["x = 1  or  x = −7","x = −3 + 4 or −3 − 4. This method also derives vertex form and the quadratic formula."]]},
 quad5:{p:"Find the vertex of  y = x² − 4x + 1",steps:[
  ["h = −b/(2a) = 4/2 = 2","The vertex's x-coordinate has a formula. Here a = 1, b = −4."],
  ["k = f(2) = 4 − 8 + 1 = −3","Plug h back in to get the y-coordinate."],
  ["Vertex: (2, −3)","Axis of symmetry: x = 2. Since a > 0, it opens up → (2, −3) is the MINIMUM."],
  ["Vertex form: y = (x − 2)² − 3","Expand it to confirm: x² − 4x + 4 − 3 = x² − 4x + 1 ✓"]]},
 quad6:{p:"Solve:  2x² + 3x − 2 = 0",steps:[
  ["a = 2,  b = 3,  c = −2","Write these down FIRST, signs included. Most formula errors are bookkeeping errors."],
  ["D = b² − 4ac = 9 − 4(2)(−2) = 9 + 16 = 25","Compute the discriminant separately. −4·2·(−2) = +16."],
  ["x = (−3 ± √25)/(2·2) = (−3 ± 5)/4","Drop into x = (−b ± √D)/2a."],
  ["x = 2/4 = 1/2   or   x = −8/4 = −2","Split the ± into its two roots and simplify."],
  ["Check x = −2: 2(4) − 6 − 2 = 0 ✓","D was a perfect square → rational roots (it would have factored too)."]]},
 quad7:{p:"How many solutions does  x² − 4x + 5 = 0  have?",steps:[
  ["a = 1,  b = −4,  c = 5","Only the discriminant is needed to COUNT solutions — no solving."],
  ["D = (−4)² − 4(1)(5) = 16 − 20 = −4","Careful: (−4)² = +16."],
  ["D < 0 → no real solutions","The parabola never touches the x-axis."],
  ["Two complex roots: x = (4 ± 2i)/2 = 2 ± i","Counting complex numbers, EVERY quadratic has exactly 2 roots (Fundamental Theorem of Algebra). D > 0 → 2 real; D = 0 → 1 repeated; D < 0 → complex conjugate pair."]]},
 quad8:{p:"h(t) = −16t² + 32t + 48. When does the ball land, and how high does it get?",steps:[
  ["Landing: set h(t) = 0","'Hits the ground' translates to height = 0."],
  ["−16(t² − 2t − 3) = 0","Factor out −16 to shrink the numbers."],
  ["(t − 3)(t + 1) = 0  →  t = 3 or t = −1","Factor: product −3, sum −2."],
  ["t = 3 seconds","Reject t = −1 — time can't be negative. Word problems demand a sanity filter."],
  ["Peak: t = −b/2a = −32/−32 = 1","Max height happens at the vertex."],
  ["h(1) = −16 + 32 + 48 = 64 ft","Vertex (1, 64): up for 1 second, peak 64 ft, lands at t = 3."]]},
 cplx1:{p:"Simplify:  i¹⁸",steps:[
  ["The cycle: i¹ = i,  i² = −1,  i³ = −i,  i⁴ = 1","Powers of i repeat every 4 steps, forever."],
  ["18 ÷ 4 = 4 remainder 2","Only the REMAINDER matters — the full cycles are just 1s."],
  ["i¹⁸ = i² = −1","Any iⁿ collapses via n mod 4. (Remainder 0 means i⁴ = 1.)"]]},
 cplx2:{p:"Simplify:  (3 + 2i) − (5 − 4i)",steps:[
  ["(3 + 2i) − (5 − 4i)","The minus distributes to BOTH terms of the second number."],
  ["= 3 + 2i − 5 + 4i","−(−4i) becomes +4i — the classic trap."],
  ["= (3 − 5) + (2 + 4)i","Group real with real, imaginary with imaginary — just like combining like terms."],
  ["= −2 + 6i","Standard form a + bi. Done."]]},
 cplx3:{p:"Multiply:  (2 + 3i)(4 − i)",steps:[
  ["FOIL: 2·4 + 2·(−i) + 3i·4 + 3i·(−i)","Multiply complex numbers exactly like binomials."],
  ["= 8 − 2i + 12i − 3i²","Four products, watch the signs."],
  ["= 8 + 10i − 3(−1)","THE key move: i² = −1. That −3i² becomes +3."],
  ["= 11 + 10i","Combine: reals 8 + 3 = 11, imaginary −2i + 12i = 10i."]]},
 cplx4:{p:"Divide:  (3 + 2i)/(1 − 4i)",steps:[
  ["Multiply top and bottom by (1 + 4i)","The CONJUGATE of the denominator (flip the imaginary sign). ×(1+4i)/(1+4i) is just ×1."],
  ["Bottom: (1 − 4i)(1 + 4i) = 1 + 16 = 17","Conjugates multiply to a² + b² — the i's vanish. That's why this works."],
  ["Top: (3 + 2i)(1 + 4i) = 3 + 12i + 2i + 8i² = −5 + 14i","FOIL the numerator; 8i² = −8."],
  ["= −5/17 + (14/17)i","Split into standard a + bi form."]]},
 cplx5:{p:"Solve:  x² − 4x + 13 = 0",steps:[
  ["D = 16 − 52 = −36","Discriminant first: negative → the roots will be complex."],
  ["x = (4 ± √(−36))/2","Quadratic formula as usual."],
  ["√(−36) = √36 · √(−1) = 6i","Pull the negative out as i. This is the only new move."],
  ["x = (4 ± 6i)/2 = 2 ± 3i","Divide BOTH parts by 2. Complex roots always arrive as conjugate pairs: 2 + 3i and 2 − 3i."]]},
 poly1:{p:"Simplify:  (2x² − 3x + 1) − (x² + 4x − 5)",steps:[
  ["(2x² − 3x + 1) − (x² + 4x − 5)","The −1 multiplies EVERY term in the second parentheses."],
  ["= 2x² − 3x + 1 − x² − 4x + 5","Flip all three signs: −x², −4x, +5."],
  ["= (2x² − x²) + (−3x − 4x) + (1 + 5)","Group like terms by degree."],
  ["= x² − 7x + 6","Forgetting to distribute the minus is the #1 polynomial error in existence."]]},
 poly2:{p:"Divide:  (x³ − 2x² − 5x + 6) ÷ (x − 3)  by synthetic division",steps:[
  ["Write 3 | 1  −2  −5  6","Use k = 3 (from x − 3) and just the coefficients, in order, no gaps."],
  ["Bring down the 1","The lead coefficient drops straight down."],
  ["1×3 = 3;  −2 + 3 = 1","The rhythm: multiply by k, add to the next coefficient."],
  ["1×3 = 3;  −5 + 3 = −2","Repeat."],
  ["−2×3 = −6;  6 + (−6) = 0","Bottom row: 1, 1, −2, remainder 0."],
  ["Quotient: x² + x − 2 = (x + 2)(x − 1)","Remainder 0 means (x − 3) is a FACTOR — and the cubic fully factors: (x−3)(x+2)(x−1)."]]},
 poly3:{p:"f(x) = x³ − 4x + 1. Find the remainder of f(x) ÷ (x − 2).",steps:[
  ["Remainder Theorem: remainder = f(2)","No division needed — just evaluate at k."],
  ["f(2) = 2³ − 4(2) + 1","Substitute 2 for every x."],
  ["= 8 − 8 + 1 = 1","Remainder is 1."],
  ["Bonus: f(2) ≠ 0 → (x − 2) is NOT a factor","If f(k) = 0 the remainder is 0 and (x − k) divides evenly — that's the Factor Theorem."]]},
 poly4:{p:"x = 1 is a zero of  f(x) = x³ − 2x² − 5x + 6. Find ALL zeros.",steps:[
  ["Verify: f(1) = 1 − 2 − 5 + 6 = 0 ✓","A given zero is a gift: it means (x − 1) is a factor."],
  ["Synthetic divide by 1:  1 | 1 −2 −5 6","Use the zero to DROP THE DEGREE."],
  ["Bottom row: 1, −1, −6, 0","Quotient is x² − x − 6."],
  ["x² − x − 6 = (x − 3)(x + 2)","A quadratic — now factor (or use the formula)."],
  ["Zeros: x = 1, 3, −2","Degree 3 → exactly 3 zeros. f(x) = (x−1)(x−3)(x+2)."]]},
 poly5:{p:"Describe the end behavior of  f(x) = −2x³ + 5x² − x + 7",steps:[
  ["Only the leading term matters: −2x³","For huge |x|, the biggest power swamps everything else. Ignore the rest."],
  ["Degree 3 = odd → the ends point OPPOSITE ways","Odd powers keep the sign of the input: (−big)³ is −big."],
  ["Leading coefficient −2 < 0 → flip","x³ normally goes down-left/up-right; the negative flips it."],
  ["Rises left, falls right (up–down)","As x → −∞, f → +∞; as x → +∞, f → −∞. Even degree would make both ends match instead."]]},
 poly6:{p:"Build the monic polynomial with a DOUBLE zero at 2 and a zero at −1",steps:[
  ["f(x) = (x − 2)²(x + 1)","Each zero r gives a factor (x − r); multiplicity = the exponent."],
  ["(x − 2)² = x² − 4x + 4","Expand the square first."],
  ["(x² − 4x + 4)(x + 1) = x³ − 3x² + 4","Distribute: x³ + x² − 4x² − 4x + 4x + 4."],
  ["Graph: TOUCHES at x = 2, CROSSES at x = −1","Even multiplicity bounces off the axis; odd passes through. Degree 3 = 2 + 1 (multiplicities add)."]]},
 rat1:{p:"Simplify:  (x² − 9)/(x² + 5x + 6)",steps:[
  ["Factor top: x² − 9 = (x + 3)(x − 3)","ALWAYS factor before canceling. Difference of squares."],
  ["Factor bottom: x² + 5x + 6 = (x + 2)(x + 3)","Product 6, sum 5 → 2 and 3."],
  ["Cancel the common FACTOR (x + 3)","You may only cancel whole factors — never terms. Crossing off the x²'s would be illegal."],
  ["= (x − 3)/(x + 2),  x ≠ −3, −2","x = −3 stays excluded even though it canceled (it's a hole in the graph)."]]},
 rat2:{p:"Divide:  (x² − 4)/(x + 3)  ÷  (x − 2)/(x + 3)",steps:[
  ["Flip the second fraction and multiply","Dividing by a fraction = multiplying by its reciprocal. Same rule as 5th grade, fancier costumes."],
  ["(x² − 4)/(x + 3) · (x + 3)/(x − 2)","Now it's a multiplication problem."],
  ["= (x + 2)(x − 2)(x + 3) / [(x + 3)(x − 2)]","Factor x² − 4 = (x+2)(x−2), then line everything up."],
  ["= x + 2","Cancel (x + 3) and (x − 2). Excluded: x ≠ −3, 2."]]},
 rat3:{p:"Add:  2/(x + 1) + 3/x",steps:[
  ["LCD = x(x + 1)","Different denominators — build the least common denominator from every factor."],
  ["= 2x/[x(x + 1)] + 3(x + 1)/[x(x + 1)]","Multiply each fraction, top AND bottom, by whatever it's missing."],
  ["= [2x + 3(x + 1)] / [x(x + 1)]","One denominator → combine the numerators."],
  ["= (2x + 3x + 3)/[x(x + 1)] = (5x + 3)/[x(x + 1)]","Distribute and combine. If it were subtraction, that minus would distribute over the WHOLE second numerator."]]},
 rat4:{p:"Solve:  3/x + 1/2 = 2",steps:[
  ["Note the restriction: x ≠ 0","Before touching anything, record what x can't be."],
  ["Multiply EVERY term by the LCD, 2x","This nukes all the fractions at once."],
  ["6 + x = 4x","2x·(3/x) = 6;  2x·(1/2) = x;  2x·2 = 4x."],
  ["6 = 3x  →  x = 2","Ordinary linear equation now."],
  ["Check: 3/2 + 1/2 = 2 ✓ and 2 ≠ 0","Survives the restriction → valid. Any answer that zeroes a denominator gets thrown out (extraneous)."]]},
 rat5:{p:"Find the asymptotes of  f(x) = (2x + 1)/(x − 3)",steps:[
  ["Vertical: set the denominator = 0","The graph blows up where the bottom dies: x − 3 = 0."],
  ["VA: x = 3","(First confirm nothing cancels — a canceled factor would be a hole, not an asymptote.)"],
  ["Horizontal: compare degrees (1 vs 1)","Equal degrees → HA is the ratio of leading coefficients."],
  ["HA: y = 2/1 = 2","As x → ±∞, f flattens toward y = 2. (Bottom degree bigger → y = 0; top bigger → no HA, slant instead.)"]]},
 rad1:{p:"Simplify:  √72",steps:[
  ["Hunt the biggest perfect square inside 72","Perfect squares: 4, 9, 16, 25, 36, 49… and 36 divides 72."],
  ["√72 = √(36 · 2)","Split into perfect square × leftover."],
  ["= √36 · √2","√(ab) = √a·√b — roots split over multiplication."],
  ["= 6√2","6√2 ≈ 8.49. If you'd used 4·18 you'd get 2√18 — not done, since 18 still hides a 9. Biggest square first saves work."]]},
 rad2:{p:"Evaluate:  16^(3/4)",steps:[
  ["b^(m/n) = (ⁿ√b)^m","Bottom of the fraction = the root, top = the power."],
  ["⁴√16 = 2","Root FIRST — it keeps the numbers tiny. 2⁴ = 16."],
  ["2³ = 8","Then the power. 16^(3/4) = 8."],
  ["Contrast: 16^(−3/4) = 1/8","A negative exponent just flips it to the reciprocal. Never makes anything negative."]]},
 rad3:{p:"Simplify:  √50 + 3√2",steps:[
  ["√50 = √(25·2) = 5√2","They don't look alike yet — simplify each radical first."],
  ["5√2 + 3√2","NOW they're like radicals — same number under the root."],
  ["= 8√2","Add coefficients exactly like 5x + 3x = 8x."],
  ["Warning: √50 + √2 ≠ √52","Roots do NOT split over addition. Only like radicals combine."]]},
 rad4:{p:"Solve:  √(x + 7) = x + 1",steps:[
  ["Radical is already isolated → square both sides","(√(x+7))² = (x+1)². Squaring is powerful but can create fake solutions — we'll check later."],
  ["x + 7 = x² + 2x + 1","(x + 1)² = x² + 2x + 1, NOT x² + 1. FOIL it."],
  ["x² + x − 6 = 0  →  (x + 3)(x − 2) = 0","Gather to one side, factor."],
  ["Candidates: x = −3 and x = 2","Both solve the SQUARED equation. But do they solve the original?"],
  ["Test −3: √4 = 2, but x + 1 = −2 ✗","2 ≠ −2 → EXTRANEOUS. The squaring invented it."],
  ["Test 2: √9 = 3 and 2 + 1 = 3 ✓ → x = 2","Only x = 2 survives. The check is not optional — it's part of the method (MLS A2.NQ.A.4)."]]},
 exp1:{p:"Simplify:  (x³ · x⁵)/x²   and   2⁻³",steps:[
  ["x³ · x⁵ = x⁸","Same base multiplied → ADD exponents (x·x·x times x·x·x·x·x is 8 x's)."],
  ["x⁸/x² = x⁶","Division → SUBTRACT exponents."],
  ["2⁻³ = 1/2³ = 1/8","Negative exponent = reciprocal — it never makes the value negative."],
  ["Also: (x³)⁵ = x¹⁵, and x⁰ = 1","Power to a power multiplies. Every rule here is just counting factors."]]},
 exp2:{p:"A $20,000 truck loses 15% of its value each year. Value after 2 years?",steps:[
  ["Losing 15% = keeping 85%","Decay factor b = 1 − 0.15 = 0.85. This one conversion is the whole battle."],
  ["V(t) = 20000(0.85)ᵗ","Exponential model: start × factor^time."],
  ["V(2) = 20000(0.85)² = 20000(0.7225)","Two years = multiply by 0.85 twice."],
  ["= $14,450","NOT the same as losing 30% once ($14,000) — each year's loss hits a smaller amount. That's exponential."]]},
 exp3:{p:"Convert  2⁵ = 32  to log form (and back)",steps:[
  ["A logarithm IS an exponent","log₂32 asks: '2 to what power gives 32?' The answer is the exponent."],
  ["2⁵ = 32  ⟺  log₂32 = 5","Base stays the base; the exponent and the result trade places."],
  ["Memory anchor: base^(log answer) = argument","log_b(x) = y ⟺ bʸ = x. Going back and forth fluently unlocks every log equation."],
  ["Quick checks: log₁₀1000 = 3;  log₇7 = 1;  log₉1 = 0","Because 10³ = 1000, 7¹ = 7, 9⁰ = 1."]]},
 exp4:{p:"Evaluate:  log₃81   and   log₅(1/25)",steps:[
  ["log₃81: '3 to what power is 81?'","Translate to the exponential question first — always."],
  ["3⁴ = 81 → log₃81 = 4","Count: 3, 9, 27, 81."],
  ["log₅(1/25): '5 to what power is 1/25?'","1/25 is a reciprocal → expect a NEGATIVE exponent."],
  ["5⁻² = 1/25 → log₅(1/25) = −2","Inputs between 0 and 1 give negative logs. And log₉3 = 1/2 since 9^(1/2) = 3 — roots give fractions."]]},
 exp5:{p:"Expand  log(x³y)  and condense  2log a − log b",steps:[
  ["log(x³y) = log x³ + log y","Product inside → SUM outside."],
  ["= 3log x + log y","Power rule: the exponent slides down front."],
  ["2log a = log a²","Condensing runs the rules backwards: coefficient → exponent."],
  ["log a² − log b = log(a²/b)","Subtraction → division inside one log. These mirror the exponent rules exactly — a log IS an exponent."]]},
 exp6:{p:"Solve:  9ˣ = 27^(x − 1)",steps:[
  ["Both sides are powers of 3","9 = 3², 27 = 3³. Same-base is the fastest weapon — look for it first."],
  ["3^(2x) = 3^(3(x − 1))","Rewrite each side: (3²)ˣ = 3^2x and (3³)^(x−1) = 3^(3x−3)."],
  ["2x = 3x − 3","Same base, equal results → the exponents must be equal."],
  ["x = 3","Solve the linear equation. Check: 9³ = 729 and 27² = 729 ✓"]]},
 exp7:{p:"Solve:  log₂(x) + log₂(x − 2) = 3",steps:[
  ["log₂[x(x − 2)] = 3","Two logs, same base, added → condense into ONE log (product rule)."],
  ["x(x − 2) = 2³ = 8","Convert to exponential form — the log is gone."],
  ["x² − 2x − 8 = 0  →  (x − 4)(x + 2) = 0","Standard quadratic: factor it."],
  ["Candidates: x = 4 and x = −2","Both solve the quadratic. But logs have a domain..."],
  ["x = −2 makes log₂(x) undefined → reject","You can't take the log of a negative. EXTRANEOUS."],
  ["x = 4 ✓  (log₂4 + log₂2 = 2 + 1 = 3)","Checking arguments are positive is mandatory, not polite."]]},
 seq1:{p:"Arithmetic sequence: a₁ = 7, d = 4. Find a₁₀.",steps:[
  ["The pattern: 7, 11, 15, 19, …","Arithmetic = ADD the same d each step."],
  ["aₙ = a₁ + (n − 1)d","From a₁ to a₁₀ you take 9 steps — that's the (n − 1)."],
  ["a₁₀ = 7 + 9(4)","n = 10 → nine jumps of 4."],
  ["= 7 + 36 = 43","Sanity check with a smaller case: a₃ = 7 + 2(4) = 15 ✓ matches the pattern."]]},
 seq2:{p:"Geometric sequence: 3, 6, 12, … Find a₆.",steps:[
  ["r = 6/3 = 2","Geometric = MULTIPLY by the same r. Find r by dividing neighbors."],
  ["aₙ = a₁ · rⁿ⁻¹","From term 1 to term 6: five multiplications — hence the n − 1."],
  ["a₆ = 3 · 2⁵ = 3 · 32","Exponent BEFORE multiplication (order of operations)."],
  ["= 96","Check the chain: 3, 6, 12, 24, 48, 96 ✓"]]},
 seq3:{p:"a₁ = 2,  aₙ₊₁ = 3aₙ − 1.  Find a₄.",steps:[
  ["Recursive = each term built from the last","No shortcut formula — march forward one term at a time."],
  ["a₂ = 3(2) − 1 = 5","Feed a₁ into the rule."],
  ["a₃ = 3(5) − 1 = 14","Feed a₂ in."],
  ["a₄ = 3(14) − 1 = 41","Label each term as you go — losing track of which term you're on is the main error."]]},
 seq4:{p:"Find the sum:  4 + 7 + 10 + … + 31",steps:[
  ["First find n: 31 = 4 + (n − 1)(3)","How many terms? Use the nth-term formula backwards."],
  ["27 = 3(n − 1) → n = 10","Ten terms."],
  ["Sₙ = n(a₁ + aₙ)/2","Gauss's trick: pair first+last (35), second+second-to-last (35)… every pair sums the same."],
  ["S₁₀ = 10(4 + 31)/2 = 5 · 35 = 175","'Number of terms × average of the ends.' That's the whole formula."]]},
 seq5:{p:"Sum:  5 + 10 + 20 + … (6 terms).  Then:  8 + 4 + 2 + 1 + … forever.",steps:[
  ["Finite: Sₙ = a₁(rⁿ − 1)/(r − 1)","Here a₁ = 5, r = 2, n = 6."],
  ["S₆ = 5(2⁶ − 1)/(2 − 1) = 5(63) = 315","Check the scale: last term is 160, sum 315 — plausible."],
  ["Infinite: r = 1/2, |r| < 1 → it CONVERGES","Terms shrink fast enough that the total stays finite."],
  ["S = a₁/(1 − r) = 8/(1 − ½) = 16","8 + 4 + 2 + 1 + ½ + … walks halfway to 16 forever. If |r| ≥ 1, no infinite sum exists."]]},
 data1:{p:"From 7 runners: medals (1st/2nd) vs. picking 2 for a team",steps:[
  ["The one question: does ORDER matter?","Medals: silver vs gold differs → order matters. A team of 2: swapping them changes nothing."],
  ["Medals: P(7,2) = 7 × 6 = 42","Permutation: 7 choices for gold, then 6 for silver."],
  ["Team: C(7,2) = 42/2 = 21","Combination: each pair was counted twice in the 42 (AB and BA), so divide by 2! = 2."],
  ["General: C(n,k) = P(n,k)/k!","Combinations = permutations with the orderings divided out. That's the entire relationship."]]},
 data2:{p:"Bag: 3 red, 5 blue, 2 green. P(not blue)?  P(two reds, no replacement)?",steps:[
  ["P(not blue) = 1 − P(blue) = 1 − 5/10 = 1/2","Complements are the fast lane: count the opposite, subtract from 1."],
  ["Two reds without replacement: first draw 3/10","3 favorable out of 10 total."],
  ["Second draw: 2/9","One red is GONE — numerator and denominator both shrink."],
  ["P = (3/10)(2/9) = 6/90 = 1/15","Multiply along the path. 'Without replacement' means the second fraction always changes."]]},
 data3:{p:"A fair coin is flipped 4 times. P(exactly 2 heads)?",steps:[
  ["Total outcomes: 2⁴ = 16","Each flip doubles the possibilities."],
  ["Ways to place 2 heads among 4 flips: C(4,2) = 6","HHTT, HTHT, HTTH, THHT, THTH, TTHH — the combination counts WHICH flips are heads."],
  ["P = 6/16 = 3/8","Favorable over total."],
  ["General: C(n,k) pᵏ(1−p)ⁿ⁻ᵏ","With an unfair coin the arrangements each cost pᵏ(1−p)ⁿ⁻ᵏ instead of 1/2ⁿ — same counting, different weights."]]},
 data4:{p:"Raffle: 50 tickets at $2. One prize: $60. Expected value of a ticket?",steps:[
  ["EV = Σ (value × probability)","The long-run average per play — the casino's favorite number."],
  ["Expected winnings: (1/50)($60) = $1.20","One chance in 50 at $60."],
  ["Subtract the cost: 1.20 − 2 = −$0.80","You pay $2 no matter what."],
  ["EV = −$0.80 per ticket","Buy 100 tickets, expect to lose ≈ $80. Negative EV: fine as a donation, bad as a strategy."]]},
 data5:{p:"Scores: normal, μ = 100, σ = 15. How unusual is 130?",steps:[
  ["z = (x − μ)/σ = (130 − 100)/15","The z-score counts standard deviations from the mean."],
  ["z = 2","130 sits exactly 2σ above average."],
  ["Empirical rule: 95% lies within 2σ","So 5% lies beyond ±2σ — split between the two tails."],
  ["≈ 2.5% score above 130","z-scores also let you compare different scales fairly: z = 2 beats z = 1.4, whatever the raw points were."]]}
};

   ANSWER CHECKING
   ============================================================ */
function normTxt(s){
  return String(s).toLowerCase()
    .replace(/−|–|—/g,"-")
    .replace(/\s+/g,"")
    .replace(/×/g,"*")
    .replace(/^x=|^y=|^t=|^n=|^k=|^c=/,"")
    .replace(/\.$/,"");
}
function parseNum(s){
  s=normTxt(s);
  if(s==="")return null;
  var m=s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if(m){var d=parseFloat(m[2]);if(d===0)return null;return parseFloat(m[1])/d;}
  if(/^-?\d*\.?\d+$/.test(s))return parseFloat(s);
  return null;
}
function numEq(u,a){
  var pu=parseNum(u),pa=parseNum(a);
  if(pu===null||pa===null)return false;
  return Math.abs(pu-pa)<=1e-6*Math.max(1,Math.abs(pa));
}
function elemEq(u,a){ // one element: numeric if possible, else text (handles 2+3i)
  if(numEq(u,a))return true;
  return normTxt(u)===normTxt(a);
}
function splitList(s){
  s=String(s).replace(/−/g,"-").replace(/\bor\b|\band\b|;/gi,",");
  s=s.replace(/[()\[\]{}]/g,"");
  // expand "±5" into "5,-5"
  if(s.indexOf("±")>=0){
    var core=s.replace(/±/g,"").replace(/\s+/g,"");
    return [core,"-"+core.replace(/^-/,"")];
  }
  var parts=s.split(","),out=[],i;
  for(i=0;i<parts.length;i++){if(normTxt(parts[i])!=="")out.push(parts[i]);}
  return out;
}
function checkAnswer(qo,input){
  var i,j;
  if(qo.type==="num"){
    if(numEq(input,qo.ans))return true;
    if(qo.alt){for(i=0;i<qo.alt.length;i++)if(elemEq(input,qo.alt[i]))return true;}
    return elemEq(input,qo.ans);
  }
  if(qo.type==="text"){
    if(elemEq(input,qo.ans))return true;
    if(qo.alt){for(i=0;i<qo.alt.length;i++)if(elemEq(input,qo.alt[i]))return true;}
    return false;
  }
  if(qo.type==="set"){
    var want=splitList(qo.ans),got=splitList(input);
    if(want.length!==got.length)return false;
    var used=[];
    for(i=0;i<want.length;i++){
      var found=false;
      for(j=0;j<got.length;j++){
        if(used.indexOf(j)>=0)continue;
        if(elemEq(got[j],want[i])){used.push(j);found=true;break;}
      }
      if(!found)return false;
    }
    return true;
  }
  if(qo.type==="pair"||qo.type==="tuple"){
    var w2=splitList(qo.ans),g2=splitList(input);
    if(w2.length!==g2.length)return false;
    for(i=0;i<w2.length;i++)if(!elemEq(g2[i],w2[i]))return false;
    return true;
  }
  return false;
}
