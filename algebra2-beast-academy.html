   SESSION CONTROLLER (practice / quiz / review / diag / mock /
   beast / blitz all run through one training loop)
   ============================================================ */
var sess=null;
function unlockBeast(){
  var n=0,i;
  for(i=0;i<UNITS.length;i++)if(unitMastery(UNITS[i].id)>=60)n++;
  return n>=3;
}
function startPractice(skillId,force){
  if(!force&&sk(skillId).att===0&&WORKED[skillId]){
    openLesson(skillId,true);
    toast("📖 New skill — watch how it's done first. (You can skip ahead.)");
    return;
  }
  sess={mode:"practice",skillId:skillId,idx:0,cor:0,wrong:0,results:[],hintUsed:false};
  nextQ();
}
/* leave a running session to go study the worked example */
function toLesson(id){
  if(sess&&sess.timerId)clearInterval(sess.timerId);
  sess=null;
  openLesson(id);
}
function startQuiz(unitId){
  var u=unitById(unitId),items=[],i;
  var pool=shuffle(u.skills);
  for(i=0;i<8;i++)items.push(pool[i%pool.length].id);
  sess={mode:"quiz",unitId:unitId,items:items,idx:0,cor:0,wrong:0,results:[],hintUsed:false};
  nextQ();
}
function startReview(){
  var due=shuffle(reviewDue()).slice(0,8);
  if(!due.length){toast("✅ Nothing due for review — go learn something new!");return;}
  sess={mode:"review",items:due.map(function(d){return d.id;}),idx:0,cor:0,wrong:0,results:[],hintUsed:false};
  nextQ();
}
function startDiag(){
  sess={mode:"diag",idx:0,cor:0,wrong:0,results:[],hintUsed:false};
  nextQ();
}
function startMock(){
  var items=[],i,j;
  var us=shuffle(UNITS.slice());
  for(i=0;i<us.length;i++){
    var ss=shuffle(us[i].skills.slice());
    for(j=0;j<2&&j<ss.length;j++)items.push(ss[j].id);
  }
  items=shuffle(items).slice(0,20);
  sess={mode:"mock",items:items,idx:0,cor:0,wrong:0,results:[],hintUsed:false};
  nextQ();
}
function startBeast(){
  if(!unlockBeast()){toast("🔒 Beast Mode unlocks when 3 units reach 60%+ mastery. Keep training!");return;}
  sess={mode:"beast",idx:0,cor:0,wrong:0,results:[],hintUsed:false};
  nextQ();
}
function startBlitz(){
  sess={mode:"blitz",idx:0,cor:0,wrong:0,results:[],hintUsed:false,timeLeft:60};
  var mySess=sess;
  mySess.timerId=setInterval(function(){
    if(sess!==mySess){clearInterval(mySess.timerId);return;}
    sess.timeLeft--;
    var t=document.getElementById("blitzT");
    if(t)t.textContent=sess.timeLeft+"s";
    if(sess.timeLeft<=5&&sess.timeLeft>0)SFX.tick();
    if(sess.timeLeft<=0)endSess();
  },1000);
  nextQ();
}
function sessionSkill(){
  if(sess.mode==="practice")return sess.skillId;
  if(sess.mode==="diag")return DIAG_SPEC[sess.idx].sk;
  if(sess.mode==="beast")return sess.qo&&sess.qo.sk?sess.qo.sk:"quad6";
  if(sess.mode==="blitz")return sess.blitzSk;
  return sess.items[sess.idx];
}
function makeQ(){
  var skid,L;
  if(sess.mode==="diag"){
    var spec=DIAG_SPEC[sess.idx];
    return {sk:spec.sk,L:spec.L,qo:GEN[spec.sk](spec.L)};
  }
  if(sess.mode==="beast"){
    var qo=pick(BEAST)();
    return {sk:qo.sk||"quad6",L:5,qo:qo};
  }
  if(sess.mode==="blitz"){
    var all=[],i,jx;
    for(i=0;i<UNITS.length;i++)for(jx=0;jx<UNITS[i].skills.length;jx++)all.push(UNITS[i].skills[jx].id);
    skid=pick(all);sess.blitzSk=skid;
    return {sk:skid,L:ri(1,2),qo:GEN[skid](ri(1,2))};
  }
  skid=sess.mode==="practice"?sess.skillId:sess.items[sess.idx];
  L=pickLevel(skid);
  if(sess.mode==="mock")L=Math.max(2,Math.min(4,L));
  return {sk:skid,L:L,qo:GEN[skid](L)};
}
function sessLen(){
  if(sess.mode==="diag")return DIAG_SPEC.length;
  if(sess.mode==="quiz"||sess.mode==="review"||sess.mode==="mock")return sess.items.length;
  return 0; // endless
}
function nextQ(){
  var total=sessLen();
  if(total&&sess.idx>=total){endSess();return;}
  var made=makeQ();
  sess.cur=made;sess.qo=made.qo;sess.locked=false;sess.mcPick=-1;sess.hintUsed=false;sess.hintStage=0;
  sess.workImg=null;sess.workTxt="";sess.drew=false;sess.workInit=false;
  renderTrain();
}
function submitAns(){
  if(!sess||sess.locked)return;
  var qo=sess.qo,input;
  if(qo.type==="mc"){
    if(sess.mcPick<0){toast("Pick an answer first!");return;}
    input=qo.choices[sess.mcPick];
  }else{
    var box=document.getElementById("ansBox");
    input=box?box.value:"";
    if(normTxt(input)===""){toast("Type an answer first!");return;}
  }
  // capture scratch work before the re-render wipes the canvas
  if(sess.mode!=="blitz"){
    var wcv=document.getElementById("workCv");
    if(wcv&&sess.drew){try{sess.workImg=wcv.toDataURL("image/png");}catch(e2){}}
    var wtx=document.getElementById("workTx");
    if(wtx)sess.workTxt=wtx.value;
  }
  var ok=checkAnswer(qo,input);
  sess.locked=true;sess.lastOk=ok;sess.lastInput=input;
  var skid=sess.cur.sk,L=sess.cur.L;
  // remember the latest problem so the AI tutor has full context
  S.lastCtx={q:String(qo.html).replace(/<[^>]*>/g," ").replace(/\s+/g," ").slice(0,300),
    ur:String(input).slice(0,80),ans:String(qo.ans),ok:ok,skill:skid,
    expl:String(qo.expl||"").replace(/<[^>]*>/g," ").slice(0,400),
    work:String(sess.workTxt||"").slice(0,300)};
  var deferred=(sess.mode==="diag"||sess.mode==="mock");
  if(sess.mode!=="diag"){recordAnswer(skid,L,ok);}
  if(ok){sess.cor++;}else{sess.wrong++;if(!deferred)logMistake(skid,qo,input);}
  sess.results.push({sk:skid,L:L,ok:ok,q:qo,input:input});
  questTick(ok);
  // combo: consecutive correct answers multiply XP (×2 at 5, ×3 at 10)
  var mult=1;
  if(!deferred){
    if(ok){
      sess.combo=(sess.combo||0)+1;
      if(sess.combo>S.comboBest){S.comboBest=sess.combo;save();}
      mult=sess.combo>=10?3:(sess.combo>=5?2:1);
      if(sess.combo===5){toast("🔥 5 IN A ROW — XP ×2!");SFX.level();}
      if(sess.combo===10){toast("⚡ 10 STREAK — XP ×3! UNSTOPPABLE!");confetti();SFX.level();}
    }else sess.combo=0;
  }
  if(ok){
    if(sess.mode==="beast"){S.beastWins++;save();addXP(60*mult);}
    else if(sess.mode==="blitz"){addXP(6*mult);}
    else if(sess.mode==="diag"){addXP(5);}
    else addXP((10*L+(sess.hintUsed?-3:0))*mult);
  }else{addXP(2);}
  if(!deferred){SFX[ok?"ok":"bad"]();}
  else{SFX.click();}
  checkBadges();
  sess.idx++;
  if(deferred){nextQ();return;}
  if(sess.mode==="blitz"){nextQ();return;}
  renderTrain(); // show feedback + next button
}
function pickMC(i){
  if(!sess||sess.locked)return;
  sess.mcPick=i;SFX.click();
  var btns=document.querySelectorAll(".mcbtn"),j;
  for(j=0;j<btns.length;j++)btns[j].className="mcbtn"+(j===i?" pick":"");
}
/* progressive hints: strategy first, then the actual setup (Khan-style) */
function showHint(){
  if(!sess||sess.locked)return;
  sess.hintUsed=true;
  sess.hintStage=(sess.hintStage||0)+1;
  var h=document.getElementById("hintBox"),qo=sess.qo;
  if(!h)return;
  h.classList.remove("hidden");
  if(sess.hintStage===1){
    h.innerHTML="💡 "+(qo.hint||"Break it into steps — what's the FIRST move?");
    var hb=document.getElementById("hintBtn");
    if(hb&&qo.expl)hb.innerHTML="💡 More help";
  }else{
    var setup=String(qo.expl||"").split("→")[0];
    if(setup.length>140)setup=setup.slice(0,140)+"…";
    h.innerHTML="💡 "+(qo.hint||"")+"<div style='margin-top:8px;border-top:1px solid #27408f;padding-top:8px'>🧭 <b>Setup:</b> "+setup+"</div>";
  }
}
/* ---------- show-your-work scratchpad ---------- */
function togWork(){
  if(!sess)return;
  var wa=document.getElementById("workArea");if(!wa)return;
  sess.workOpen=!sess.workOpen;
  var b=document.getElementById("workBtn");
  if(b)b.innerHTML="✏️ "+(sess.workOpen?"Hide":"Show")+" work";
  if(sess.workOpen){wa.classList.remove("hidden");initWorkArea();}
  else{wa.classList.add("hidden");}
  SFX.click();
}
function initWorkArea(){
  var cv=document.getElementById("workCv");if(!cv||!sess)return;
  if(sess.workInit)return;
  var w=cv.parentNode.clientWidth-20;
  if(w<50)return;
  sess.workInit=true;
  cv.width=w;cv.height=240;
  var ctx=cv.getContext("2d");
  ctx.strokeStyle="#ffd97a";ctx.lineWidth=2.5;ctx.lineCap="round";ctx.lineJoin="round";ctx.fillStyle="#ffd97a";
  var drawing=false,px=0,py=0;
  function pos(e){var r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*(cv.width/r.width),y:(e.clientY-r.top)*(cv.height/r.height)};}
  cv.onpointerdown=function(e){drawing=true;sess.drew=true;var p=pos(e);px=p.x;py=p.y;
    ctx.beginPath();ctx.arc(px,py,1.2,0,6.3);ctx.fill();
    try{cv.setPointerCapture(e.pointerId);}catch(err){}
    e.preventDefault();};
  cv.onpointermove=function(e){if(!drawing)return;var p=pos(e);
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(p.x,p.y);ctx.stroke();
    px=p.x;py=p.y;e.preventDefault();};
  cv.onpointerup=cv.onpointercancel=function(){drawing=false;};
}
function clearWork(){
  var cv=document.getElementById("workCv");
  if(cv){var ctx=cv.getContext("2d");ctx.clearRect(0,0,cv.width,cv.height);}
  if(sess){sess.drew=false;sess.workImg=null;}
  var tx=document.getElementById("workTx");if(tx)tx.value="";
}
function endSess(){
  if(!sess)return;
  if(sess.timerId)clearInterval(sess.timerId);
  var m=sess.mode,res=sess.results;
  if(m==="diag"&&res.length>=DIAG_SPEC.length){
    // seed mastery from diagnostic
    var byUnit={},i;
    for(i=0;i<res.length;i++){
      var ud=skillDef(res[i].sk).unit;
      if(!byUnit[ud])byUnit[ud]={c:0,n:0};
      byUnit[ud].n++;if(res[i].ok)byUnit[ud].c++;
    }
    var uid;
    for(uid in byUnit){
      var seed=byUnit[uid].c===byUnit[uid].n?76:(byUnit[uid].c>0?54:26);
      var u=unitById(uid),j2;
      for(j2=0;j2<u.skills.length;j2++){
        var st=sk(u.skills[j2].id);
        if(st.att===0||st.m<seed){st.m=seed;}
      }
      S.diagUnits[uid]=Math.round(100*byUnit[uid].c/byUnit[uid].n);
    }
    // direct hits adjust their own skill
    for(i=0;i<res.length;i++){
      var st2=sk(res[i].sk);
      st2.att++;if(res[i].ok){st2.cor++;st2.m=Math.min(88,st2.m+8);}else{st2.m=Math.max(10,st2.m-10);st2.hist.push({l:res[i].L,ok:0,t:Date.now()});}
      st2.last=Date.now();
    }
    S.diagDone=true;S.diagDate=todayKey();
    addXP(50);save();checkBadges();
  }
  if(m==="mock"&&res.length>0){
    var per={},k;
    for(k=0;k<res.length;k++){
      var uu=skillDef(res[k].sk).unit;
      if(!per[uu])per[uu]={c:0,n:0};
      per[uu].n++;if(res[k].ok)per[uu].c++;
    }
    var perPct={},kk;
    for(kk in per)perPct[kk]=Math.round(100*per[kk].c/per[kk].n);
    var pct=Math.round(100*sess.cor/res.length);
    S.tests.push({date:todayKey(),pct:pct,per:perPct});
    addXP(40+pct);save();checkBadges();
    // log mock mistakes now
    for(k=0;k<res.length;k++)if(!res[k].ok)logMistake(res[k].sk,res[k].q,res[k].input);
  }
  if(m==="blitz"){
    if(sess.cor>S.blitzBest){S.blitzBest=sess.cor;save();}
    checkBadges();
  }
  sess.done=true;
  renderSummary();
}
function quitSess(){
  if(sess&&sess.timerId)clearInterval(sess.timerId);
  sess=null;
  go(view==="train"?"home":view);
}

/* ============================================================
   VIEWS & RENDERING
   ============================================================ */
var view="home",curSkill=null,openU={};
function el(id){return document.getElementById(id);}
function toast(msg){
  var t=document.createElement("div");
  t.className="toast";t.innerHTML=msg;
  document.body.appendChild(t);
  setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},2600);
}
function paintTop(){
  var li=lvlInfo();
  el("pillStreak").innerHTML='<span class="ic flame">🔥</span><span>'+S.streak.count+'</span>';
  el("pillLvl").innerHTML='<span class="ic">'+li.def.ic+'</span><span>'+li.def.name+'</span>';
  el("pillXp").innerHTML='<span class="ic">⭐</span><span>'+S.xp+' XP</span>';
  el("xpFill").style.width=li.pct+"%";
}
function mbar(m,att){
  var t=att?mTier(m):0;
  return '<div class="bar"><div class="m'+(att?t:0)+'" style="width:'+Math.max(2,Math.round(m))+'%"></div></div>';
}
function go(v){
  view=v;
  var btns=document.querySelectorAll(".nbtn"),i;
  for(i=0;i<btns.length;i++)btns[i].className="nbtn"+(btns[i].getAttribute("data-v")===v?" on":"");
  if(v==="home")renderHome();
  else if(v==="tree")renderTree();
  else if(v==="battle")renderBattle();
  else if(v==="stats")renderStats();
  else if(v==="ref")renderRef();
  else if(v==="chat")renderChat();
  else if(v==="search")renderSearch();
  paintTop();
  window.scrollTo(0,0);
}
function recommend(){
  if(!S.diagDone)return {label:"🔬 Take the Diagnostic",act:"startDiag()",why:"Map your strengths first — then training gets personal."};
  var due=reviewDue();
  if(due.length>=3)return {label:"🔁 Review "+due.length+" due skills",act:"startReview()",why:"Spaced review locks in what you learned."};
  var w=weakSkills(1);
  if(w.length&&w[0].m<75){
    var d=skillDef(w[0].d.id);
    if(w[0].m<50&&WORKED[d.id])
      return {label:"📖 Re-learn: "+d.name,act:"openLesson('"+d.id+"')",why:"Your weakest skill ("+Math.round(w[0].m)+"%). Watch a worked example first, then drill it."};
    return {label:"🎯 Train: "+d.name,act:"startPractice('"+d.id+"',true)",why:"Your weakest skill right now ("+Math.round(w[0].m)+"%). Attack weaknesses first."};
  }
  if(unlockBeast())return {label:"🐲 Beast Mode",act:"startBeast()",why:"You're strong — time for non-routine problems."};
  var u=UNITS[ri(0,UNITS.length-1)];
  return {label:"📚 Quiz: "+u.name,act:"startQuiz('"+u.id+"')",why:"Mixed practice across a unit."};
}

  h+='<div class="card click" style="margin:0" onclick="startMock()"><div style="font-size:22px">📝</div><h3>Mock EOC Test</h3><div class="sub">20 questions, graded at the end</div></div>';
  h+='<div class="card click '+(unlockBeast()?'beastcard':'')+'" style="margin:0" onclick="startBeast()"><div style="font-size:22px">'+(unlockBeast()?'🐲':'🔒')+'</div><h3>Beast Mode</h3><div class="sub">'+(unlockBeast()?'Multi-topic monsters. +60 XP each':'Unlock: 3 units at 60%+')+'</div></div>';

  var nlabs=0,lk;for(lk in S.labs)nlabs++;

/* ---------- SKILL TREE ---------- */
function renderTree(){
  var h='<div class="card" style="background:none;border:none;padding:0"><h2>🌳 Skill Tree</h2><div class="sub">Tap a unit to expand. Tap a skill to study, drill, and master it. Every tile goes deeper.</div></div>';
  var i,j;
  for(i=0;i<UNITS.length;i++){
    var u=UNITS[i],um=Math.round(unitMastery(u.id)),open=!!openU[u.id];
    var anyAtt=false;
    for(j=0;j<u.skills.length;j++)if(sk(u.skills[j].id).att>0)anyAtt=true;
    h+='<div class="card unit">';
    h+='<div class="row" style="cursor:pointer" onclick="togUnit(\''+u.id+'\')"><div style="font-size:22px">'+u.ic+'</div><div class="grow"><h3>'+u.name+'</h3><div class="sub">'+u.mls+'</div></div><div style="min-width:64px;text-align:right"><div style="font-weight:900">'+(anyAtt?um+'%':'—')+'</div>'+mbar(um,anyAtt?1:0)+'</div><span class="chev'+(open?' open':'')+'">▶</span></div>';
    if(open){
      h+='<div class="sub" style="margin:8px 0 4px">'+u.blurb+'</div>';
      for(j=0;j<u.skills.length;j++){
        var d=u.skills[j],st=sk(d.id);
        h+='<div class="skrow" onclick="openSkill(\''+d.id+'\')"><div class="grow"><div style="font-weight:700;font-size:13.5px">'+d.name+'</div>'+mbar(st.m,st.att)+'</div>'+tierTag(st.m,st.att)+'<span class="chev">▶</span></div>';

var lessonSk=null,lessonStep=1,lessonGated=false,lessonCheck=null;

function lcSubmit(){
  var cq=lessonCheck.qo,input;

function buildSearch(){

    }
  }
  for(i=0;i<LABS.length;i++)
    idx.push({l:LABS[i].ic+" Lab: "+LABS[i].name,s:"Practice Lab · "+unitById(LABS[i].unit).name,k:(LABS[i].name+" lab "+LABS[i].intro).toLowerCase(),act:"startLab('"+LABS[i].id+"')"});
  for(i=0;i<JUSTIFY.length;i++)
    idx.push({l:"⚖️ Justify: "+JUSTIFY[i].name,s:"Explain-your-answer · "+unitById(JUSTIFY[i].unit).name,k:(JUSTIFY[i].name+" justify explain reason property proof "+unitById(JUSTIFY[i].unit).name).toLowerCase(),act:"startJustify('"+JUSTIFY[i].id+"')"});
  idx.push({l:"🔬 Diagnostic Test",s:"Map your level across all domains",k:"diagnostic test assessment placement level",act:"startDiag()"});
  idx.push({l:"📝 Mock EOC Exam",s:"20 questions, graded like test day",k:"mock test exam eoc missouri practice test",act:"startMock()"});
  idx.push({l:"⚡ Blitz",s:"60-second speed round",k:"blitz speed timed fast round",act:"startBlitz()"});
  idx.push({l:"🐲 Beast Mode",s:"Multi-topic challenge problems",k:"beast mode challenge hard elite",act:"startBeast()"});
  idx.push({l:"🔁 Review Queue",s:"Spaced review of fading skills",k:"review spaced repetition due queue",act:"startReview()"});
  idx.push({l:"🤖 AI Tutor",s:"Ask anything, get unstuck",k:"tutor chat help ask question ai claude stuck",act:"go('chat')"});
  idx.push({l:"📚 Formula Vault",s:"Every formula + the curriculum map",k:"formula reference sheet curriculum standards missouri map",act:"go('ref')"});

function renderSearch(){
  var h='<div class="card" style="background:none;border:none;padding:0"><h2>🔍 Search</h2><div class="sub">Skills, lessons, labs, formulas, modes — jump anywhere.</div></div>';
  h+='<input id="searchBox" class="searchin" placeholder="Try: logarithms, factoring, lab, mock test…" oninput="doSearch()" autocomplete="off">';
  h+='<div id="sresults" style="margin-top:10px"></div>';
  el("main").innerHTML=h;
  var b=el("searchBox");if(b)b.focus();
  doSearch();
}
function doSearch(){
  var b=el("searchBox"),out=el("sresults");
  if(!b||!out)return;
  var qv=b.value.toLowerCase().replace(/^\s+|\s+$/g,""),idx=buildSearch(),res=[],i;
  if(!qv){
    out.innerHTML='<div class="card"><div class="sub">Popular jumps:</div>'+
      ['startDiag()|🔬 Diagnostic',"go('chat')|🤖 Ask the AI Tutor","togUnitGo('quad')|🎯 Quadratics","startLab('lab_quad')|💧 Water Balloon Lab"].map(function(s){var p=s.split("|");return '<span class="qchip" onclick="'+p[0]+'">'+p[1]+'</span>';}).join("")+'</div>';
    return;
  }
  var terms=qv.split(/\s+/);
  for(i=0;i<idx.length;i++){
    var e=idx[i],score=0,ok=true,t;
    for(t=0;t<terms.length;t++){
      if(e.l.toLowerCase().indexOf(terms[t])>=0)score+=3;
      else if(e.k.indexOf(terms[t])>=0)score+=1;
      else{ok=false;break;}
    }
    if(ok)res.push({e:e,sc:score});
  }
  res.sort(function(a,b2){return b2.sc-a.sc;});
  var h="",j;
  for(j=0;j<res.length&&j<12;j++){
    h+='<div class="sres" onclick="'+res[j].e.act+'"><div class="grow"><div style="font-weight:800;font-size:14px">'+res[j].e.l+'</div><div class="sub" style="font-size:11.5px">'+res[j].e.s+'</div></div><span class="chev">▶</span></div>';
  }
  out.innerHTML=h||'<div class="card"><div class="sub">Nothing matched "'+esc(qv)+'". Try a topic word like "logs", "factoring", "asymptote" — or ask the <span style="color:var(--gold);cursor:pointer" onclick="go(\'chat\')">AI Tutor</span>.</div></div>';
}

/* ============================================================
   AI TUTOR CHAT — Claude API (student's own key, stored locally)
   with a useful offline coach as the no-key fallback.
   ============================================================ */
var chatBusy=false,chatShowSettings=false;
function fmtBot(t){ // escape, then light markdown (bold + newlines)
  var s=esc(t);
  s=s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  return s.replace(/\n/g,"<br>");
}
function tutorSystem(){
  var wk=weakSkills(3),i,names=[];
  for(i=0;i<wk.length;i++)names.push(skillDef(wk[i].d.id).name+" ("+Math.round(wk[i].m)+"%)");
  var s="You are the Beast Academy Tutor: an elite, energetic Algebra 2 coach inside a training app used by a 16-year-old student in Branson, Missouri. Teaching style: diagnose the misconception first, explain the concept simply, show ONE short worked example with plain-text math (x^2, sqrt(x), 3/4), then give ONE similar practice problem and STOP so the student can try. Never solve graded schoolwork wholesale. Be direct, encouraging, never condescending. Keep answers under 250 words. Stay on math and study skills.";
  s+="\n\nSTUDENT SNAPSHOT: Level "+lvlInfo().def.name+", "+S.xp+" XP, overall Algebra 2 mastery "+Math.round(overallMastery())+"%, day streak "+S.streak.count+". Weakest skills: "+(names.join("; ")||"none measured yet")+".";
  if(S.lastCtx){
    var c=S.lastCtx;
    s+="\n\nMOST RECENT PROBLEM (the student may ask about it):\nProblem: "+c.q+"\nStudent's answer: "+c.ur+" ("+(c.ok?"correct":"wrong")+")\nCorrect answer: "+c.ans+"\nSolution: "+c.expl+(c.work?"\nStudent's typed work: "+c.work:"");
  }
  return s;
}
function chatSend(preset){
  if(chatBusy)return;
  var inp=el("chatIn"),txt=preset||(inp?inp.value:"");
  txt=String(txt).replace(/^\s+|\s+$/g,"");
  if(!txt)return;
  S.chat.push({r:"u",c:txt});
  if(S.chat.length>40)S.chat.splice(0,S.chat.length-40);
  S.tutorMsgs++;save();checkBadges();
  chatBusy=true;renderChat();
  if(S.chatKey)callClaude();
  else setTimeout(function(){offlineTutor(txt);},450);
}
function pushBot(html,isHtml){
  S.chat.push({r:"a",c:html,h:isHtml?1:0});
  if(S.chat.length>40)S.chat.splice(0,S.chat.length-40);
  chatBusy=false;save();renderChat();
}
function callClaude(){
  var msgs=[],i,hist=S.chat.slice(-12);
  for(i=0;i<hist.length;i++)msgs.push({role:hist[i].r==="u"?"user":"assistant",content:hist[i].c});
  var headers={
    "content-type":"application/json",
    "x-api-key":S.chatKey,
    "anthropic-version":"2023-06-01",
    "anthropic-dangerous-direct-browser-access":"true"
  };
  var body={model:S.chatModel||"claude-opus-5",max_tokens:1500,system:tutorSystem(),messages:msgs};
  if((body.model||"").indexOf("claude-opus-5")===0){
    headers["anthropic-beta"]="server-side-fallback-2026-07-01";
    body.fallbacks="default";
  }
  fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:headers,body:JSON.stringify(body)})
    .then(function(r){return r.json();})
    .then(function(j){
      if(j.error){
        var msg="⚠️ "+(j.error.message||"API error");
        if(j.error.type==="authentication_error")msg+="\n\nCheck your API key in ⚙️ Settings (it should start with sk-ant-).";
        pushBot(msg);return;
      }
      if(j.stop_reason==="refusal"){pushBot("I can't help with that one. Let's get back to the math — what are you working on?");return;}
      var t="",k;
      for(k=0;k<(j.content||[]).length;k++)if(j.content[k].type==="text")t+=j.content[k].text;
      pushBot(t||"(empty response — try rephrasing)");
    })
    .catch(function(e){
      pushBot("⚠️ Couldn't reach the tutor ("+e.message+"). Check your internet connection — or I can still help offline: try 'why was I wrong' or name a topic.");
    });
}
function offlineTutor(txt){
  var t=txt.toLowerCase(),i,j;
  // 1) "why was I wrong" → replay last mistake
  if(/why|wrong|mistake|missed|help me/.test(t)&&S.lastCtx&&!S.lastCtx.ok){
    var c=S.lastCtx,d=skillDef(c.skill);
    pushBot("<b>Let's autopsy that one.</b><br><br><b>The problem:</b> "+esc(c.q).slice(0,220)+"<br><b>You said:</b> "+esc(c.ur)+" · <b>Correct:</b> "+esc(c.ans)+"<br><br><b>The fix:</b> "+c.expl+"<br><br>"+(d&&WORKED[d.id]?"Want the full method? <span class='qchip' onclick=\"openLesson('"+d.id+"')\">📖 Walk through a worked example</span>":""),true);
    return;
  }
  // 2) topic mention → route to that skill's lesson
  var best=null,bestScore=0,idx=buildSearch();
  for(i=0;i<UNITS.length;i++)for(j=0;j<UNITS[i].skills.length;j++){
    var d2=UNITS[i].skills[j],words=d2.name.toLowerCase().split(/[^a-z]+/),sc=0,w;
    for(w=0;w<words.length;w++)if(words[w].length>3&&t.indexOf(words[w])>=0)sc++;
    if(sc>bestScore){bestScore=sc;best=d2;}
  }
  if(best){
    pushBot("<b>"+best.name+"</b> — here's the core idea:<br><br>"+(LESSONS[best.id]||"")+"<br><br><span class='qchip' onclick=\"openLesson('"+best.id+"')\">📖 See it solved step-by-step</span> <span class='qchip' onclick=\"startPractice('"+best.id+"',true)\">🥊 Practice it</span>",true);
    return;
  }
  // 3) default
  pushBot("I'm in <b>offline coach</b> mode right now (add a Claude API key in ⚙️ Settings to unlock the full AI tutor — it can diagnose your exact mistakes and make custom examples).<br><br>Meanwhile I can still help. Try:<br>• \"why was I wrong\" after missing a question<br>• naming a topic — \"logarithms\", \"factoring\", \"asymptotes\"<br>• 🔍 Search to jump anywhere",true);
}
function chatSaveKey(){
  var k=el("keyIn"),m=el("mdlSel");
  if(k)S.chatKey=k.value.replace(/^\s+|\s+$/g,"");
  if(m)S.chatModel=m.value;
  save();chatShowSettings=false;renderChat();
  toast(S.chatKey?"🔑 Key saved (stored only on this device)":"Key cleared — offline coach mode");
}
function chatClear(){if(confirm("Clear the whole conversation?")){S.chat=[];save();renderChat();}}
function togChatSettings(){chatShowSettings=!chatShowSettings;renderChat();}
function askTutorWhy(){
  go("chat");
  chatSend("Why was my answer wrong on that last problem? Walk me through where my thinking broke, then give me one similar problem to try.");
}
function renderChat(){
  view="chat";
  var btns=document.querySelectorAll(".nbtn"),bi;
  for(bi=0;bi<btns.length;bi++)btns[bi].className="nbtn"+(btns[bi].getAttribute("data-v")==="chat"?" on":"");
  var h='<div class="row" style="margin-bottom:8px"><div class="grow"><h2>🤖 AI Tutor</h2><div class="sub">'+(S.chatKey?"Powered by Claude · your key stays on this device":"Offline coach mode — add a key in ⚙️ for the full AI tutor")+'</div></div><button class="btn sec sm" onclick="togChatSettings()">⚙️</button></div>';
  if(chatShowSettings){
    h+='<div class="card"><h3>⚙️ Tutor Settings</h3><div class="sub" style="margin-bottom:8px">Paste a Claude API key from <b>console.anthropic.com</b>. It\'s stored ONLY in this browser\'s localStorage and sent only to Anthropic\'s API. API use is pay-per-message (a parent should set this up).<br><br><b>No-typing shortcut:</b> open this file once with <b>#key=sk-ant-…</b> added to the end of the address — the key installs itself and is scrubbed from the address bar.</div>'+
      '<input id="keyIn" class="ansin" type="password" placeholder="sk-ant-…" value="'+esc(S.chatKey)+'">'+
      '<div class="row" style="margin-top:8px"><select id="mdlSel" class="ansin" style="flex:1">'+
      '<option value="claude-opus-5"'+(S.chatModel==="claude-opus-5"?" selected":"")+'>Claude Opus 5 — best teacher</option>'+
      '<option value="claude-sonnet-5"'+(S.chatModel==="claude-sonnet-5"?" selected":"")+'>Claude Sonnet 5 — fast + cheaper</option>'+
      '<option value="claude-haiku-4-5"'+(S.chatModel==="claude-haiku-4-5"?" selected":"")+'>Claude Haiku 4.5 — cheapest</option>'+
      '</select></div>'+
      '<div class="row" style="margin-top:10px"><button class="btn grow" onclick="chatSaveKey()">Save</button><button class="btn sec" onclick="chatClear()">🗑 Clear chat</button></div></div>';
  }
  h+='<div class="chatwrap" id="chatLog">';
  if(!S.chat.length){
    h+='<div class="msg bot"><div class="who">Tutor</div>Yo! I\'m your personal Algebra 2 tutor. Miss a question? I\'ll find exactly where your thinking broke. Stuck on a topic? I\'ll teach it and build you custom examples. What are we working on?</div>';
  }
  var i;
  for(i=0;i<S.chat.length;i++){
    var m=S.chat[i];
    if(m.r==="u")h+='<div class="msg me">'+esc(m.c)+'</div>';
    else h+='<div class="msg bot"><div class="who">'+(S.chatKey?"Claude Tutor":"Offline Coach")+'</div>'+(m.h?m.c:fmtBot(m.c))+'</div>';
  }
  if(chatBusy)h+='<div class="msg bot"><div class="typing"><span></span><span></span><span></span></div></div>';
  h+='</div>';
  h+='<div style="margin-top:10px">'+
    '<span class="qchip" onclick="chatSend(\'Why was my answer wrong on the last problem?\')">Why was I wrong?</span>'+
    '<span class="qchip" onclick="chatSend(\'Show me a worked example of my weakest skill, then give me one to try.\')">Show me an example</span>'+
    '<span class="qchip" onclick="chatSend(\'Explain that again, but simpler.\')">Explain simpler</span>'+
    '<span class="qchip" onclick="chatSend(\'Quiz me: give me one problem on my weakest skill and wait for my answer.\')">Quiz me</span></div>';
  h+='<div class="chatbar"><input id="chatIn" placeholder="Ask anything… (e.g. how do logs work?)" autocomplete="off"><button class="btn" onclick="chatSend()">Send</button></div>';
  el("main").innerHTML=h;
  var log=el("chatLog");
  window.scrollTo(0,document.body.scrollHeight);
  var ci=el("chatIn");
  if(ci){ci.onkeydown=function(e){if(e.key==="Enter"){chatSend();}};}
}

/* ---------- init ---------- */
(function(){
  load();
  // One-tap tutor setup: open the file once with #key=sk-ant-... appended
  // (optionally &model=claude-...) and the key is stored in localStorage,
  // then scrubbed from the address bar. Never hardcode a key in this file —
  // it's committed to GitHub, where leaked keys get scraped and revoked.
  try{
    var frag=(location.hash||"")+"&"+(location.search||"");
    var km=frag.match(/[#&?]key=(sk-ant-[A-Za-z0-9_\-]+)/);
    if(km){
      S.chatKey=km[1];
      var mm=frag.match(/[#&?]model=(claude-[a-z0-9.\-]+)/);
      if(mm)S.chatModel=mm[1];
      save();
      try{history.replaceState(null,"",location.pathname);}catch(e2){location.hash="";}
      setTimeout(function(){toast("🔑 Tutor key installed — the AI tutor is live on this device");},400);
    }
  }catch(e){}
  var btns=document.querySelectorAll(".nbtn"),i;
  for(i=0;i<btns.length;i++){
    (function(b){b.onclick=function(){SFX.click();go(b.getAttribute("data-v"));};})(btns[i]);
  }
  document.addEventListener("keydown",function(e){
    if(e.key!=="Enter")return;
    if(e.target&&e.target.tagName==="TEXTAREA")return; // typing steps in the work pad
    if(e.target&&e.target.id==="chatIn")return;        // chat input has its own handler
    if(view==="train"&&sess){if(sess.locked)nextQ();else submitAns();}
    else if(view==="lab"&&lab&&!lab.finished){if(lab.fb)labNext();else labSubmit();}
    else if(view==="lesson"&&lessonCheck&&lessonCheck.qo&&!lessonCheck.done)lcSubmit();
  });
  go("home");
})();
</script>
