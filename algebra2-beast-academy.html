<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Algebra 2 Beast Academy</title>
<style>
:root{
  --bg:#0b1020; --bg2:#111832; --card:#161f3d; --card2:#1c2750; --line:#28345f;
  --txt:#e8ecff; --dim:#8b96c9; --gold:#ffb830; --orange:#ff7a2f; --red:#ff4d6a;
  --green:#3ddc84; --blue:#4d9fff; --purple:#a78bfa; --cyan:#2fd4d4; --pink:#ff6bcb;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100%}
body{padding-bottom:76px}
button{font-family:inherit;cursor:pointer;border:none}
input,select{font-family:inherit}
.wrap{max-width:860px;margin:0 auto;padding:12px}
/* top bar */
.top{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#0b1020 70%,rgba(11,16,32,.92));backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.topin{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 12px}
.logo{font-weight:900;font-size:16px;letter-spacing:.5px;background:linear-gradient(90deg,var(--gold),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.pill{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill .ic{font-size:13px}
.spacer{flex:1}
/* xp bar */
.xpbar{height:5px;background:var(--card);border-radius:99px;overflow:hidden;margin:0 12px 0}
.xpin{max-width:860px;margin:0 auto}
.xpbar>div{height:100%;background:linear-gradient(90deg,var(--gold),var(--orange));border-radius:99px;transition:width .5s}
/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:#0d1328;border-top:1px solid var(--line)}
.navin{max-width:860px;margin:0 auto;display:flex}
.nbtn{flex:1;background:none;color:var(--dim);padding:9px 2px 10px;font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
.nbtn .nic{font-size:20px;line-height:1}
.nbtn.on{color:var(--gold)}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;animation:fadeIn .3s}
.card.click{cursor:pointer;transition:transform .12s,border-color .12s}
.card.click:hover{transform:translateY(-2px);border-color:var(--gold)}
.card.click:active{transform:scale(.98)}
h2{font-size:17px;margin-bottom:8px}
h3{font-size:14px;margin-bottom:6px}
.sub{color:var(--dim);font-size:12.5px;line-height:1.5}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
/* buttons */
.btn{background:linear-gradient(90deg,var(--gold),var(--orange));color:#1a1200;font-weight:900;border-radius:12px;padding:12px 18px;font-size:14px;transition:transform .1s;box-shadow:0 4px 14px rgba(255,150,40,.25)}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn.grn{background:linear-gradient(90deg,#2bc76f,#3ddc84);color:#04250f}
.btn.red{background:linear-gradient(90deg,#e33f5c,#ff4d6a);color:#fff}
.btn.blu{background:linear-gradient(90deg,#3a7fe0,#4d9fff);color:#eaf3ff}
.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* progress bars */
.bar{height:9px;background:#0e1530;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar>div{height:100%;border-radius:99px;transition:width .6s}
.m0{background:#454f7c}.m1{background:var(--red)}.m2{background:var(--orange)}.m3{background:var(--gold)}.m4{background:var(--green)}.m5{background:linear-gradient(90deg,var(--cyan),var(--purple))}
.mtag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;white-space:nowrap}
.t0{background:#2a335e;color:#9aa5d6}.t1{background:#4a1626;color:#ff8ba0}.t2{background:#4a2c12;color:#ffb27a}.t3{background:#4a3a0e;color:#ffd97a}.t4{background:#0e3a22;color:#7dedae}.t5{background:#241b4a;color:#c9b8ff}
/* skill tree */
.unit{border-left:4px solid var(--gold)}
.chev{color:var(--dim);font-size:13px;transition:transform .2s}
.chev.open{transform:rotate(90deg)}
.skrow{display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid var(--line);cursor:pointer;border-radius:8px}
.skrow:hover{background:rgba(255,255,255,.03)}
.lock{opacity:.45}
/* training */
.qcard{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px;font-size:17px;line-height:1.65}
.qmeta{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ansin{width:100%;background:#0e1530;border:2px solid var(--line);color:var(--txt);border-radius:12px;padding:13px 14px;font-size:17px;outline:none}
.ansin:focus{border-color:var(--gold)}
.ansin.ok{border-color:var(--green)}
.ansin.bad{border-color:var(--red)}
.mcbtn{display:block;width:100%;text-align:left;background:#0e1530;border:2px solid var(--line);color:var(--txt);border-radius:12px;padding:13px 14px;font-size:15.5px;margin-bottom:8px;transition:border-color .12s}
.mcbtn:hover{border-color:var(--gold)}
.mcbtn.pick{border-color:var(--blue);background:#12204a}
.mcbtn.ok{border-color:var(--green);background:#0e2c1c}
.mcbtn.bad{border-color:var(--red);background:#33121c}
.fb{border-radius:14px;padding:14px;margin-bottom:12px;font-size:14px;line-height:1.6;animation:fadeIn .25s}
.fb.ok{background:#0e2c1c;border:1px solid #1f5c3a}
.fb.bad{background:#33121c;border:1px solid #6b2438}
.fb.hint{background:#12204a;border:1px solid #27408f}
.big{font-size:22px;font-weight:900}
.center{text-align:center}
sup{font-size:.68em}
.math{font-family:"Cambria Math",Georgia,serif}
.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 3px;line-height:1.15}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px}
.frac>span:last-child{padding:0 4px}
/* misc */
.chip{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:11.5px;font-weight:700;margin:2px 3px 2px 0;color:var(--dim)}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.badge .bic{font-size:26px;filter:grayscale(1);opacity:.35}
.badge.got .bic{filter:none;opacity:1}
.badge .bn{font-size:10.5px;font-weight:800}
.badge .bd{font-size:9.5px;color:var(--dim)}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat .sv{font-size:20px;font-weight:900}
.stat .sl{font-size:10.5px;color:var(--dim);font-weight:700;margin-top:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#1c2750;border:1px solid var(--gold);color:var(--txt);padding:11px 18px;border-radius:14px;font-weight:800;font-size:13.5px;z-index:99;animation:pop .3s;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center}
.timer{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.flame{animation:float 2s ease-in-out infinite;display:inline-block}
table.rt{width:100%;border-collapse:collapse;font-size:12.5px}
table.rt td,table.rt th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
table.rt th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.hero{background:linear-gradient(135deg,#1a1030,#131f45 60%,#0e2c3a);border:1px solid #34406f;border-radius:18px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;top:-40px;right:-40px;width:160px;height:160px;background:radial-gradient(circle,rgba(255,184,48,.18),transparent 70%)}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.8)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes glow{0%,100%{box-shadow:0 0 10px rgba(255,122,47,.35)}50%{box-shadow:0 0 26px rgba(255,122,47,.7)}}
.beastcard{border:1px solid #6b3a12;background:linear-gradient(135deg,#2a1408,#3a1c0a);animation:glow 2.4s infinite}
.hidden{display:none!important}
a{color:var(--blue)}
@media(max-width:480px){.logo{font-size:12.5px}.pill{padding:3px 8px;font-size:10.5px;gap:3px}.topin{gap:5px;padding:8px 8px}}
</style>
</head>
<body>

<div class="top">
  <div class="topin">
    <div class="logo">⚡ A2 BEAST ACADEMY</div>
    <div class="spacer"></div>
    <div class="pill" id="pillStreak"><span class="ic flame">🔥</span><span>0</span></div>
    <div class="pill" id="pillLvl"><span class="ic">🏅</span><span>Lv 1</span></div>
    <div class="pill" id="pillXp"><span class="ic">⭐</span><span>0 XP</span></div>
  </div>
  <div class="xpin"><div class="xpbar"><div id="xpFill" style="width:0%"></div></div></div>
</div>

<div class="wrap" id="main"></div>

<div class="nav"><div class="navin">
  <button class="nbtn" data-v="home"><span class="nic">🏠</span>Home</button>
  <button class="nbtn" data-v="tree"><span class="nic">🌳</span>Skills</button>
  <button class="nbtn" data-v="battle"><span class="nic">⚔️</span>Battle</button>
  <button class="nbtn" data-v="stats"><span class="nic">📊</span>Stats</button>
  <button class="nbtn" data-v="ref"><span class="nic">📚</span>Study</button>
</div></div>

<script>
/* ============================================================
   ALGEBRA 2 BEAST ACADEMY — single-file, no dependencies.
   Vanilla ES5 (var / function / .then per repo conventions).
   Progress persists in localStorage. Aligned to Missouri
   Learning Standards Algebra II (Branson Public Schools
   follows MLS; Algebra II EOC is the state assessment).
   ============================================================ */

/* ---------- utils ---------- */
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(a){var i,j,t;a=a.slice();for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function nz(n){return n===0?0:n;} // normalize -0
function sgn(n){return n<0?"−":"+";}
function abs(n){return Math.abs(n);}
function sup(s){return "<sup>"+s+"</sup>";}
function xN(p){return p===1?"x":(p===0?"":"x"+sup(p));}
// format a term like "+ 3x^2" with proper signs; first=true drops leading +
function term(c,pow,first){
  if(c===0)return "";
  var s=(c<0?"−":(first?"":"+"))+" ";
  if(first&&c>=0)s="";
  var a=Math.abs(c);
  var v=xN(pow);
  var body=(pow>0&&a===1)?v:(a+v);
  return (first?"":" ")+s.replace(/ $/,(first?"":" "))+body;
}
// build polynomial string from coeff array [c_n,...,c_0]
function polyStr(coefs){
  var deg=coefs.length-1,out="",first=true,i;
  for(i=0;i<coefs.length;i++){
    var c=coefs[i],p=deg-i;
    if(c===0)continue;
    var a=Math.abs(c),v=xN(p),body=(p>0&&a===1)?v:(a+v);
    if(first){out+=(c<0?"−":"")+body;first=false;}
    else{out+=" "+(c<0?"−":"+")+" "+body;}
  }
  return out===""?"0":out;
}
function frac(n,d){ // reduced fraction string
  var g=gcd(n,d);n/=g;d/=g;
  if(d<0){d=-d;n=-n;}
  if(d===1)return ""+n;
  return n+"/"+d;
}
function fracHtml(n,d){
  var s=frac(n,d);
  if(s.indexOf("/")<0)return s;
  var p=s.split("/");
  return '<span class="frac"><span>'+p[0]+'</span><span>'+p[1]+'</span></span>';
}
function plural(n,s){return n+" "+s+(n===1?"":"s");}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function todayKey(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function daysBetween(a,b){return Math.floor(Math.abs(b-a)/86400000);}

/* ---------- tiny sound engine ---------- */
var SFX=(function(){
  var ctx=null,on=true;
  function c(){if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){on=false;}}return ctx;}
  function tone(f,t,dur,type,vol){
    if(!on||!c())return;
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type||"sine";o.frequency.value=f;
    g.gain.setValueAtTime(vol||.12,ctx.currentTime+t);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+dur);
    o.connect(g);g.connect(ctx.destination);
    o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+dur+.02);
  }
  return {
    ok:function(){tone(523,0,.12);tone(659,.09,.12);tone(784,.18,.2);},
    bad:function(){tone(196,0,.2,"sawtooth",.07);tone(155,.14,.25,"sawtooth",.07);},
    level:function(){tone(523,0,.1);tone(659,.08,.1);tone(784,.16,.1);tone(1047,.24,.3);},
    badge:function(){tone(659,0,.1);tone(880,.09,.1);tone(1175,.18,.3);},
    click:function(){tone(880,0,.05,"square",.04);},
    tick:function(){tone(1200,0,.04,"square",.03);}
  };
})();

/* ---------- persistent state ---------- */
var SKEY="a2ba_v1";
var S=null;
function blankState(){
  return {
    xp:0, totalsAtt:0, totalsCor:0,
    streak:{count:0,last:""},
    badges:{},
    skills:{},           // id -> {m, att, cor, hist:[], last:ts, wrongRow:0}
    diagDone:false, diagDate:"", diagUnits:{},
    journal:[],          // mistakes {t, sk, q, ur, ans}
    tests:[],            // {date, pct, per:{unit:pct}}
    daily:{date:"", xp:0, goal:100, quests:{}},
    beastWins:0, blitzBest:0,
    sessionCorrectRow:0
  };
}
function load(){
  try{
    var raw=localStorage.getItem(SKEY);
    S=raw?JSON.parse(raw):blankState();
  }catch(e){S=blankState();}
  var b=blankState(),k;
  for(k in b){if(S[k]===undefined)S[k]=b[k];}
  applyDecay();
  touchStreak(false);
  rollDaily();
}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S));}catch(e){}}
function sk(id){
  if(!S.skills[id])S.skills[id]={m:0,att:0,cor:0,hist:[],last:0,wrongRow:0};
  return S.skills[id];
}
/* mastery slowly decays if a skill is neglected — retrieval practice matters */
function applyDecay(){
  var now=Date.now(),id;
  for(id in S.skills){
    var s=S.skills[id];
    if(s.last&&s.m>40){
      var d=daysBetween(s.last,now);
      if(d>7){
        var drop=Math.min(Math.floor((d-7)/3),Math.floor(s.m*.25));
        if(drop>0)s.m=Math.max(40,s.m-drop);
      }
    }
  }
}
function rollDaily(){
  var t=todayKey();
  if(S.daily.date!==t){
    S.daily={date:t,xp:0,goal:S.daily.goal||100,quests:{}};
    save();
  }
}
function touchStreak(earned){
  var t=todayKey();
  if(earned){
    if(S.streak.last===t)return;
    var y=new Date();y.setDate(y.getDate()-1);
    var yk=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
    S.streak.count=(S.streak.last===yk)?S.streak.count+1:1;
    S.streak.last=t;
    save();
  }else{
    if(S.streak.last&&S.streak.last!==t){
      var y2=new Date();y2.setDate(y2.getDate()-1);
      var yk2=y2.getFullYear()+"-"+(y2.getMonth()+1)+"-"+y2.getDate();
      if(S.streak.last!==yk2){S.streak.count=0;save();}
    }
  }
}

/* ---------- levels & XP ---------- */
var LVS=[
  {xp:0,name:"Rookie",ic:"🐣"},{xp:150,name:"Apprentice",ic:"📐"},{xp:400,name:"Solver",ic:"🧮"},
  {xp:800,name:"Strategist",ic:"🧠"},{xp:1400,name:"Warrior",ic:"⚔️"},{xp:2200,name:"Gladiator",ic:"🛡️"},
  {xp:3200,name:"Beast",ic:"🐲"},{xp:4600,name:"Elite Beast",ic:"👑"},{xp:6500,name:"Legend",ic:"🌟"},
  {xp:9000,name:"Math Immortal",ic:"♾️"}
];
function lvlInfo(){
  var i,cur=0;
  for(i=0;i<LVS.length;i++){if(S.xp>=LVS[i].xp)cur=i;}
  var next=LVS[cur+1]||null;
  var pct=next?Math.round(100*(S.xp-LVS[cur].xp)/(next.xp-LVS[cur].xp)):100;
  return {i:cur,def:LVS[cur],next:next,pct:pct};
}
function addXP(n){
  var before=lvlInfo().i;
  S.xp+=n;S.daily.xp+=n;
  var after=lvlInfo().i;
  save();paintTop();
  if(after>before){SFX.level();toast("🎉 LEVEL UP — "+LVS[after].ic+" "+LVS[after].name+"!");}
}

/* ---------- mastery engine ---------- */
function mTier(m){ if(m>=97)return 5; if(m>=90)return 4; if(m>=75)return 3; if(m>=60)return 2; if(m>=40)return 1; return 0; }
var TIER_NAMES=["Weak","Developing","Functional","Strong","Mastered","Elite"];
function tierTag(m,att){
  if(!att)return '<span class="mtag t0">NEW</span>';
  var t=mTier(m);
  return '<span class="mtag t'+t+'">'+TIER_NAMES[t].toUpperCase()+" "+Math.round(m)+"%</span>";
}
function recordAnswer(skillId,level,ok){
  var s=sk(skillId);
  s.att++;S.totalsAtt++;
  if(ok){
    s.cor++;S.totalsCor++;s.wrongRow=0;
    S.sessionCorrectRow++;
    var gain=(3+2.6*level)*(1-s.m/115);
    s.m=Math.min(100,s.m+gain);
    // consistency gate: real mastery needs a body of work
    if(s.att<6)s.m=Math.min(s.m,88);
    else if(s.att<10)s.m=Math.min(s.m,96);
  }else{
    s.wrongRow++;S.sessionCorrectRow=0;
    s.m=Math.max(0,s.m-(13-1.5*level));
  }
  s.hist.push({l:level,ok:ok?1:0,t:Date.now()});
  if(s.hist.length>25)s.hist.shift();
  s.last=Date.now();
  touchStreak(true);
  save();
}
function pickLevel(skillId){
  var s=sk(skillId),m=s.m;
  var L= m<40?1 : m<60?2 : m<75?3 : m<90?4 : 5;
  if(s.wrongRow>=2)L=Math.max(1,L-1);         // struggling → step down
  else if(S.sessionCorrectRow>=4&&L<5)L++;    // hot streak → push harder
  return L;
}
function unitMastery(uid){
  var u=unitById(uid),sum=0,n=0,i;
  for(i=0;i<u.skills.length;i++){var s=sk(u.skills[i].id);sum+=s.m;n++;}
  return n?sum/n:0;
}
function overallMastery(){
  var sum=0,i;
  for(i=0;i<UNITS.length;i++)sum+=unitMastery(UNITS[i].id);
  return sum/UNITS.length;
}
/* spaced review: interval grows with mastery tier */
function reviewDue(){
  var due=[],now=Date.now(),i,j;
  var iv=[1,2,4,7,14,21]; // days by tier
  for(i=0;i<UNITS.length;i++)for(j=0;j<UNITS[i].skills.length;j++){
    var d=UNITS[i].skills[j],s=S.skills[d.id];
    if(s&&s.att>0&&s.last&&daysBetween(s.last,now)>=iv[mTier(s.m)]){
      due.push(d);
    }
  }
  return due;
}
function weakSkills(n){
  var all=[],i,j;
  for(i=0;i<UNITS.length;i++)for(j=0;j<UNITS[i].skills.length;j++){
    var d=UNITS[i].skills[j],s=S.skills[d.id];
    if(s&&s.att>0)all.push({d:d,m:s.m});
  }
  all.sort(function(a,b){return a.m-b.m;});
  return all.slice(0,n||3);
}

/* ---------- curriculum: Missouri Learning Standards Algebra II ----------
   Branson Public Schools (Branson, MO) follows the Missouri Learning
   Standards; Algebra II is a Missouri EOC-assessed course. Units below map
   to the public MLS Algebra II strands. */
var UNITS=[
 {id:"lin",name:"Linear & Absolute Value",ic:"📏",mls:"A2.REI.A.1 · A2.IF.A",

/* ============================================================
   QUESTION GENERATORS — every skill has a generator taking a
   difficulty level L (1–5) and returning a fresh, checked
   question. Answers are constructed backwards from chosen
   solutions so they are always exact.
   ============================================================ */
var GEN={};
function mc(correct,distractors){
  var opts=[correct],i;
  for(i=0;i<distractors.length&&opts.length<4;i++){
    if(opts.indexOf(distractors[i])<0)opts.push(distractors[i]);
  }
  return {choices:shuffle(opts),ans:correct};
}
function nzr(a,b){var n=0;while(n===0)n=ri(a,b);return n;} // nonzero random
function q(html,type,ans,extra){
  var o={html:html,type:type,ans:String(ans)};
  var k;for(k in (extra||{}))o[k]=extra[k];
  return o;
}
function cpx(a,b){ // complex "a+bi" canonical + accepted variants
  var s,alt=[];
  if(b===0)return {s:String(a),alt:[]};
  var bi=(b===1?"i":(b===-1?"-i":b+"i"));
  if(a===0){s=bi;}
  else{s=a+(b>0?"+":"")+bi;alt.push(bi+(a>0?"+":"")+a);}
  return {s:s,alt:alt};
}

GEN.lin1=function(L){

      {hint:"Undo the +"+b+" first, then divide by "+a+".",
       expl:"Subtract "+b+" from both sides: "+a+"x = "+(c-b)+". Divide by "+a+": x = "+x+"."});
  }
  if(L===2){x=ri(-8,8);a=nzr(2,8);c=nzr(-6,6);while(c===a)c=nzr(-6,6);b=ri(-9,9);d=a*x+b-c*x;
    return q("Solve for x:<br><span class='math big'>"+polyStr([a,b])+" = "+polyStr([c,d])+"</span>","num",x,
      {hint:"Move all x-terms to one side, constants to the other.",
       expl:"Subtract "+c+"x from both sides: "+(a-c)+"x "+(b<0?"− "+(-b):"+ "+b)+" = "+d+", so "+(a-c)+"x = "+(d-b)+", giving x = "+x+"."});
  }
  if(L===3){x=ri(-7,7);a=nzr(2,5);b=ri(-6,6);c=ri(-9,9);d=a*(x+b)+c;
    return q("Solve for x:<br><span class='math big'>"+a+"(x "+(b<0?"− "+(-b):"+ "+b)+") "+(c<0?"− "+(-c):"+ "+c)+" = "+d+"</span>","num",x,
      {hint:"Distribute the "+a+" first.",
       expl:"Distribute: "+a+"x + "+(a*b)+" + "+c+" = "+d+" → "+a+"x = "+(d-a*b-c)+" → x = "+x+"."});
  }
  if(L===4){x=ri(-6,6);a=nzr(2,5);c=ri(2,6);d=ri(-5,5);b=c*d-a*x;
    return q("Solve for x:<br><span class='math big'><span class='frac'><span>"+polyStr([a,b])+"</span><span>"+c+"</span></span> = "+d+"</span>","num",x,
      {hint:"Multiply both sides by "+c+" first.",

};

 lin1:"Undo operations in reverse order: clear parentheses (distribute), collect like terms, move variable terms to one side and constants to the other, then divide. <b>Example:</b> 3(x−2)+4 = 13 → 3x−6+4 = 13 → 3x = 15 → x = 5. Always check by substituting back.",

 fun2:"Domain = allowed inputs; range = possible outputs. Two classic restrictions: denominators can't be 0, and even-root insides must be ≥ 0. For ranges, think about the graph: a parabola opening up from vertex (h,k) has range y ≥ k.",

 fun4:"An inverse UNDOES a function: f⁻¹(f(x)) = x. To find it, swap x and y, then solve for y. f⁻¹ is NOT 1/f! Graphically the inverse reflects over y = x. <b>Example:</b> f(x)=3x−6 → x=3y−6 → f⁻¹(x)=(x+6)/3.",

 fun6:"A piecewise function uses different rules on different x-intervals. To evaluate: FIRST find which interval the input belongs to, THEN apply only that rule. Boundary inputs go to the piece whose inequality includes equality.",
 sys1:"Two equations, two unknowns. Elimination: scale equations so one variable's coefficients are opposites, then add. Substitution: solve one equation for a variable, substitute into the other. The solution is where the lines intersect.",

 cplx1:"i = √(−1), so i² = −1. Powers cycle every 4: i, −1, −i, 1. For iⁿ, use n mod 4. <b>Example:</b> i²³: 23 mod 4 = 3 → i³ = −i.",

function normTxt(s){
  return String(s).toLowerCase()
    .replace(/−|–|—/g,"-")
    .replace(/\s+/g,"")
    .replace(/×/g,"*")
    .replace(/^x=|^y=|^t=|^n=|^k=|^c=/,"")
    .replace(/\.$/,"");
}
function parseNum(s){
  s=normTxt(s);
  if(s==="")return null;
  var m=s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if(m){var d=parseFloat(m[2]);if(d===0)return null;return parseFloat(m[1])/d;}
  if(/^-?\d*\.?\d+$/.test(s))return parseFloat(s);
  return null;
}
function numEq(u,a){
  var pu=parseNum(u),pa=parseNum(a);
  if(pu===null||pa===null)return false;
  return Math.abs(pu-pa)<=1e-6*Math.max(1,Math.abs(pa));
}
function elemEq(u,a){ // one element: numeric if possible, else text (handles 2+3i)
  if(numEq(u,a))return true;
  return normTxt(u)===normTxt(a);
}
function splitList(s){
  s=String(s).replace(/−/g,"-").replace(/\bor\b|\band\b|;/gi,",");
  s=s.replace(/[()\[\]{}]/g,"");
  // expand "±5" into "5,-5"
  if(s.indexOf("±")>=0){
    var core=s.replace(/±/g,"").replace(/\s+/g,"");
    return [core,"-"+core.replace(/^-/,"")];
  }
  var parts=s.split(","),out=[],i;
  for(i=0;i<parts.length;i++){if(normTxt(parts[i])!=="")out.push(parts[i]);}
  return out;
}
function checkAnswer(qo,input){
  var i,j;
  if(qo.type==="num"){
    if(numEq(input,qo.ans))return true;
    if(qo.alt){for(i=0;i<qo.alt.length;i++)if(elemEq(input,qo.alt[i]))return true;}
    return elemEq(input,qo.ans);
  }
  if(qo.type==="text"){
    if(elemEq(input,qo.ans))return true;
    if(qo.alt){for(i=0;i<qo.alt.length;i++)if(elemEq(input,qo.alt[i]))return true;}
    return false;
  }
  if(qo.type==="set"){
    var want=splitList(qo.ans),got=splitList(input);
    if(want.length!==got.length)return false;
    var used=[];
    for(i=0;i<want.length;i++){
      var found=false;
      for(j=0;j<got.length;j++){
        if(used.indexOf(j)>=0)continue;
        if(elemEq(got[j],want[i])){used.push(j);found=true;break;}
      }
      if(!found)return false;
    }
    return true;
  }
  if(qo.type==="pair"||qo.type==="tuple"){
    var w2=splitList(qo.ans),g2=splitList(input);
    if(w2.length!==g2.length)return false;
    for(i=0;i<w2.length;i++)if(!elemEq(g2[i],w2[i]))return false;
    return true;
  }
  return false;
}

/* ============================================================
   SESSION CONTROLLER (practice / quiz / review / diag / mock /
   beast / blitz all run through one training loop)
   ============================================================ */
var sess=null;
function unlockBeast(){
  var n=0,i;
  for(i=0;i<UNITS.length;i++)if(unitMastery(UNITS[i].id)>=60)n++;
  return n>=3;
}
function startPractice(skillId){
  sess={mode:"practice",skillId:skillId,idx:0,cor:0,wrong:0,results:[],hintUsed:false};
  nextQ();
}
function startQuiz(unitId){
  var u=unitById(unitId),items=[],i;
  var pool=shuffle(u.skills);
  for(i=0;i<8;i++)items.push(pool[i%pool.length].id);
  sess={mode:"quiz",unitId:unitId,items:items,idx:0,cor:0,wrong:0,results:[],hintUsed:false};
  nextQ();
}
function startReview(){
  var due=shuffle(reviewDue()).slice(0,8);
  if(!due.length){toast("✅ Nothing due for review — go learn something new!");return;}
  sess={mode:"review",items:due.map(function(d){return d.id;}),idx:0,cor:0,wrong:0,results:[],hintUsed:false};
  nextQ();
}
function startDiag(){
  sess={mode:"diag",idx:0,cor:0,wrong:0,results:[],hintUsed:false};
  nextQ();
}
function startMock(){
  var items=[],i,j;
  var us=shuffle(UNITS.slice());
  for(i=0;i<us.length;i++){
    var ss=shuffle(us[i].skills.slice());
    for(j=0;j<2&&j<ss.length;j++)items.push(ss[j].id);
  }
  items=shuffle(items).slice(0,20);
  sess={mode:"mock",items:items,idx:0,cor:0,wrong:0,results:[],hintUsed:false};
  nextQ();
}
function startBeast(){
  if(!unlockBeast()){toast("🔒 Beast Mode unlocks when 3 units reach 60%+ mastery. Keep training!");return;}
  sess={mode:"beast",idx:0,cor:0,wrong:0,results:[],hintUsed:false};
  nextQ();
}
function startBlitz(){
  sess={mode:"blitz",idx:0,cor:0,wrong:0,results:[],hintUsed:false,timeLeft:60};
  var mySess=sess;
  mySess.timerId=setInterval(function(){
    if(sess!==mySess){clearInterval(mySess.timerId);return;}
    sess.timeLeft--;
    var t=document.getElementById("blitzT");
    if(t)t.textContent=sess.timeLeft+"s";
    if(sess.timeLeft<=5&&sess.timeLeft>0)SFX.tick();
    if(sess.timeLeft<=0)endSess();
  },1000);
  nextQ();
}
function sessionSkill(){
  if(sess.mode==="practice")return sess.skillId;
  if(sess.mode==="diag")return DIAG_SPEC[sess.idx].sk;
  if(sess.mode==="beast")return sess.qo&&sess.qo.sk?sess.qo.sk:"quad6";
  if(sess.mode==="blitz")return sess.blitzSk;
  return sess.items[sess.idx];
}
function makeQ(){
  var skid,L;
  if(sess.mode==="diag"){
    var spec=DIAG_SPEC[sess.idx];
    return {sk:spec.sk,L:spec.L,qo:GEN[spec.sk](spec.L)};
  }
  if(sess.mode==="beast"){
    var qo=pick(BEAST)();
    return {sk:qo.sk||"quad6",L:5,qo:qo};
  }
  if(sess.mode==="blitz"){
    var all=[],i,jx;
    for(i=0;i<UNITS.length;i++)for(jx=0;jx<UNITS[i].skills.length;jx++)all.push(UNITS[i].skills[jx].id);
    skid=pick(all);sess.blitzSk=skid;
    return {sk:skid,L:ri(1,2),qo:GEN[skid](ri(1,2))};
  }
  skid=sess.mode==="practice"?sess.skillId:sess.items[sess.idx];
  L=pickLevel(skid);
  if(sess.mode==="mock")L=Math.max(2,Math.min(4,L));
  return {sk:skid,L:L,qo:GEN[skid](L)};
}
function sessLen(){
  if(sess.mode==="diag")return DIAG_SPEC.length;
  if(sess.mode==="quiz"||sess.mode==="review"||sess.mode==="mock")return sess.items.length;
  return 0; // endless
}
function nextQ(){
  var total=sessLen();
  if(total&&sess.idx>=total){endSess();return;}
  var made=makeQ();
  sess.cur=made;sess.qo=made.qo;sess.locked=false;sess.mcPick=-1;sess.hintUsed=false;
  renderTrain();
}
function submitAns(){
  if(!sess||sess.locked)return;
  var qo=sess.qo,input;
  if(qo.type==="mc"){
    if(sess.mcPick<0){toast("Pick an answer first!");return;}
    input=qo.choices[sess.mcPick];
  }else{
    var box=document.getElementById("ansBox");
    input=box?box.value:"";
    if(normTxt(input)===""){toast("Type an answer first!");return;}
  }
  var ok=checkAnswer(qo,input);
  sess.locked=true;sess.lastOk=ok;sess.lastInput=input;
  var skid=sess.cur.sk,L=sess.cur.L;
  var deferred=(sess.mode==="diag"||sess.mode==="mock");
  if(sess.mode!=="diag"){recordAnswer(skid,L,ok);}
  if(ok){sess.cor++;}else{sess.wrong++;if(!deferred)logMistake(skid,qo,input);}
  sess.results.push({sk:skid,L:L,ok:ok,q:qo,input:input});
  questTick(ok);
  if(ok){
    if(sess.mode==="beast"){S.beastWins++;save();addXP(60);}
    else if(sess.mode==="blitz"){addXP(6);}
    else if(sess.mode==="diag"){addXP(5);}
    else addXP(10*L+(sess.hintUsed?-3:0));
  }else{addXP(2);}
  if(!deferred){SFX[ok?"ok":"bad"]();}
  else{SFX.click();}
  checkBadges();
  sess.idx++;
  if(deferred){nextQ();return;}
  if(sess.mode==="blitz"){nextQ();return;}
  renderTrain(); // show feedback + next button
}
function pickMC(i){
  if(!sess||sess.locked)return;
  sess.mcPick=i;SFX.click();
  var btns=document.querySelectorAll(".mcbtn"),j;
  for(j=0;j<btns.length;j++)btns[j].className="mcbtn"+(j===i?" pick":"");
}
function showHint(){
  if(!sess||sess.locked)return;
  sess.hintUsed=true;
  var h=document.getElementById("hintBox");
  if(h){h.classList.remove("hidden");}
}
function endSess(){
  if(!sess)return;
  if(sess.timerId)clearInterval(sess.timerId);
  var m=sess.mode,res=sess.results;
  if(m==="diag"&&res.length>=DIAG_SPEC.length){
    // seed mastery from diagnostic
    var byUnit={},i;
    for(i=0;i<res.length;i++){
      var ud=skillDef(res[i].sk).unit;
      if(!byUnit[ud])byUnit[ud]={c:0,n:0};
      byUnit[ud].n++;if(res[i].ok)byUnit[ud].c++;
    }
    var uid;
    for(uid in byUnit){
      var seed=byUnit[uid].c===byUnit[uid].n?76:(byUnit[uid].c>0?54:26);
      var u=unitById(uid),j2;
      for(j2=0;j2<u.skills.length;j2++){
        var st=sk(u.skills[j2].id);
        if(st.att===0||st.m<seed){st.m=seed;}
      }
      S.diagUnits[uid]=Math.round(100*byUnit[uid].c/byUnit[uid].n);
    }
    // direct hits adjust their own skill
    for(i=0;i<res.length;i++){
      var st2=sk(res[i].sk);
      st2.att++;if(res[i].ok){st2.cor++;st2.m=Math.min(88,st2.m+8);}else{st2.m=Math.max(10,st2.m-10);st2.hist.push({l:res[i].L,ok:0,t:Date.now()});}
      st2.last=Date.now();
    }
    S.diagDone=true;S.diagDate=todayKey();
    addXP(50);save();checkBadges();
  }
  if(m==="mock"&&res.length>0){
    var per={},k;
    for(k=0;k<res.length;k++){
      var uu=skillDef(res[k].sk).unit;
      if(!per[uu])per[uu]={c:0,n:0};
      per[uu].n++;if(res[k].ok)per[uu].c++;
    }
    var perPct={},kk;
    for(kk in per)perPct[kk]=Math.round(100*per[kk].c/per[kk].n);
    var pct=Math.round(100*sess.cor/res.length);
    S.tests.push({date:todayKey(),pct:pct,per:perPct});
    addXP(40+pct);save();checkBadges();
    // log mock mistakes now
    for(k=0;k<res.length;k++)if(!res[k].ok)logMistake(res[k].sk,res[k].q,res[k].input);
  }
  if(m==="blitz"){
    if(sess.cor>S.blitzBest){S.blitzBest=sess.cor;save();}
    checkBadges();
  }
  sess.done=true;
  renderSummary();
}
function quitSess(){
  if(sess&&sess.timerId)clearInterval(sess.timerId);
  sess=null;
  go(view==="train"?"home":view);
}

function recommend(){
  if(!S.diagDone)return {label:"🔬 Take the Diagnostic",act:"startDiag()",why:"Map your strengths first — then training gets personal."};
  var due=reviewDue();

  var w=weakSkills(1);
  if(w.length&&w[0].m<75){
    var d=skillDef(w[0].d.id);
    return {label:"🎯 Train: "+d.name,act:"startPractice('"+d.id+"')",why:"Your weakest skill right now ("+Math.round(w[0].m)+"%). Attack weaknesses first."};
  }
  if(unlockBeast())return {label:"🐲 Beast Mode",act:"startBeast()",why:"You're strong — time for non-routine problems."};
  var u=UNITS[ri(0,UNITS.length-1)];
  return {label:"📚 Quiz: "+u.name,act:"startQuiz('"+u.id+"')",why:"Mixed practice across a unit."};
}

function renderBattle(){

  h+='<div class="card '+(unlockBeast()?'beastcard':'')+'"><div class="row"><div style="font-size:28px">'+(unlockBeast()?'🐲':'🔒')+'</div><div class="grow"><h3>Beast Mode</h3><div class="sub">Multi-topic, non-routine problems: Vieta\'s formulas, error analysis, extraneous traps, optimization. '+(unlockBeast()?'Slain: '+S.beastWins:'Unlocks at 3 units ≥ 60% mastery.')+'</div></div></div>'+(unlockBeast()?'<button class="btn wide red" style="margin-top:10px" onclick="startBeast()">Enter the Arena (+60 XP per kill)</button>':'')+'</div>';
  h+='<div class="card"><div class="row"><div style="font-size:28px">⚡</div><div class="grow"><h3>Blitz — 60 seconds</h3><div class="sub">Rapid-fire fundamentals. Speed + accuracy = fluency. Personal best: <b>'+S.blitzBest+'</b></div></div></div><button class="btn wide blu" style="margin-top:10px" onclick="startBlitz()">Start Blitz</button></div>';
  var lastT=S.tests.length?S.tests[S.tests.length-1]:null;
  h+='<div class="card"><div class="row"><div style="font-size:28px">📝</div><div class="grow"><h3>Mock EOC Exam</h3><div class="sub">20 mixed questions, no feedback until the end — just like test day. '+(lastT?'Last score: <b>'+lastT.pct+'%</b> ('+lastT.date+')':'Missouri gives an Algebra II EOC — train for it.')+'</div></div></div><button class="btn wide grn" style="margin-top:10px" onclick="startMock()">Take a Mock Exam</button></div>';
  h+='<div class="card"><div class="row"><div style="font-size:28px">🔬</div><div class="grow"><h3>Diagnostic</h3><div class="sub">'+(S.diagDone?'Last taken '+S.diagDate+'. Re-take anytime to re-map your levels.':DIAG_SPEC.length+' questions across all 11 domains. Builds your personal training path.')+'</div></div></div><button class="btn wide sec" style="margin-top:10px" onclick="startDiag()">'+(S.diagDone?'Re-take Diagnostic':'Start Diagnostic')+'</button></div>';
  el("main").innerHTML=h;
}

/* ---------- STATS ---------- */
function renderStats(){
  var li=lvlInfo(),om=Math.round(overallMastery());
  var acc=S.totalsAtt?Math.round(100*S.totalsCor/S.totalsAtt):0;
  var h='<div class="card" style="background:none;border:none;padding:0"><h2>📊 War Room</h2></div>';
  h+='<div class="grid3">'+
    '<div class="stat"><div class="sv">'+om+'%</div><div class="sl">OVERALL MASTERY</div></div>'+
    '<div class="stat"><div class="sv">'+S.totalsAtt+'</div><div class="sl">QUESTIONS</div></div>'+
    '<div class="stat"><div class="sv">'+acc+'%</div><div class="sl">ACCURACY</div></div>'+
    '<div class="stat"><div class="sv">'+S.xp+'</div><div class="sl">TOTAL XP</div></div>'+
    '<div class="stat"><div class="sv">🔥'+S.streak.count+'</div><div class="sl">DAY STREAK</div></div>'+
    '<div class="stat"><div class="sv">'+S.beastWins+'</div><div class="sl">BEASTS SLAIN</div></div></div>';
  // unit bars
  h+='<div class="card" style="margin-top:12px"><h3>Domain Mastery</h3>';
  var i,j;
  for(i=0;i<UNITS.length;i++){
    var u=UNITS[i],um=Math.round(unitMastery(u.id));
    var anyAtt=false;for(j=0;j<u.skills.length;j++)if(sk(u.skills[j].id).att>0)anyAtt=true;
    h+='<div class="row" style="padding:5px 0"><div style="width:26px">'+u.ic+'</div><div class="grow"><div style="font-size:12.5px;font-weight:700">'+u.name+'</div>'+mbar(um,anyAtt?1:0)+'</div><div style="width:40px;text-align:right;font-weight:800;font-size:12.5px">'+(anyAtt?um+'%':'—')+'</div></div>';
  }
  h+='</div>';
  // badges
  h+='<div class="card"><h3>🏅 Badges</h3><div class="grid3" style="grid-template-columns:repeat(auto-fill,minmax(96px,1fr))">';
  for(i=0;i<BADGES.length;i++){
    var b=BADGES[i],got=!!S.badges[b.id];
    h+='<div class="badge'+(got?' got':'')+'"><div class="bic">'+b.ic+'</div><div class="bn">'+b.n+'</div><div class="bd">'+b.d+'</div></div>';
  }
  h+='</div></div>';
  // test history
  if(S.tests.length){
    h+='<div class="card"><h3>📝 Mock Exam History</h3><table class="rt"><tr><th>Date</th><th>Score</th><th>Weakest area</th></tr>';
    for(i=S.tests.length-1;i>=0&&i>=S.tests.length-6;i--){
      var t=S.tests[i],worst=null,wv=101,k;
      for(k in t.per)if(t.per[k]<wv){wv=t.per[k];worst=k;}
      h+='<tr><td>'+t.date+'</td><td><b>'+t.pct+'%</b></td><td>'+(worst?unitById(worst).name+' ('+wv+'%)':'—')+'</td></tr>';
    }
    h+='</table></div>';
  }
  // mistake journal
  h+='<div class="card"><h3>📓 Mistake Journal</h3><div class="sub" style="margin-bottom:8px">Your most recent misses — mistakes are training data.</div>';
  if(!S.journal.length)h+='<div class="sub">No mistakes logged yet. Go make some — that\'s how you grow. 😄</div>';
  for(i=0;i<S.journal.length&&i<8;i++){
    var m=S.journal[i],dj=skillDef(m.sk);
    h+='<div style="border-top:1px solid var(--line);padding:8px 0"><div class="sub" style="font-size:11px">'+(dj?unitById(dj.unit).ic+' '+dj.name:m.sk)+'</div><div style="font-size:13px;margin:4px 0">'+m.q+'</div><div class="sub">You said: <span style="color:var(--red)">'+esc(m.ur)+'</span> · Correct: <span style="color:var(--green)">'+esc(m.ans)+'</span> <span style="cursor:pointer;color:var(--blue)" onclick="startPractice(\''+m.sk+'\')">Drill this →</span></div></div>';
  }
  h+='</div>';
  h+='<div class="card"><h3>⚠️ Danger Zone</h3><button class="btn sec sm" onclick="resetAll()">Reset ALL progress</button></div>';
  el("main").innerHTML=h;
}
function resetAll(){
  if(!confirm("Wipe all XP, mastery, badges and history? This cannot be undone."))return;
  S=blankState();save();paintTop();go("home");toast("Fresh start. Let's build it back stronger. 💪");
}

/* ---------- REFERENCE / CURRICULUM ---------- */

  var h='<div class="card" style="background:none;border:none;padding:0"><h2>📚 Study Center</h2><div class="sub">Formula vault + the official curriculum map.</div></div>';
  var i,j;
  for(i=0;i<REFS.length;i++){
    var u=unitById(REFS[i].u);
    h+='<div class="card"><h3>'+u.ic+' '+u.name+'</h3><ul style="padding-left:18px;font-size:13.5px;line-height:1.9">';
    for(j=0;j<REFS[i].items.length;j++)h+='<li>'+REFS[i].items[j]+'</li>';
    h+='</ul></div>';
  }
  h+='<div class="card"><h3>🗺️ Missouri / Branson Curriculum Map</h3><div class="sub" style="margin-bottom:8px">Branson Public Schools follows the <b>Missouri Learning Standards</b>, and Algebra II is a Missouri End-of-Course (EOC) assessed subject. This academy\'s units map to the public MLS Algebra II strands:</div><table class="rt"><tr><th>MLS Strand</th><th>What it covers</th><th>Academy units</th></tr>'+
   '<tr><td>A2.NQ</td><td>Number &amp; Quantity: radicals, rational exponents, extraneous solutions, complex numbers, Fundamental Theorem of Algebra</td><td>🌱 Radicals · 🌀 Complex</td></tr>'+
   '<tr><td>A2.SSE</td><td>Structure in Expressions: logarithms from exponent properties, log equations, log scales</td><td>🚀 Exp &amp; Logs · 🎯 Quadratics</td></tr>'+
   '<tr><td>A2.REI</td><td>Equations &amp; Inequalities: absolute value, rational/radical equations, systems (incl. nonlinear)</td><td>📏 Linear · ⚖️ Systems · ➗ Rational</td></tr>'+
   '<tr><td>A2.APR</td><td>Polynomials &amp; Rational Expressions: factoring, Remainder Theorem, zeros, rational arithmetic</td><td>📈 Polynomials · ➗ Rational</td></tr>'+
   '<tr><td>A2.IF</td><td>Interpreting Functions: key features from graphs, tables, symbols</td><td>🧩 Functions · 🪜 Sequences</td></tr>'+
   '<tr><td>A2.BF</td><td>Building Functions: transformations, inverses, composition</td><td>🧩 Functions · 🚀 Exp &amp; Logs</td></tr>'+
   '<tr><td>A2.FM</td><td>Function Modeling: quadratic &amp; exponential applications</td><td>🎯 Quadratics · 🚀 Exp &amp; Logs</td></tr>'+
   '<tr><td>A2.DS</td><td>Data &amp; Statistics: inference, normal distribution, probability</td><td>🎲 Prob &amp; Stats</td></tr>'+
  '</table><div class="sub" style="margin-top:8px">Sources: Missouri DESE <i>MLS Expanded Expectations — Algebra II</i> and <i>Algebra II Assessment Item Specifications</i> (dese.mo.gov); Branson Public Schools EOC information (branson.k12.mo.us). This app uses only public curriculum information — no private teacher materials.</div></div>';
  h+='<div class="card"><h3>🎓 How the Academy trains you</h3><div class="sub" style="line-height:1.8">'+
    '<b>Diagnose</b> → find what you know. <b>Drill</b> → adaptive difficulty attacks weaknesses, skips what you\'ve mastered. '+
    '<b>Retrieve</b> → spaced review resurfaces skills before they fade (mastery decays if neglected!). '+
    '<b>Mix</b> → Beast Mode forces multiple concepts into one problem so you can\'t pattern-match. '+
    '<b>Test</b> → mock EOC exams measure readiness. The goal isn\'t an A — it\'s being able to solve problems you\'ve never seen.</div></div>';
  el("main").innerHTML=h;
}

/* ---------- TRAINING VIEW ---------- */
function modeTitle(){
  return {practice:"🥊 Practice",quiz:"📚 Unit Quiz",review:"🔁 Spaced Review",diag:"🔬 Diagnostic",mock:"📝 Mock Exam",beast:"🐲 BEAST MODE",blitz:"⚡ Blitz"}[sess.mode]||"Training";
}
function renderTrain(){
  view="train";
  var qo=sess.qo,total=sessLen();
  var d=skillDef(sess.cur.sk),u=d?unitById(d.unit):null;
  var h='<div class="row" style="margin-bottom:10px"><div class="grow"><h2>'+modeTitle()+'</h2></div>';
  if(sess.mode==="blitz")h+='<div class="timer" id="blitzT">'+sess.timeLeft+'s</div>';
  else if(total)h+='<div class="pill">'+Math.min(sess.idx+(sess.locked?0:1),total)+' / '+total+'</div>';
  else h+='<div class="pill">✅ '+sess.cor+' · ❌ '+sess.wrong+'</div>';
  h+='<button class="btn sec sm" style="margin-left:8px" onclick="'+(total&&sess.mode!=="practice"?"quitConfirm()":"endSess()")+'">'+(sess.mode==="practice"?"Finish":"Quit")+'</button></div>';
  h+='<div class="qcard"><div class="qmeta">';
  if(u)h+='<span class="chip">'+u.ic+' '+d.name+'</span>';
  h+='<span class="chip">Level '+sess.cur.L+' — '+["","Foundation","Fluency","Advanced","Beast","Elite"][sess.cur.L]+'</span>';
  h+='</div>'+qo.html+'</div>';
  if(!sess.locked){
    if(qo.type==="mc"){
      var i;
      for(i=0;i<qo.choices.length;i++)h+='<button class="mcbtn" onclick="pickMC('+i+')">'+String.fromCharCode(65+i)+'.  '+qo.choices[i]+'</button>';
    }else{
      h+='<input id="ansBox" class="ansin" autocomplete="off" autocapitalize="off" placeholder="Your answer…">';
    }
    if(qo.hint&&sess.mode!=="diag"&&sess.mode!=="mock")h+='<div id="hintBox" class="fb hint hidden">💡 '+qo.hint+'</div>';
    h+='<div class="row" style="margin-top:12px">';
    if(qo.hint&&sess.mode!=="diag"&&sess.mode!=="mock")h+='<button class="btn sec" onclick="showHint()">💡 Hint</button>';
    h+='<button class="btn grow" onclick="submitAns()">Submit</button></div>';
  }else{
    // feedback state
    if(qo.type==="mc"){
      var j;
      for(j=0;j<qo.choices.length;j++){
        var cls=qo.choices[j]===qo.ans?"ok":(j===sess.mcPick&&!sess.lastOk?"bad":"");
        h+='<button class="mcbtn '+cls+'">'+String.fromCharCode(65+j)+'.  '+qo.choices[j]+'</button>';
      }
    }else{
      h+='<input class="ansin '+(sess.lastOk?"ok":"bad")+'" value="'+esc(sess.lastInput)+'" disabled>';
    }
    h+='<div class="fb '+(sess.lastOk?"ok":"bad")+'" style="margin-top:12px"><b>'+(sess.lastOk?pick(["✅ Crushed it!","✅ Correct!","✅ Beast move!","✅ Clean."]):"❌ Not this time.")+'</b>';
    if(!sess.lastOk&&qo.type!=="mc")h+='<div style="margin-top:4px">Correct answer: <b>'+esc(qo.ans)+'</b></div>';
    h+='<div style="margin-top:6px">'+(qo.expl||"")+'</div></div>';
    h+='<button class="btn wide" onclick="nextQ()">Next →</button>';
  }
  el("main").innerHTML=h;
  var box=el("ansBox");
  if(box)box.focus();
  window.scrollTo(0,0);
}
function quitConfirm(){
  if(confirm("Quit this session? Progress on answered questions is kept."))
    {if(sess.results.length&&(sess.mode==="mock"||sess.mode==="diag")){quitSessDiscard();}else{endSess();}}
}
function quitSessDiscard(){
  if(sess&&sess.timerId)clearInterval(sess.timerId);
  sess=null;go("home");
}

/* ---------- SUMMARY ---------- */
function renderSummary(){
  var m=sess.mode,n=sess.results.length,pct=n?Math.round(100*sess.cor/n):0;
  var h='<div class="card center hero"><div style="font-size:40px">'+(pct>=90?"🏆":pct>=70?"🎉":pct>=50?"💪":"🧗")+'</div>';
  h+='<div class="big" style="margin:6px 0">'+(m==="blitz"?sess.cor+" correct in 60s":pct+"%")+'</div>';
  h+='<div class="sub">'+sess.cor+' / '+n+' correct · '+modeTitle()+'</div></div>';
  if(m==="diag"){
    h+='<div class="card"><h3>🧭 Your Personal Training Path</h3><div class="sub" style="margin-bottom:8px">Weakest domains first — attack in this order:</div>';
    var order=UNITS.slice().sort(function(a,b){return (S.diagUnits[a.id]||0)-(S.diagUnits[b.id]||0);}),i;
    for(i=0;i<order.length;i++){
      var uv=S.diagUnits[order[i].id];
      if(uv===undefined)continue;
      h+='<div class="row" style="padding:5px 0"><div style="width:24px;font-weight:900;color:var(--dim)">'+(i+1)+'</div><div style="width:26px">'+order[i].ic+'</div><div class="grow" style="font-size:13px;font-weight:700">'+order[i].name+'</div>'+
        '<span class="mtag t'+(uv>=75?4:uv>=50?3:uv>=25?2:1)+'">'+uv+'%</span></div>';
    }
    h+='<div class="sub" style="margin-top:8px">Your skill tree has been seeded with these results. The "Next up" card on Home will always point at your best move.</div></div>';
  }
  if(m==="mock"){
    var t=S.tests[S.tests.length-1],k;
    h+='<div class="card"><h3>📊 Breakdown by Domain</h3>';
    for(k in t.per){
      var uu=unitById(k);
      h+='<div class="row" style="padding:5px 0"><div style="width:26px">'+uu.ic+'</div><div class="grow"><div style="font-size:12.5px;font-weight:700">'+uu.name+'</div>'+mbar(t.per[k],1)+'</div><div style="width:44px;text-align:right;font-weight:800">'+t.per[k]+'%</div></div>';
    }
    h+='<div class="sub" style="margin-top:8px">'+(pct>=90?"EOC-ready. Time for Beast Mode.":pct>=70?"Solid — drill the weak domains above and re-test.":"The plan: hit your two weakest domains this week, then re-test.")+'</div></div>';
  }
  // missed questions recap (not for blitz)
  if(m!=="blitz"&&sess.wrong>0){
    h+='<div class="card"><h3>❌ What you missed</h3>';
    var j,shown=0;
    for(j=0;j<sess.results.length&&shown<6;j++){
      var r=sess.results[j];
      if(r.ok)continue;shown++;
      h+='<div style="border-top:1px solid var(--line);padding:8px 0"><div style="font-size:13px">'+r.q.html+'</div><div class="sub" style="margin-top:4px">You: <span style="color:var(--red)">'+esc(r.input)+'</span>'+(r.q.type!=="mc"?' · Correct: <span style="color:var(--green)">'+esc(r.q.ans)+'</span>':'')+'</div><div class="sub" style="margin-top:4px">'+(r.q.expl||'')+'</div></div>';
    }
    h+='</div>';
  }
  h+='<div class="row">';
  if(m==="practice")h+='<button class="btn grow" onclick="startPractice(\''+sess.skillId+'\')">Go Again</button>';
  if(m==="beast")h+='<button class="btn red grow" onclick="startBeast()">Another Beast</button>';
  if(m==="blitz")h+='<button class="btn blu grow" onclick="startBlitz()">Run It Back</button>';
  h+='<button class="btn sec grow" onclick="sess=null;go(\'home\')">Home</button></div>';
  el("main").innerHTML=h;
  window.scrollTo(0,0);
}

/* ---------- init ---------- */
(function(){
  load();
  var btns=document.querySelectorAll(".nbtn"),i;
  for(i=0;i<btns.length;i++){
    (function(b){b.onclick=function(){SFX.click();go(b.getAttribute("data-v"));};})(btns[i]);
  }
  document.addEventListener("keydown",function(e){
    if(view!=="train"||!sess)return;
    if(e.key==="Enter"){
      if(sess.locked)nextQ();else submitAns();
    }
  });
  go("home");
})();
</script>
</body>
</html>
