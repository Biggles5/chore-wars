; SightLine node firmware. ESP32-S3, Arduino framework.
; Builds with no hardware attached: `pio run`. Camera support is gated
; behind -DSIGHTLINE_HAS_CAMERA so CI compiles without the sensor stack.
; Proprietary. (c) 2026 Ryan Brown / SightLine. All rights reserved.

[env:sightline-node-s3]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DSIGHTLINE_FW_VERSION=\"0.3.0\"
    -DCORE_DEBUG_LEVEL=1
; enable on bench hardware with the OV5640 wired:
;    -DSIGHTLINE_HAS_CAMERA
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
