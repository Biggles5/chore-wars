<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#121318">
<title>Chore Wars</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#121318;font-family:'Fredoka',sans-serif;color:#F0F0F2;overflow-x:hidden}
input::placeholder{color:#555}
@keyframes confFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(212,175,55,.06)}50%{box-shadow:0 0 40px rgba(212,175,55,.12)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fadeIn{animation:fadeIn .3s ease-out}
.hc{transition:all .18s ease;cursor:pointer}.hc:active{transform:scale(.97)}
.pF{transition:width .8s cubic-bezier(.4,0,.2,1)}
.mn{font-family:'Space Mono',monospace}
.app{background:#121318;min-height:100vh;max-width:500px;margin:0 auto;position:relative}
.hdr{background:linear-gradient(180deg,#1a1b22,#121318);padding:14px 14px 10px;border-bottom:1px solid rgba(255,255,255,0.06)}
.nav{display:flex;justify-content:space-around;padding:6px 4px;background:rgba(18,19,24,0.97);backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,0.06);position:sticky;top:0;z-index:100}
.tab{display:flex;flex-direction:column;align-items:center;padding:6px 8px;border-radius:8px;background:transparent;color:#666;border:none;cursor:pointer;font-family:'Fredoka',sans-serif;transition:all .15s}
.tabA{background:rgba(212,175,55,0.1);color:#D4AF37}
.cd{background:rgba(255,255,255,0.035);border-radius:16px;padding:14px;border:1px solid rgba(255,255,255,0.07);margin-bottom:10px}
.lb{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:#D4AF37;letter-spacing:1.5px;text-transform:uppercase;padding-bottom:6px;margin-bottom:8px;border-bottom:1px solid rgba(212,175,55,0.12)}
.il{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;color:#D4AF37;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.ptr{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,0.06);overflow:hidden}
.pb{height:100%;border-radius:3px}
.ok{text-align:center;margin-top:8px;padding:8px 12px;background:rgba(0,230,118,0.06);border-radius:12px;color:#00E676;font-weight:700;font-size:11px;border:1px solid rgba(0,230,118,0.12)}
.tst{position:fixed;top:0;left:0;right:0;background:rgba(18,19,24,0.97);backdrop-filter:blur(24px);padding:12px;z-index:10000;text-align:center;border-bottom:2px solid #D4AF37}
.inp{padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#F0F0F2;font-size:13px;font-family:'Fredoka',sans-serif;outline:none;width:100%;transition:border-color .2s}.inp:focus{border-color:rgba(212,175,55,0.4)}
.btn{padding:10px 16px;border-radius:10px;border:none;background:rgba(212,175,55,0.12);color:#D4AF37;font-family:'Fredoka',sans-serif;font-weight:700;font-size:12px;cursor:pointer;flex:1;transition:all .18s}.btn:active{transform:scale(.98);background:rgba(212,175,55,0.18)}
.er{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.rr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:10000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(12px)}
.tc{border-radius:18px;padding:20px;margin-bottom:10px;border:1px solid rgba(255,255,255,0.08);text-align:center}
.rw{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid;margin-top:5px;width:100%;cursor:pointer;text-align:left;transition:all .18s}
.dt{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px}
textarea{font-family:'Fredoka',sans-serif}
</style>

var D={
  set:function(p,v){
    try{localStorage.setItem("cw_"+p.replace(/\//g,"_"),JSON.stringify(v))}catch(e){}
    return fetch(FB+"/"+p+".json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(v)}).catch(function(e){console.error("DB write:",e)});
  },
  get:function(p){
    return fetch(FB+"/"+p+".json").then(function(r){return r.json()}).catch(function(){
      try{return JSON.parse(localStorage.getItem("cw_"+p.replace(/\//g,"_")))}catch(e){return null}
    });
  },
  on:function(p,cb){
    // Load once immediately
    D.get(p).then(function(v){if(v!==undefined&&v!==null)cb(v)});
    // Poll every 4 seconds for near-real-time sync
    var iv=setInterval(function(){
      D.get(p).then(function(v){if(v!==undefined&&v!==null)cb(v)}).catch(function(){});
    },4000);
    return function(){clearInterval(iv)};
  }
};
// Firebase stores arrays as objects when indices have gaps — this fixes it
function toArr(v){if(!v)return[];if(Array.isArray(v))return v;if(typeof v==="object"){var a=[];Object.keys(v).forEach(function(k){a.push(v[k])});return a}return[]}
function fixFam(v){var f=toArr(v);f.forEach(function(m){if(m&&m.chores)m.chores=toArr(m.chores)});return f}
function fixHab(v){return toArr(v)}
function fixCfg(v){if(!v||typeof v!=="object")return null;if(v.monthlyActs)v.monthlyActs=toArr(v.monthlyActs);if(v.tripVotes)v.tripVotes=toArr(v.tripVotes);if(v.weeklyRewards)v.weeklyRewards=toArr(v.weeklyRewards);if(v.trips)v.trips=toArr(v.trips);return v}

// ═══ WALKUP SONG PLAYER ═══
var WalkupPlayer=(function(){
  var audio=null;
  var timer=null;
  function stop(){
    if(timer){clearTimeout(timer);timer=null}
    if(audio){try{audio.pause();audio.currentTime=0}catch(e){}audio=null}
  }
  function play(url){
    if(!url)return;
    stop();
    audio=new Audio(url);
    audio.volume=0.7;
    audio.play().catch(function(){});
    timer=setTimeout(function(){stop()},10000);
  }
  return{play:play,stop:stop};
})();

<script type="text/babel">
const{useState,useEffect,useCallback,useRef}=React;

// Error boundary so we never get a blank screen
class ErrWrap extends React.Component{
  constructor(p){super(p);this.state={err:null}}
  static getDerivedStateFromError(e){return{err:e}}
  render(){if(this.state.err)return <div style={{padding:40,textAlign:"center",color:"#FF1744",fontFamily:"monospace"}}><p style={{fontSize:20}}>Something broke</p><p style={{fontSize:12,color:"#888",marginTop:10}}>{this.state.err.message}</p><button onClick={function(){window.location.reload()}} style={{marginTop:16,padding:"8px 16px",borderRadius:8,border:"none",background:"rgba(255,215,0,0.15)",color:"#D4AF37",cursor:"pointer",fontSize:13}}>Reload</button></div>;return this.props.children}
}

function Av(props){var m=props.m,s=props.s||32;if(m&&m.avatar)return <img src={m.avatar} style={{width:s,height:s,borderRadius:"50%",objectFit:"cover",border:(s>30?"3px":"2px")+" solid "+(m.color||"rgba(255,255,255,0.15)"),boxShadow:"0 2px 8px rgba(0,0,0,0.3)"}} />;return <span style={{fontSize:s*0.7}}>{m?m.emoji:""}</span>}

function RaceTimer(props){
  var[now,setNow]=useState(Date.now());
  useEffect(function(){
    var iv=setInterval(function(){setNow(Date.now())},1000);
    return function(){clearInterval(iv)};
  },[]);
  var elapsed=Math.floor((now-props.start)/1000);
  var limit=props.limit||0;
  var remaining=limit>0?Math.max(0,limit-elapsed):0;
  var display=limit>0?remaining:elapsed;
  var min=Math.floor(display/60);var sec=display%60;
  var expired=limit>0&&remaining<=0;
  var urgent=limit>0&&remaining<=30&&remaining>0;
  return <div style={{textAlign:"center",margin:"4px 0"}}>
    <span className="mn" style={{fontSize:22,fontWeight:700,color:expired?"#FF1744":urgent?"#FF6B35":"#D4AF37"}}>{min}:{sec<10?"0":""}{sec}</span>
    <p style={{fontSize:8,color:expired?"#FF1744":"#888"}}>{expired?"TIME'S UP!":limit>0?"TIME LEFT":"RACE TIME"}</p>
  </div>;
}

/* ─── DEFAULTS ─── */

function wkKey(){var x=new Date();x.setHours(0,0,0,0);var d=x.getDay();x.setDate(x.getDate()-d+(d===0?-6:1));return x.toISOString().split("T")[0]}
function dayI(){var d=new Date().getDay();return d===0?6:d-1}

function nxtLv(p){for(var i=0;i<LVS.length;i++)if(p<LVS[i].min)return LVS[i];return null}
var emptyHist=function(){return{perfectFamilyWeeks:0,consecutivePerfect:0,weeklyWinners:[],activity:[],chat:[],totalEarnings:{},challenges:[],extraChores:[],lastClosedWeek:"",votes:{}}};

/* ═══ MAIN APP ═══ */
function App(){
  var[FM,setFM]=useState(DEF_FAM);
  var[HB,setHB]=useState(DEF_HAB);
  var[cfg,setCfg]=useState(DEF_CFG);
  var week=wkKey(), today=dayI();

  var mkWk=function(f,h){var w={};(f||FM).forEach(function(m){w[m.id]={ymyw:false};DAYS.forEach(function(_,i){w[m.id][i]={chores:m.chores.map(function(){return{done:false,ts:null,status:"none",photo:null}}),habits:(h||HB).map(function(){return false}),bonus:BON.map(function(){return false}),note:""}})});return w};

  var[wk,setWk]=useState(null);
  var[hist,setHist]=useState(null);
  var[loading,setLoading]=useState(true);
  var[me,setMe]=useState(null);
  var[pm,setPm]=useState(false);
  var[view,setView]=useState("dash");
  var[conf,setConf]=useState(false);
  var[toast,setToast]=useState("");
  var[showPin,setShowPin]=useState(false);
  var[pinV,setPinV]=useState("");
  var[pinC,setPinC]=useState("");
  var[kidPin,setKidPin]=useState("");
  var[selKid,setSelKid]=useState(null);
  var[pinFails,setPinFails]=useState(0);
  var[lockUntil,setLockUntil]=useState(0);
  var[ct,setCt]=useState("");
  var[cTx,setCTx]=useState("");
  var[cPt,setCPt]=useState("10");
  var[cTm,setCTm]=useState(5);
  var[exDsc,setExDsc]=useState("");
  var[exAmt,setExAmt]=useState("5");
  var[chMsg,setChMsg]=useState("");
  var[eC,setEC]=useState(null);
  var[eF,setEF]=useState(null);
  var[eH,setEH]=useState(null);

  var[histWk,setHistWk]=useState(null);
  var[eMA,setEMA]=useState(null);
  var[eTV,setETV]=useState(null);
  var[eWR,setEWR]=useState(null);
  var[bRej,setBRej]=useState(null);
  var[bRejR,setBRejR]=useState("");
  var[songSearch,setSongSearch]=useState("");
  var[songResults,setSongResults]=useState([]);
  var[songLoading,setSongLoading]=useState(false);
  var[songKid,setSongKid]=useState(null);
  var[songPreview,setSongPreview]=useState(null);
  var prevWk=useRef(null);
  var prevHist=useRef(null);
  var meRef=useRef(null);

  // Detect incoming changes and play sounds for receiver
  var checkIncoming=function(newWk,mid){
    if(!mid||mid==="_parent"||!prevWk.current||!newWk)return;
    var old=prevWk.current;
    var m=FM.find(function(x){return x.id===mid});
    if(!m||!m.chores)return;
    DAYS.forEach(function(_,di){
      m.chores.forEach(function(_2,ci){
        var oldC=old[mid]&&old[mid][di]&&old[mid][di].chores?old[mid][di].chores[ci]:null;
        var newC=newWk[mid]&&newWk[mid][di]&&newWk[mid][di].chores?newWk[mid][di].chores[ci]:null;
        if(!oldC||!newC)return;
        var oldSt=oldC.status||"none";
        var newSt=newC.status||"none";
        if(oldSt==="pending"&&newSt==="approved"){SFX.approve();playWalkup(mid)}
        if(oldSt==="pending"&&newSt==="rejected")SFX.reject();
      });
    });
  };
  var checkNewChallenge=function(newH,mid){
    if(!mid||mid==="_parent"||!prevHist.current||!newH)return;
    var oldCh=prevHist.current.challenges||[];
    var newCh=newH.challenges||[];
    if(newCh.length>oldCh.length){
      var latest=newCh[0];
      if(latest&&latest.to===mid&&latest.status==="pending")SFX.challenge();
    }
    newCh.forEach(function(nc){
      if(!nc||nc.from!==mid&&nc.to!==mid)return;
      var oc=null;
      for(var i=0;i<oldCh.length;i++){if(oldCh[i]&&oldCh[i].id===nc.id){oc=oldCh[i];break}}
      if(!oc)return;
      if(oc.status!=="complete"&&nc.status==="complete"){SFX.perfect();if(nc.winner===mid)playWalkup(mid)}
      if(nc.to===mid&&oc.status==="pending"&&nc.status==="accepted")SFX.challenge();
      if((nc.status==="accepted"||nc.status==="racing")&&oc.status!==nc.status){
        var theirSubmit=nc.from===mid?nc.toSubmit:nc.fromSubmit;
        var oldTheirSubmit=oc.from===mid?oc.toSubmit:oc.fromSubmit;
        if(theirSubmit&&!oldTheirSubmit)SFX.submit();
      }
    });
  };

  // Keep meRef in sync for polling callbacks
  useEffect(function(){meRef.current=me},[me]);

  // lockout timer
  var isLocked=function(){return Date.now()<lockUntil};
  var lockMin=function(){return Math.max(0,Math.ceil((lockUntil-Date.now())/60000))};
  var failP=function(){var f=pinFails+1;setPinFails(f);if(f>=3){setLockUntil(Date.now()+15*60*1000);setPinFails(0);pop("🔒 Locked 15 min!")}else{pop("❌ Wrong PIN ("+(3-f)+" left)")}};

  useEffect(function(){if(lockUntil>0){var iv=setInterval(function(){setLockUntil(function(prev){return prev})},10000);return function(){clearInterval(iv)}}},[lockUntil]);

  // Historical week loading
  var getOffWk=function(off){var d=new Date();d.setDate(d.getDate()+(off*7));d.setHours(0,0,0,0);var dy=d.getDay();d.setDate(d.getDate()-dy+(dy===0?-6:1));return d.toISOString().split("T")[0]};
  var offKey=getOffWk(histOff);
  var offDate=new Date(offKey+"T12:00:00");

  useEffect(function(){if(histOff===0){setHistWk(null);return}D.get("weeks/"+offKey).then(function(v){setHistWk(v||null)})},[offKey,histOff]);

  // Inject avatars into family data (Firebase doesn't store base64)
  var AVT_MAP={kaden:AVT_K,cohen:AVT_C,leighton:AVT_L,bo:AVT_B};
  var injectAv=function(fam){if(!fam||!Array.isArray(fam))return fam;return fam.map(function(m){var copy=Object.assign({},m);if(AVT_MAP[m.id])copy.avatar=AVT_MAP[m.id];return copy})};

  // Initial load — auto-reset Firebase if data is corrupted
  useEffect(function(){
    var unsubs=[];
    D.get("family").then(function(rawF){
      var fOk=Array.isArray(rawF)&&rawF.length>0&&rawF[0]&&rawF[0].id&&Array.isArray(rawF[0].chores);
      if(!fOk){
        console.log("Data corrupted — resetting Firebase to clean defaults");
        D.set("config",DEF_CFG);
        D.set("family",DEF_FAM);
        D.set("habits",DEF_HAB);
        D.set("history",emptyHist());

        setCfg(DEF_CFG);setFM(DEF_FAM);setHB(DEF_HAB);
        setWk(mkWk(DEF_FAM,DEF_HAB));setHist(emptyHist());
        setLoading(false);
        return;
      }
      rawF=injectAv(rawF);
      D.get("config").then(function(c){return c||DEF_CFG}).then(function(c){
      D.get("habits").then(function(h){if(!Array.isArray(h))h=DEF_HAB;return h||DEF_HAB}).then(function(h){
        setCfg(c);setFM(rawF);setHB(h);
        D.get("weeks/"+week).then(function(w){
          if(!w)w=mkWk(rawF,h);
          setWk(w);prevWk.current=w;
          D.get("history").then(function(hi){
            setHist(hi||emptyHist());prevHist.current=hi||emptyHist();

              unsubs.push(D.on("weeks/"+week,function(v){if(v){checkIncoming(v,meRef.current);setWk(v);prevWk.current=v}}));

              unsubs.push(D.on("family",function(v){if(v&&Array.isArray(v))setFM(injectAv(v))}));
              unsubs.push(D.on("habits",function(v){if(v&&Array.isArray(v))setHB(v)}));
            }
          });
        });
      })});
    });
    return function(){unsubs.forEach(function(u){if(u)u()})};
  },[week]);

  // Save helpers
  var sW=function(d){setWk(d);prevWk.current=d;D.set("weeks/"+week,d)};
  var sH=function(h){setHist(h);prevHist.current=h;D.set("history",h)};

  /* ─── CHORE ACTIONS ─── */
  var ensDay=function(d,mid,di){if(d[mid]&&!d[mid][di]){var m2=FM.find(function(x){return x.id===mid});if(m2&&m2.chores)d[mid][di]={chores:m2.chores.map(function(){return{done:false,ts:null,status:"none",photo:null}}),habits:HB.map(function(){return false}),bonus:BON.map(function(){return false}),note:""}}};

    if(di!==today){pop("⏳ Today only!");return}

    var d=JSON.parse(JSON.stringify(wk));

    d[mid][di].chores[ci].status=ok?"approved":"rejected";

          {(eMA||mActs).map(function(a,ai){return <div key={ai} style={{display:"flex",gap:5,marginBottom:4}}><input value={a} onChange={function(e){var arr=JSON.parse(JSON.stringify(eMA||mActs));arr[ai]=e.target.value;setEMA(arr)}} className="inp" style={{flex:1}} /><button onClick={function(){var arr=JSON.parse(JSON.stringify(eMA||mActs));arr.splice(ai,1);setEMA(arr)}} style={{width:28,height:28,borderRadius:6,border:"1px solid rgba(255,255,255,0.06)",background:"rgba(255,255,255,0.03)",color:"#FF1744",fontSize:14,cursor:"pointer"}}>×</button></div>})}
          <button onClick={function(){var arr=JSON.parse(JSON.stringify(eMA||mActs));arr.push("New Activity");setEMA(arr)}} style={{padding:"3px 7px",borderRadius:5,background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.06)",color:"#888",fontSize:9,cursor:"pointer",marginTop:4}}>+ Add</button>
          <button onClick={function(){sC(Object.assign({},cfg,{monthlyActs:eMA||mActs}));setEMA(null);pop("🎉 Activities saved!")}} className="btn" style={{width:"100%",marginTop:6}}>💾 Save Activities</button>
        </div>
        <div className="cd"><p className="il">✈️ TRIP VOTE OPTIONS</p>
          {(eTV||tVotes).map(function(t,ti){return <div key={ti} style={{display:"flex",gap:5,marginBottom:4}}><input value={t} onChange={function(e){var arr=JSON.parse(JSON.stringify(eTV||tVotes));arr[ti]=e.target.value;setETV(arr)}} className="inp" style={{flex:1}} /><button onClick={function(){var arr=JSON.parse(JSON.stringify(eTV||tVotes));arr.splice(ti,1);setETV(arr)}} style={{width:28,height:28,borderRadius:6,border:"1px solid rgba(255,255,255,0.06)",background:"rgba(255,255,255,0.03)",color:"#FF1744",fontSize:14,cursor:"pointer"}}>×</button></div>})}
          <button onClick={function(){var arr=JSON.parse(JSON.stringify(eTV||tVotes));arr.push("New Trip");setETV(arr)}} style={{padding:"3px 7px",borderRadius:5,background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.06)",color:"#888",fontSize:9,cursor:"pointer",marginTop:4}}>+ Add</button>
          <button onClick={function(){sC(Object.assign({},cfg,{tripVotes:eTV||tVotes}));setETV(null);pop("✈️ Trips saved!")}} className="btn" style={{width:"100%",marginTop:6}}>💾 Save Trips</button>
        </div>
        <div className="cd"><p className="il">🍦 WEEKLY FAMILY REWARDS</p>
          {(eWR||wRewards).map(function(r,ri){return <div key={ri} style={{display:"flex",gap:5,marginBottom:4}}><input value={r} onChange={function(e){var arr=JSON.parse(JSON.stringify(eWR||wRewards));arr[ri]=e.target.value;setEWR(arr)}} className="inp" style={{flex:1}} /><button onClick={function(){var arr=JSON.parse(JSON.stringify(eWR||wRewards));arr.splice(ri,1);setEWR(arr)}} style={{width:28,height:28,borderRadius:6,border:"1px solid rgba(255,255,255,0.06)",background:"rgba(255,255,255,0.03)",color:"#FF1744",fontSize:14,cursor:"pointer"}}>×</button></div>})}
          <button onClick={function(){var arr=JSON.parse(JSON.stringify(eWR||wRewards));arr.push("New Reward");setEWR(arr)}} style={{padding:"3px 7px",borderRadius:5,background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.06)",color:"#888",fontSize:9,cursor:"pointer",marginTop:4}}>+ Add</button>
          <button onClick={function(){sC(Object.assign({},cfg,{weeklyRewards:eWR||wRewards}));setEWR(null);pop("🍦 Rewards saved!")}} className="btn" style={{width:"100%",marginTop:6}}>💾 Save Rewards</button>
        </div>
        <div className="cd"><p className="il">💰 ADJUST EARNINGS</p>
          <p style={{fontSize:9,color:"#555",marginBottom:6}}>Manually set any kid's lifetime earnings</p>
          {FM.map(function(m){return <div key={m.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:"1px solid rgba(255,255,255,0.04)"}}><Av m={m} s={18} /><span style={{color:m.color,fontWeight:600,minWidth:70}}>{m.name}</span><span style={{color:"#888",fontSize:11}}>$</span><input type="text" inputMode="numeric" pattern="[0-9]*" value={hist.totalEarnings&&hist.totalEarnings[m.id]?hist.totalEarnings[m.id]:0} onChange={function(e){var h=JSON.parse(JSON.stringify(hist));if(!h.totalEarnings)h.totalEarnings={};h.totalEarnings[m.id]=parseInt(e.target.value)||0;sH(h)}} className="inp" style={{width:70,textAlign:"center"}} /></div>})}
        </div>
        <div className="cd"><p className="il" style={{color:"#FF1744"}}>⚠️ DANGER</p>
          <button onClick={function(){sH(emptyHist());pop("History cleared")}} className="btn" style={{background:"rgba(255,23,68,0.1)",color:"#FF1744",width:"100%",marginBottom:6}}>🗑️ Reset History</button>
          <button onClick={resetWk} className="btn" style={{background:"rgba(255,23,68,0.1)",color:"#FF1744",width:"100%"}}>🔄 Reset Week</button>
        </div>
      </div>}

      </div>
      <div style={{height:80}} />
    </div>
  );
}

/* ═══ MY DAY ═══ */
function MyDay(props){
  var m=props.m,wk=props.wk,td=props.td,cfg=props.cfg,HB=props.HB,wk0=props.wk0,pm=props.pm,isDone=props.isDone;
  var[vd,setVd]=useState(td>=0?td:0);
  var[noteText,setNoteText]=useState("");
  var[rejecting,setRejecting]=useState(null);
  var[rejReason,setRejReason]=useState("");
  var dd=wk&&wk[m.id]?wk[m.id][vd]:null;
  var lv=getLv(props.pts),nx=nxtLv(props.pts);
  var weekStart=new Date(wk0+"T12:00:00");
  var isToday=vd===td,isPast=vd<td,canEdit=isToday||pm;

  var handlePhoto=function(ci){
    var inp=document.createElement("input");inp.type="file";inp.accept="image/*";inp.capture="environment";
    inp.onchange=function(e){var file=e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(ev){
      var img=new Image();img.onload=function(){var canvas=document.createElement("canvas");var max=400;var w=img.width,h=img.height;if(w>max){h=h*(max/w);w=max}if(h>max){w=w*(max/h);h=max}canvas.width=w;canvas.height=h;canvas.getContext("2d").drawImage(img,0,0,w,h);props.doChore(vd,ci,canvas.toDataURL("image/jpeg",0.6))};img.src=ev.target.result};reader.readAsDataURL(file)};
    inp.click();
  };

  return <div className="fadeIn">
    {/* Date */}
    <div className="cd" style={{textAlign:"center",padding:"8px 10px"}}>
      <p style={{fontSize:14,color:"#fff",fontWeight:700}}>{new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"})}</p>
      <p className="mn" style={{fontSize:9,color:"#888",marginTop:2}}>Week of {weekStart.toLocaleDateString("en-US",{month:"short",day:"numeric"})}</p>
    </div>

    {/* Profile */}
    <div style={{textAlign:"center",padding:"6px 0 10px"}}><Av m={m} s={64} /><h2 style={{fontSize:22,color:m.color,fontWeight:700,marginTop:4}}>{m.name}</h2>
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:3}}><span style={{fontSize:12}}>{lv.i}</span><span className="mn" style={{fontSize:10,color:"#888"}}>{lv.n}</span></div>
      {nx&&<div style={{maxWidth:140,margin:"3px auto 0"}}><div style={{height:4,borderRadius:2,background:"rgba(255,255,255,0.06)",overflow:"hidden"}}><div className="pF" style={{height:4,borderRadius:2,background:m.color,width:Math.min((props.pts-lv.min)/(nx.min-lv.min),1)*100+"%"}} /></div><p style={{fontSize:8,color:"#555",marginTop:1}}>{nx.min-props.pts} to {nx.i}</p></div>}
      <div style={{display:"flex",justifyContent:"center",gap:16,marginTop:5}}>
        {[{v:props.pts,l:"Points",c:"#D4AF37"},{v:props.streak,l:"Streak "+props.fire(props.streak),c:"#FF6B35"},{v:props.days+"/6",l:"Days",c:"#00E676"}].map(function(s,i){return <div key={i}><p className="mn" style={{fontSize:18,fontWeight:700,color:s.c}}>{s.v}</p><p style={{fontSize:8,color:"#555",textTransform:"uppercase",letterSpacing:1}}>{s.l}</p></div>})}
      </div>
      {props.days>=6&&<div className="ok">🎉 PERFECT WEEK — ×{cfg.multi}!</div>}

      {/* Streak & Battle Records */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginTop:6}}>
        <div style={{padding:8,borderRadius:10,background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.06)",textAlign:"center"}}>
          <p style={{fontSize:8,color:"#888",textTransform:"uppercase",letterSpacing:1}}>Weekly Streak</p>
          <p className="mn" style={{fontSize:20,color:"#FF6B35",fontWeight:700}}>{props.streak}</p>
          <p style={{fontSize:9,color:"#555"}}>{props.fire(props.streak)} consecutive</p>
        </div>
        <div style={{padding:8,borderRadius:10,background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.06)",textAlign:"center"}}>
          <p style={{fontSize:8,color:"#888",textTransform:"uppercase",letterSpacing:1}}>Perfect Weeks</p>
          <p className="mn" style={{fontSize:20,color:"#00E676",fontWeight:700}}>{props.hist&&props.hist.consecutivePerfect?props.hist.consecutivePerfect:0}</p>
          <p style={{fontSize:9,color:"#555"}}>family streak</p>
        </div>
        <div style={{padding:8,borderRadius:10,background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.06)",textAlign:"center"}}>
          <p style={{fontSize:8,color:"#888",textTransform:"uppercase",letterSpacing:1}}>MVP Wins</p>
          <p className="mn" style={{fontSize:20,color:"#D4AF37",fontWeight:700}}>{props.hist&&props.hist.weeklyWinners?props.hist.weeklyWinners.filter(function(w){return w.winner===m.name}).length:0}</p>
          <p style={{fontSize:9,color:"#555"}}>all-time</p>
        </div>
        <div style={{padding:8,borderRadius:10,background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.06)",textAlign:"center"}}>
          <p style={{fontSize:8,color:"#888",textTransform:"uppercase",letterSpacing:1}}>Battle Wins</p>
          <p className="mn" style={{fontSize:20,color:"#E040FB",fontWeight:700}}>{props.hist&&props.hist.challenges?toArr(props.hist.challenges).filter(function(c){return c&&c.status==="complete"&&c.winner===m.id}).length:0}</p>
          <p style={{fontSize:9,color:"#555"}}>all-time</p>
        </div>
      </div>
    </div>

    {/* Day selector */}
    <div style={{display:"flex",gap:3,marginBottom:10}}>{DAYS.map(function(d,i){
      var isSun=i===6;
      var chOk=!isSun&&m.chores.every(function(_,ci){return isDone(wk&&wk[m.id]&&wk[m.id][i]&&wk[m.id][i].chores?wk[m.id][i].chores[ci]:null)});
      var dayDate=new Date(weekStart);dayDate.setDate(dayDate.getDate()+i);
      var locked=!pm&&i!==td&&i<td;
      return <button key={d} onClick={function(){setVd(i)}} style={{flex:1,padding:"6px 1px",borderRadius:7,cursor:"pointer",textAlign:"center",border:"2px solid "+(vd===i?m.color:chOk?m.color+"44":"rgba(255,255,255,0.06)"),background:vd===i?m.color+"15":chOk?m.color+"06":"rgba(255,255,255,0.02)",opacity:locked?0.5:1}}>
        <p className="mn" style={{fontSize:9,fontWeight:700,color:vd===i?m.color:"#ccc"}}>{d}</p>
        <p style={{fontSize:8,color:vd===i?m.color:"#555"}}>{dayDate.getDate()}</p>
        {isSun&&<span style={{fontSize:8}}>☀️</span>}
        {chOk&&!isSun&&<span style={{fontSize:9}}>⭐</span>}
        {locked&&!isSun&&<span style={{fontSize:8}}>🔒</span>}
        {i===td&&<div style={{width:3,height:3,borderRadius:2,background:m.color,margin:"1px auto 0"}} />}
      </button>})}</div>

    {isPast&&!pm&&<div className="cd" style={{textAlign:"center",padding:8,borderColor:"rgba(255,215,0,0.15)"}}><p style={{fontSize:11,color:"#D4AF37"}}>🔒 Past days are view-only</p></div>}

    {/* Chores */}
    {vd===6?<div className="cd" style={{textAlign:"center",padding:16}}><p style={{fontSize:28}}>☀️</p><p style={{color:"#D4AF37",fontWeight:700,fontSize:14,marginTop:4}}>Sunday — Day Off!</p><p style={{color:"#888",fontSize:11,marginTop:2}}>No chores today. Earn bonus points with habits!</p></div>
    :<div className="cd"><p className="il">🧹 CHORES — {cfg.chorePts}pts</p>
      {m.chores.map(function(ch,ci){
        var c=dd&&dd.chores?dd.chores[ci]:null;
        var st=c?c.status||"none":"none";
        var dn=c&&(c.done||st==="approved");
        var stColor=st==="approved"?"#00E676":st==="pending"?"#D4AF37":st==="rejected"?"#FF1744":"#555";
        var stLabel=st==="approved"?"✅ Approved":st==="pending"?"⏳ Pending":st==="rejected"?"❌ Rejected":"⬜ Not done";
        var isRej=rejecting&&rejecting.ci===ci&&rejecting.di===vd;
        return <div key={ci} style={{borderRadius:9,border:"1px solid "+(dn?m.color:st==="rejected"?"rgba(255,23,68,0.3)":st==="pending"?"rgba(255,215,0,0.3)":"rgba(255,255,255,0.06)"),marginTop:4,background:dn?m.color+"0D":st==="rejected"?"rgba(255,23,68,0.04)":st==="pending"?"rgba(255,215,0,0.04)":"rgba(255,255,255,0.02)",padding:9}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:18}}>{dn?"✅":st==="pending"?"⏳":st==="rejected"?"❌":"⬜"}</span><div><p style={{color:dn?"#fff":"#888",fontWeight:600,fontSize:13}}>{ch}</p>{c&&c.ts&&<p style={{fontSize:8,color:"#555"}}>{fmtT(c.ts)}</p>}</div></div>
            <div style={{textAlign:"right"}}><span className="mn" style={{color:stColor,fontWeight:700,fontSize:9}}>{stLabel}</span><br /><span className="mn" style={{color:dn?m.color:"#333",fontWeight:700,fontSize:12}}>+{cfg.chorePts}</span></div>
          </div>
          {c&&c.photo&&<img src={c.photo} style={{width:"100%",maxHeight:120,objectFit:"cover",borderRadius:6,marginTop:6}} />}
          {st==="rejected"&&c&&c.rejectReason&&<div style={{marginTop:6,padding:6,background:"rgba(255,23,68,0.06)",borderRadius:6,border:"1px solid rgba(255,23,68,0.15)"}}><p style={{fontSize:10,color:"#FF1744"}}>❌ Reason: {c.rejectReason}</p></div>}
          {canEdit&&st==="rejected"&&<button onClick={function(){handlePhoto(ci)}} className="btn" style={{width:"100%",marginTop:6,background:"rgba(255,23,68,0.1)",color:"#FF1744"}}>📸 Resubmit Photo</button>}
          {canEdit&&st!=="approved"&&st!=="pending"&&st!=="rejected"&&<button onClick={function(){handlePhoto(ci)}} className="btn" style={{width:"100%",marginTop:6,background:m.color+"15",color:m.color}}>📸 Take Photo & Submit</button>}
          {pm&&st==="pending"&&!isRej&&<div style={{display:"flex",gap:6,marginTop:6}}><button onClick={function(){props.approveChore(m.id,vd,ci,true)}} className="btn" style={{background:"rgba(0,230,118,0.12)",color:"#00E676"}}>✅ Approve</button><button onClick={function(){setRejecting({mid:m.id,di:vd,ci:ci});setRejReason("")}} className="btn" style={{background:"rgba(255,23,68,0.1)",color:"#FF1744"}}>❌ Reject</button></div>}
          {pm&&isRej&&<div style={{marginTop:6}}><p style={{fontSize:10,color:"#FF1744",fontWeight:700,marginBottom:4}}>Why is this being rejected?</p><input value={rejReason} onChange={function(e){setRejReason(e.target.value)}} className="inp" placeholder="Reason for rejection..." style={{marginBottom:6}} /><div style={{display:"flex",gap:6}}><button onClick={function(){if(!rejReason.trim()){props.pop&&props.pop("Enter a reason");return}props.approveChore(m.id,vd,ci,false,rejReason.trim());setRejecting(null);setRejReason("")}} className="btn" style={{background:"rgba(255,23,68,0.1)",color:"#FF1744"}}>❌ Confirm Reject</button><button onClick={function(){setRejecting(null);setRejReason("")}} className="btn" style={{background:"rgba(255,255,255,0.04)",color:"#888"}}>Cancel</button></div></div>}
        </div>})}
    </div>}

    {/* Notes for missed past days */}
    {vd!==6&&isPast&&dd&&!m.chores.every(function(_,ci){return isDone(dd.chores?dd.chores[ci]:null)})&&<div className="cd">
      <p className="il">📝 NOTE FOR {DAYS[vd]}</p>
      <textarea value={dd.note||noteText} onChange={function(e){if(canEdit)setNoteText(e.target.value)}} placeholder="Why were chores missed?" className="inp" style={{height:60,resize:"none"}} readOnly={!canEdit} />
      {canEdit&&<button onClick={function(){props.submitNote(m.id,vd,noteText||dd.note);setNoteText("");props.pop&&props.pop("📝 Note saved")}} className="btn" style={{width:"100%",marginTop:4}}>📋 Submit Note</button>}
      {dd.note&&<div style={{marginTop:6,padding:6,background:"rgba(255,215,0,0.04)",borderRadius:6,border:"1px solid rgba(255,215,0,0.1)"}}><p style={{fontSize:10,color:"#D4AF37"}}>Note: {dd.note}</p></div>}
    </div>}

    {/* Habits */}
    <div className="cd"><p className="il">📖 HABITS</p>
      {HB.map(function(h,hi){var dn=dd&&dd.habits?dd.habits[hi]:false;return <button key={hi} className="hc rw" onClick={function(){if(canEdit)props.doHabit(vd,hi)}} style={{borderColor:dn?"#D4AF37":"rgba(255,255,255,0.06)",background:dn?"rgba(255,215,0,0.05)":"rgba(255,255,255,0.02)",opacity:canEdit?1:0.5}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:16}}>{dn?"✅":h.icon}</span><p style={{color:dn?"#fff":"#888",fontWeight:600,fontSize:12}}>{h.label}</p></div>
        <span className="mn" style={{color:dn?"#D4AF37":"#333",fontWeight:700,fontSize:12}}>+{h.pts}</span>
      </button>})}
      {dd&&dd.habits&&dd.habits.every(Boolean)&&<div className="ok">💎 HABIT HERO!</div>}
    </div>

    {/* Bonus */}
    <div className="cd"><p className="il">⭐ BONUS</p>
      {BON.map(function(b,bi){var dn=b.type==="weekly"?(wk&&wk[m.id]?wk[m.id].ymyw:false):(dd&&dd.bonus?dd.bonus[bi]:false);return <button key={bi} className="hc rw" onClick={function(){if(canEdit||b.type==="weekly")props.doBonus(vd,bi)}} style={{borderColor:dn?"#E040FB":"rgba(255,255,255,0.06)",background:dn?"rgba(224,64,251,0.05)":"rgba(255,255,255,0.02)",opacity:canEdit||b.type==="weekly"?1:0.5}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:16}}>{dn?"✅":b.icon}</span><div><p style={{color:dn?"#fff":"#888",fontWeight:600,fontSize:12}}>{b.label}</p><p style={{fontSize:8,color:"#555"}}>{b.type==="weekly"?"Weekly — "+(m.group==="ym"?"Young Men's":"Young Women's"):"Daily"}</p></div></div>
        <span className="mn" style={{color:dn?"#E040FB":"#333",fontWeight:700,fontSize:12}}>+{b.pts}</span>
      </button>})}
    </div>

    <div className="cd" style={{background:m.color+"08",borderColor:m.color+"33"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><p style={{color:"#fff",fontWeight:700,fontSize:13}}>{DAYS[vd]} Total</p><p className="mn" style={{color:m.color,fontWeight:700,fontSize:20}}>{props.dayPts(props.me,vd)} pts</p></div></div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrWrap><App /></ErrWrap>);
